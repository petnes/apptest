és."],"clau":"Empara: subsidiària, via judicial esgotada i dret invocat abans.","ref":"art. 53.2 CE; arts. 41 a 44 LOTC"},{"id":"R894-08","b":"1","t":"1.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 8","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":8,"k":"teoria","tr":"concepte","q":"D'acord amb l'Estatut d'autonomia de Catalunya, com és el sistema electoral mitjançant el qual s'elegeixen els diputats que componen el Parlament?","op":["És proporcional i assegura la representació adequada de totes les zones del territori català.","És proporcional i afavoreix la representació de les zones del territori català amb més densitat poblacional.","És un sistema majoritari uninominal i assegura la representació adequada de totes les zones del territori català.","És proporcional al nombre de votants de cada província que hagi acudit a les eleccions."],"c":0,"ex":["Sistema proporcional que ha d'assegurar la representació adequada de totes les zones del territori.","No afavoreix les zones més denses: assegura totes les zones.","No és majoritari.","No es lliga al nombre de votants per província."],"clau":"Parlament: proporcional i amb representació de tot el territori.","ref":"art. 56.2 EAC"},{"id":"R894-09","b":"1","t":"1.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 9","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":9,"k":"teoria","tr":"composicio","q":"D'acord amb la Llei 13/2008, del 5 de novembre, de la presidència de la Generalitat i del Govern, quins són els òrgans superiors de l'Administració de la Generalitat?","op":["El president o presidenta de la Generalitat, el conseller primer o consellera primera del Govern, el vicepresident o vicepresidenta del Govern i els consellers.","El president o presidenta de la Generalitat, el conseller primer o consellera primera del Govern, els consellers i els alts càrrecs.","El president o presidenta de la Generalitat, el conseller primer o consellera primera, els consellers, els alts càrrecs i els òrgans territorials de l'Administració de la Generalitat.","El president o presidenta de la Generalitat, el conseller primer o consellera primera, els consellers, els alts càrrecs i els delegats del Govern."],"c":0,"ex":["Òrgans superiors: president, conseller primer, vicepresident i consellers.","Els alts càrrecs no són òrgans superiors.","Ni alts càrrecs ni òrgans territorials.","Ni alts càrrecs ni delegats."],"clau":"Òrgans superiors = els membres del Govern.","ref":"Llei 13/2008 (òrgans superiors de l'Administració)"},{"id":"R894-10","b":"2","t":"2.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 10","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":10,"k":"teoria","tr":"organ","q":"D'acord amb la Llei 26/2010, del 3 d'agost, de règim jurídic i de procediment de les administracions públiques de Catalunya, qui substitueix el secretari o secretària d'un òrgan col·legiat en cas d'absència, de vacant, de malaltia o per qualsevol altra causa justificada?","op":["El o la vocal de més edat.","El o la vocal més jove.","El president o presidenta.","El vicepresident o vicepresidenta."],"c":1,"ex":["El criteri és el vocal més jove.","Substitueix el secretari el vocal més jove, si les normes de l'òrgan no diuen altra cosa.","El president presideix, no fa de secretari.","El vicepresident substitueix el president, no el secretari."],"clau":"Secretari absent: el vocal més jove; president absent: el vicepresident o el vocal de més edat.","ref":"art. 16 Llei 26/2010"},{"id":"R894-11","b":"2","t":"2.4","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 11","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":11,"k":"teoria","tr":"efecte","q":"D'acord amb l'article 24 de la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques, en els procediments administratius iniciats a sol·licitud de la persona interessada, l'estimació dels quals tingui com a conseqüència que es transfereixin a la persona sol·licitant facultats relatives al domini públic, el venciment del termini màxim sense que s'hagi notificat resolució expressa legitima la persona interessada per entendre-la:","op":["Desestimada.","Inadmesa.","Caducada.","Estimada."],"c":0,"ex":["Quan s'adquiririen facultats sobre el domini públic, el silenci és negatiu.","La inadmissió no és un efecte del silenci.","La caducitat és pròpia dels procediments d'ofici desfavorables.","El silenci positiu és la regla general, però no en domini públic ni servei públic."],"clau":"Silenci negatiu: domini públic, servei públic, dret de petició, impugnació d'actes.","ref":"art. 24.1 LPAC"},{"id":"R894-12","b":"2","t":"2.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 12","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":12,"k":"teoria","tr":"negacio","q":"D'acord amb l'article 40 de la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques, les notificacions de les resolucions administratives han de contenir determinats requisits formals. Quin dels elements següents NO preveu el precepte esmentat?","op":["L'expressió dels recursos que siguin procedents, si escau, en via administrativa i judicial.","L'òrgan davant el qual s'hagin de presentar els recursos.","El termini de resolució dels recursos que es poden interposar i l'opció de recórrer a la mediació.","El text íntegre de la resolució, amb indicació de si posa fi o no a la via administrativa."],"c":2,"ex":["Sí que ho preveu: els recursos procedents.","Sí que ho preveu: l'òrgan davant el qual es presenten.","La notificació indica el termini per interposar recursos, no el termini per resoldre'ls ni cap opció de mediació.","Sí que ho preveu: text íntegre i si posa fi a la via."],"clau":"Notificació: text íntegre, fi de via, recursos, òrgan i termini per interposar-los.","ref":"art. 40.2 LPAC"},{"id":"R894-13","b":"2","t":"2.4","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 13","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":13,"k":"teoria","tr":"excepcio","q":"D'acord amb l'article 21 de la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques, en quin dels supòsits següents l'Administració NO està obligada a dictar una resolució expressa i notificar-la sigui quina sigui la seva forma d'iniciació?","op":["En la prescripció.","En la caducitat del procediment.","En el desistiment de la sol·licitud.","En la terminació del procediment per pacte o conveni."],"c":3,"ex":["Cal resolució expressa declarant la prescripció.","Cal resolució expressa declarant la caducitat.","Cal resolució expressa que accepti el desistiment.","Amb pacte o conveni, i amb declaració responsable o comunicació, no cal resoldre expressament."],"clau":"No cal resoldre: pacte o conveni, comunicació i declaració responsable.","ref":"art. 21.1 LPAC"},{"id":"R894-14","b":"2","t":"2.5","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 14","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":14,"k":"cas","tr":"efecte","q":"D'acord amb l'article 124 de la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques, davant d'un acte administratiu exprés, quina opció té la persona interessada un cop ha transcorregut el termini d'un mes per interposar el recurs de reposició?","op":["Pot interposar un recurs d'alçada en qualsevol moment a partir de l'endemà del dia en què es produeixi l'acte presumpte.","No pot interposar cap recurs en via administrativa, ja que l'acte administratiu esdevé ferm a tots els efectes.","Pot interposar un recurs de reposició en qualsevol moment a partir de l'endemà del dia en què es produeixin els efectes del silenci administratiu.","Únicament pot interposar un recurs contenciós administratiu, sense perjudici, si escau, de la procedència del recurs extraordinari de revisió."],"c":3,"ex":["L'alçada és per a actes que no esgoten la via; aquí es tracta d'un acte que sí que l'esgota.","Queda oberta la via contenciosa (i la revisió extraordinària).","El termini d'un mes ha passat i l'acte era exprés, no presumpte.","Passat el mes, només resta el contenciós administratiu, i si escau el recurs extraordinari de revisió."],"clau":"Reposició fora de termini: contenciós (i revisió extraordinària).","ref":"art. 124.1 LPAC"},{"id":"R894-15","b":"2","t":"2.4","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 15","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":15,"k":"teoria","tr":"requisit","q":"D'acord amb l'article 70 del Decret 76/2020, de 4 d'agost, d'Administració digital, que reconeix el dret de les persones interessades a no aportar les dades i els documents no exigits per les normes aplicables al procediment que ja estiguin en poder de l'Administració de la Generalitat o que hagi elaborat qualsevol Administració pública, quina actuació ha de dur a terme l'Administració en relació amb aquestes dades i documents?","op":["Consultar aquestes dades i documents perquè s'entén que les persones interessades n'autoritzen sempre la consulta per donar a conèixer les circumstàncies del cas concret.","Informar prèviament la persona interessada dels seus drets en matèria de protecció de dades de caràcter personal i sol·licitar-li, en tots els casos, el consentiment exprés per poder consultar aquestes dades i documents.","Garantir que la persona interessada pugui oposar-se expressament a la consulta d'aquestes dades i documents, excepte en supòsits d'investigació o d'inspecció.","Consultar aquestes dades i documents, en tots els casos, per a l'exercici de les potestats administratives que té atribuïdes, d'acord amb el principi de la confiança legítima i actuació correcta dels seus empleats públics."],"c":2,"ex":["No s'entén una autorització automàtica: hi ha dret d'oposició.","No cal consentiment exprés en tots els casos; el model és l'oposició.","L'Administració consulta d'ofici, però garanteix el dret d'oposició expressa, llevat d'investigació o inspecció.","No es consulta en tots els casos sense més."],"clau":"No aportar documents: consulta d'ofici amb dret d'oposició (tret d'inspecció).","ref":"art. 70 Decret 76/2020; art. 28 LPAC"},{"id":"R894-16","b":"2","t":"2.4","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 16","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":16,"k":"teoria","tr":"encreuament","q":"D'acord amb l'article 21 de la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques, en els procediments iniciats a sol·licitud de la persona interessada, a partir de quina data s'ha de comptar el termini màxim per notificar una resolució expressa?","op":["Des de la data en què la sol·licitud hagi tingut entrada al registre electrònic de l'Administració o organisme competent per a la seva tramitació.","Des de la data en què la sol·licitud hagi tingut entrada al registre electrònic de la unitat competent per a la seva tramitació.","Des del dia següent a la data en què la sol·licitud hagi tingut entrada al registre electrònic de l'Administració o organisme competent per a la seva tramitació.","Des del dia següent a la data en què la sol·licitud hagi tingut entrada al registre electrònic de la unitat competent per a la seva tramitació."],"c":0,"ex":["El termini es compta des de la data d'entrada al registre de l'Administració o organisme competent.","El registre és de l'Administració o organisme, no de la unitat.","No és des de l'endemà.","Ni unitat ni endemà."],"clau":"Termini per resoldre a sol·licitud: des de l'entrada al registre de l'Administració competent.","ref":"art. 21.3.b LPAC"},{"id":"R894-17","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 17","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":17,"k":"teoria","tr":"concepte","q":"Quina tipologia de contracte del sector públic té per objecte l'adquisició, l'arrendament financer o l'arrendament, amb opció de compra o sense, de productes o béns mobles?","op":["El contracte de concessió de serveis.","El contracte de subministrament.","El contracte de serveis.","El contracte mixt."],"c":1,"ex":["La concessió de serveis encomana la gestió d'un servei a risc del concessionari.","Subministrament: adquisició, arrendament financer o arrendament de béns mobles.","Els serveis són prestacions de fer.","El mixt combina prestacions de diferents contractes."],"clau":"Béns mobles, comprar o llogar: subministrament.","ref":"art. 16 LCSP"},{"id":"R894-18","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 18","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":18,"k":"teoria","tr":"concepte","q":"Quin dels procediments d'adjudicació de contractes següents té com a finalitat el desenvolupament de productes, serveis o obres innovadors i la compra ulterior dels subministraments, serveis o obres resultants?","op":["El procediment restringit.","El procediment d'associació per a la innovació.","El diàleg competitiu.","El concurs de projectes."],"c":1,"ex":["El restringit selecciona candidats i després licita.","L'associació per a la innovació desenvolupa i després compra el producte innovador.","El diàleg competitiu defineix la solució amb els candidats en contractes complexos.","El concurs de projectes tria plans o projectes (urbanisme, arquitectura...)."],"clau":"Innovar i després comprar: associació per a la innovació.","ref":"art. 177 LCSP"},{"id":"R894-19","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 19","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":19,"k":"teoria","tr":"concepte","q":"En el marc de la contractació pública, quin dels drets següents és un dret del concessionari en un contracte de concessió d'obres?","op":["Modificar unilateralment els terminis i les condicions del contracte.","Establir, si escau, les tarifes màximes per la utilització de les obres.","Interpretar els contractes i resoldre'n els dubtes sobre el compliment.","Percebre la tarifa per ús prevista en el contracte durant el temps de la concessió com a contraprestació econòmica."],"c":3,"ex":["Modificar unilateralment és prerrogativa de l'Administració.","Les tarifes màximes les fixa l'Administració.","Interpretar el contracte també és prerrogativa de l'Administració.","El concessionari té dret a explotar l'obra i percebre la tarifa prevista durant la concessió."],"clau":"El concessionari cobra la tarifa; l'Administració interpreta, modifica i fixa màxims.","ref":"arts. 190 i 263 LCSP"},{"id":"R894-20","b":"3","t":"3.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 20","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":20,"k":"teoria","tr":"encreuament","q":"En els procediments administratius de naturalesa sancionadora, l'òrgan competent per iniciar el procediment pot adoptar la tramitació simplificada?","op":["Sí, quan consideri que existeixen elements de judici suficients per qualificar la infracció com a lleu, sense que la persona interessada s'hi pugui oposar.","Sí, quan consideri que existeixen elements de judici suficients per qualificar la infracció com a greu, sense que la persona interessada s'hi pugui oposar.","En cap cas pot adoptar la tramitació simplificada en un procediment sancionador.","Sí, quan consideri que existeixen elements de judici suficients per qualificar la infracció com a lleu, llevat d'oposició expressa per part de la persona interessada."],"c":0,"ex":["En els sancionadors per infracció lleu, l'interessat no pot oposar-se a la tramitació simplificada.","Només per a infraccions lleus.","Sí que es pot, per a lleus.","En sancionadors la persona interessada no s'hi pot oposar (a diferència de la regla general)."],"clau":"Sancionador lleu: simplificat sense possibilitat d'oposició.","ref":"art. 96.5 LPAC"},{"id":"R894-21","b":"3","t":"3.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 21","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":21,"k":"teoria","tr":"concepte","q":"Com s'inicien els procediments de naturalesa sancionadora?","op":["Sempre d'ofici a conseqüència d'una ordre superior.","Sempre d'ofici a petició raonada d'altres òrgans.","Sempre d'ofici per denúncia.","Sempre d'ofici per acord de l'òrgan competent."],"c":3,"ex":["L'ordre superior és només una de les vies que porten a l'acord d'inici.","La petició raonada és una altra de les vies.","La denúncia no inicia per si sola el procediment.","Sempre d'ofici, i l'acte d'inici és l'acord de l'òrgan competent, sigui per iniciativa pròpia, ordre superior, petició raonada o denúncia."],"clau":"Sancionador: sempre d'ofici, per acord de l'òrgan competent.","ref":"art. 63.1 LPAC"},{"id":"R894-22","b":"5","t":"5.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 22","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":22,"k":"teoria","tr":"encreuament","q":"D'acord amb el Decret legislatiu 1/1997, de 31 d'octubre, pel qual s'aprova la refosa en un Text únic dels preceptes de determinats textos legals vigents a Catalunya en matèria de funció pública, normalment, el personal funcionari, com adquireix el grau personal?","op":["Només pel fet d'haver ocupat durant 2 anys consecutius un o més llocs del nivell corresponent.","Pel fet d'haver ocupat durant 3 anys consecutius o 4 anys amb interrupció un o més llocs del nivell corresponent.","Pel fet d'haver ocupat durant 2 anys consecutius o durant 3 anys amb interrupció un o més llocs del nivell corresponent.","Només pel fet d'haver ocupat durant 3 anys consecutius un o més llocs del nivell corresponent."],"c":2,"ex":["També s'adquireix amb tres anys amb interrupció.","No són tres i quatre anys.","Dos anys consecutius o tres amb interrupció.","No són tres anys consecutius."],"clau":"Grau personal: 2 anys seguits o 3 amb interrupció.","ref":"Decret legislatiu 1/1997 (grau personal)"},{"id":"R894-23","b":"3","t":"3.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 23","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":23,"k":"teoria","tr":"quantia","q":"En relació amb les indemnitzacions reclamades en els procediments de responsabilitat patrimonial de les administracions públiques de Catalunya, a partir de quin import és preceptiu sol·licitar un dictamen a la Comissió Jurídica Assessora?","op":["A partir d'un import igual o superior a 60.000 euros.","A partir d'un import igual o superior a 30.000 euros.","A partir d'un import igual o superior a 50.000 euros.","A partir d'un import superior a 10.000 euros."],"c":2,"ex":["No és el llindar de la CJA.","No és el llindar.","A Catalunya el dictamen de la CJA és preceptiu en reclamacions de 50.000 euros o més (a l'Estat, el Consell d'Estat també des de 50.000).","No és el llindar."],"clau":"Responsabilitat patrimonial: dictamen CJA a partir de 50.000 euros.","ref":"art. 8.3 Llei 5/2005"},{"id":"R894-24","b":"4","t":"4.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 24","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":24,"k":"teoria","tr":"organ","q":"D'acord amb l'article 5 del Text refós de la Llei de finances públiques de Catalunya, aprovat pel Decret legislatiu 3/2002, de 24 de desembre, les modificacions del pressupost de la Generalitat i de les seves entitats autònomes a través de la concessió de crèdits extraordinaris i suplements de crèdit han de ser aprovades per:","op":["Una llei del Parlament.","Un decret del Govern.","Una resolució de la persona titular del departament competent en matèria d'economia i finances.","Un decret del president o presidenta de la Generalitat de Catalunya."],"c":0,"ex":["Els crèdits extraordinaris i suplements de crèdit del pressupost de la Generalitat s'aproven per llei del Parlament.","El Govern no pot aprovar aquestes modificacions per decret.","Tampoc el conseller d'Economia.","Tampoc el president."],"clau":"Crèdit extraordinari i suplement de crèdit: llei del Parlament.","ref":"art. 5 TRLFPC (DL 3/2002)"},{"id":"R894-25","b":"4","t":"4.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 25","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":25,"k":"teoria","tr":"concepte","q":"D'acord amb el Text refós de la Llei de finances públiques de Catalunya, aprovat pel Decret legislatiu 3/2002, de 24 de desembre, els ingressos de dret privat i els rendiments del patrimoni de la Generalitat de Catalunya:","op":["Només formen part de la Hisenda de la Generalitat de Catalunya si es tracta d'interessos financers procedents dels rendiments dels cabals de la Generalitat.","Formen part de la Hisenda de la Generalitat de Catalunya.","No formen part de la Hisenda de la Generalitat de Catalunya, ja que no tenen la consideració d'ingressos de dret públic.","Només formen part de la Hisenda de la Generalitat de Catalunya si es tracta de rendiments procedents del capital immobiliari propi."],"c":1,"ex":["No hi ha aquesta restricció.","La Hisenda de la Generalitat inclou els ingressos de dret públic i els de dret privat, inclosos els rendiments del patrimoni.","Els ingressos de dret privat també són Hisenda.","No hi ha aquesta restricció."],"clau":"Hisenda de la Generalitat: ingressos de dret públic i de dret privat.","ref":"art. 3 TRLFPC (DL 3/2002)"},{"id":"R894-26","b":"4","t":"4.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 26","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":26,"k":"teoria","tr":"concepte","q":"D'acord amb el Text refós de la Llei de finances públiques de Catalunya aprovat pel Decret legislatiu 3/2002, de 24 de desembre, quina de les afirmacions següents és correcta en relació amb el pressupost de la Generalitat de Catalunya en el moment de la seva aprovació?","op":["L'estat d'ingressos ha de ser superior al de despeses, ja que el primer és incert.","L'estat de despeses ha de ser superior al d'ingressos, ja que el primer s'infereix.","Hi ha d'haver equilibri entre l'estat d'ingressos i l'estat de despeses.","L'estat d'ingressos ha de ser superior al de despeses per tal d'atendre les despeses extraordinàries no pressupostades inicialment."],"c":2,"ex":["El pressupost no s'aprova amb superàvit d'ingressos.","Tampoc amb superàvit de despeses.","El pressupost s'aprova equilibrat: ingressos i despeses iguals.","No es preveu cap coixí d'ingressos."],"clau":"Pressupost aprovat: equilibri entre ingressos i despeses.","ref":"TRLFPC (DL 3/2002), principi d'equilibri"},{"id":"R894-27","b":"4","t":"4.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 27","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":27,"k":"teoria","tr":"concepte","q":"D'acord amb el Text refós de la Llei de finances públiques de Catalunya aprovat pel Decret legislatiu 3/2002, de 24 de desembre, com s'anomena l'acte pel qual s'acorda la realització concreta d'obres, la prestació de serveis o el subministrament, amb el qual queda formalitzada la reserva del crèdit per un import i condicions exactament determinats?","op":["Autorització.","Obligació.","Pagament proposat.","Disposició."],"c":3,"ex":["L'autorització aprova la despesa per un import cert o aproximat, sense compromís amb tercers.","L'obligació reconeix el crèdit exigible per un tercer, un cop feta la prestació.","El pagament és l'última fase.","La disposició o compromís formalitza la reserva del crèdit per un import i condicions determinats."],"clau":"A (autoritzar), D (disposar), O (obligació), P (pagar): la D compromet.","ref":"TRLFPC (DL 3/2002), fases de la despesa"},{"id":"R894-28","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 28","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":28,"k":"cas","tr":"efecte","q":"Si un funcionari o funcionària de carrera obligat a participar en un concurs general de mèrits i capacitats no ho fa, quina conseqüència se'n deriva?","op":["Se l'inclou d'ofici en el concurs de trasllats si no ha formalitzat la sol·licitud dins el termini establert.","Se'l remou d'ofici del lloc ocupat provisionalment i reingressa al darrer lloc ocupat amb caràcter definitiu.","Se'l declara d'ofici en situació d'excedència voluntària per interès particular.","Se l'adscriu d'ofici al departament competent en matèria de funció pública i se'l declara en situació d'expectativa de destinació."],"c":2,"ex":["No hi ha inclusió d'ofici en el concurs.","No és la conseqüència legal.","Qui està obligat a concursar i no ho fa passa a excedència voluntària per interès particular.","L'expectativa de destinació és una altra situació."],"clau":"No concursar quan és obligatori: excedència per interès particular.","ref":"Decret legislatiu 1/1997 (provisió de llocs)"},{"id":"R894-29","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 29","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":29,"k":"teoria","tr":"excepcio","q":"D'acord amb l'article 2 de la Llei 21/1987, de 26 de novembre, d'Incompatibilitats del personal al servei de l'Administració de la Generalitat, quina de les activitats següents NO es considera subjecta a incompatibilitat?","op":["Exercir un segon lloc de treball en el sector públic, amb independència de les retribucions, sempre que no afecti la jornada ordinària del lloc principal, atès que hi concorre interès públic.","Exercir el càrrec de regidor o regidora en una corporació local, amb dedicació exclusiva i retribució periòdica.","Impartir activitats formatives en centres oficials destinats a la formació de funcionaris, si no tenen un caràcter permanent i no superen les 75 hores anuals.","Prestar serveis professionals remunerats en mitjans de comunicació, de manera periòdica."],"c":2,"ex":["Un segon lloc públic és incompatible llevat d'excepcions taxades.","La dedicació exclusiva retribuïda com a regidor és incompatible.","La formació ocasional de funcionaris, fins a 75 hores anuals, està exceptuada.","La col·laboració periòdica remunerada està subjecta a incompatibilitat."],"clau":"Excepció: formació de funcionaris no permanent fins a 75 hores l'any.","ref":"art. 2 Llei 21/1987"},{"id":"R894-30","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 30","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":30,"k":"teoria","tr":"concepte","q":"En quina situació administrativa es troba el funcionari o funcionària que ocupa un lloc de treball en comissió de serveis?","op":["En servei actiu.","En serveis especials.","En expectativa de destinació.","En excedència per incompatibilitats respecte a la destinació que té reservada."],"c":0,"ex":["La comissió de serveis és una forma de provisió temporal; qui la fa continua en servei actiu.","Els serveis especials són per a càrrecs polítics i similars.","L'expectativa de destinació és per a qui ha perdut el lloc en un pla d'ocupació.","No hi ha cap excedència."],"clau":"Comissió de serveis = servei actiu.","ref":"Decret legislatiu 1/1997; art. 86 TREBEP"},{"id":"R894-31","b":"3","t":"3.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 31","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":31,"k":"teoria","tr":"requisit","q":"D'acord amb la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques, quina de les afirmacions següents és correcta en relació amb l'inici d'ofici del procediment de responsabilitat patrimonial?","op":["Només pot iniciar-se per acord de l'òrgan competent, per iniciativa pròpia o com a conseqüència d'una ordre superior.","Un cop notificat l'acord d'iniciació es concedeixen 10 dies perquè els particulars presumptament lesionats presentin les al·legacions que considerin convenients.","Les administracions públiques poden iniciar d'ofici un procediment de responsabilitat patrimonial encara que el dret a la reclamació de la persona interessada hagi prescrit.","Només pot iniciar-se a sol·licitud de la persona interessada."],"c":1,"ex":["També per petició raonada o denúncia.","L'acord d'inici es notifica als possibles lesionats i se'ls dona 10 dies per al·legar i proposar prova.","No es pot iniciar d'ofici si el dret a reclamar ha prescrit.","També pot iniciar-se d'ofici."],"clau":"Responsabilitat d'ofici: 10 dies d'al·legacions per als lesionats, i mai si ha prescrit.","ref":"art. 65 LPAC"},{"id":"R894-32","b":"5","t":"5.5","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 32","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":32,"k":"teoria","tr":"efecte","q":"D'acord amb el Codi penal, el delicte de prevaricació ha de ser castigat amb la pena d'inhabilitació especial. Quin efecte jurídic es produeix un cop ha esdevingut ferma la sentència?","op":["La pèrdua de la condició de funcionari o funcionària de carrera respecte de les ocupacions o càrrecs públics identificats en la sentència.","La pèrdua de la condició de funcionari o funcionària de carrera respecte de totes les ocupacions o càrrecs públics a qualsevol Administració pública.","La suspensió d'ocupació mentre dura la pena, sense perdre la condició de funcionari o funcionària.","La privació del dret de sufragi actiu i passiu mentre dura la pena."],"c":0,"ex":["La inhabilitació especial priva definitivament de l'ocupació o càrrec sobre el qual recau, identificat en la sentència.","L'abast a tota ocupació pública és propi de la inhabilitació absoluta.","La suspensió sense pèrdua és una pena diferent (suspensió d'ocupació).","La inhabilitació especial pot afectar el sufragi passiu, no l'actiu."],"clau":"Inhabilitació especial: pèrdua definitiva del càrrec identificat en la sentència.","ref":"art. 42 CP; art. 63 TREBEP"},{"id":"R894-33","b":"6","t":"6.8","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 33","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":33,"k":"teoria","tr":"encreuament","q":"D'acord amb el Reglament general de protecció de dades (RGPD), quina de les afirmacions següents és correcta en relació amb l'exercici dels drets de protecció de dades personals?","op":["El dret d'accés permet a qualsevol persona física o jurídica obtenir la confirmació sobre si s'estan tractant les seves dades personals i, en cas afirmatiu, accedir-hi.","El dret de rectificació només pot exercir-se quan les dades personals siguin inexactes, però no quan siguin incompletes.","El dret a la limitació del tractament implica la supressió automàtica de les dades personals mentre es verifica l'exactitud o la licitud del tractament.","El dret d'accés permet a qualsevol persona física obtenir la confirmació sobre si s'estan tractant les seves dades personals i, en cas afirmatiu, accedir-hi."],"c":3,"ex":["El RGPD protegeix persones físiques, no jurídiques.","La rectificació també cobreix les dades incompletes.","La limitació no suprimeix: marca les dades per restringir-ne el tractament.","El dret d'accés és de la persona física interessada."],"clau":"RGPD: només persones físiques; limitar no és suprimir.","ref":"arts. 15, 16 i 18 RGPD"},{"id":"R871E-036","b":"6","t":"6.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 36","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":36,"k":"teoria","tr":"concepte","q":"En el marc de l'elaboració d'un pressupost per programes, quin tipus d'indicadors de seguiment mesuren la quantitat de productes, activitats o serveis públics produïts, o el nombre de clients servits?","op":["Els indicadors d'input","Els indicadors d'output","Els indicadors de resultats","Els indicadors d'eficiència"],"c":1,"ex":["Els d'input mesuren els recursos emprats.","Els d'output mesuren la producció: productes, activitats, serveis o usuaris atesos.","Els de resultats mesuren els efectes sobre la població.","Els d'eficiència relacionen producció i recursos."],"clau":"Input recursos, output producció, resultat efecte.","ref":"Pressupost per programes de la Generalitat"},{"id":"R871E-037","b":"1","t":"1.6","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 37","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":37,"k":"teoria","tr":"concepte","q":"Quin és l'objecte d'avaluació de l'informe d'impacte econòmic i social que ha d'acompanyar qualsevol projecte de disposició reglamentària?","op":["La repercussió de la disposició reglamentària en els recursos personals i materials i en els pressupostos de la Generalitat, i també les fonts i els procediments de finançament, si escau.","Els costos i els beneficis que implica el projecte de disposició reglamentària exclusivament per als seus destinataris.","Els costos i els beneficis que implica el projecte de disposició reglamentària per als seus destinataris i per a la realitat social i econòmica.","L'impacte que tindrà el projecte de disposició reglamentària en la disminució de les desigualtats i en els índexs de prosperitat i cohesió social, prenent com a referència l'Índex de Desenvolupament Humà (IDH) de les Nacions Unides."],"c":2,"ex":["Això és l'informe d'impacte pressupostari.","No es limita als destinataris.","L'informe d'impacte econòmic i social valora costos i beneficis per als destinataris i per a la realitat social i econòmica.","L'IDH no és el paràmetre de l'informe."],"clau":"Impacte pressupostari: la Generalitat. Impacte econòmic i social: destinataris i societat.","ref":"art. 64 Llei 26/2010"},{"id":"R871E-038","b":"6","t":"6.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 38","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":38,"k":"teoria","tr":"concepte","q":"En el procés de disseny d'un quadre de comandament, les actuacions fan referència a la descripció del que s'ha de fer:","op":["Per assolir els objectius operatius.","Per mesurar els objectius estratègics.","Per assolir les línies estratègiques.","Per mesurar les línies estratègiques."],"c":0,"ex":["Les actuacions concreten què cal fer per assolir els objectius operatius.","Mesurar és cosa dels indicadors, no de les actuacions.","Les línies estratègiques es despleguen en objectius, no directament en actuacions.","Tampoc es mesuren amb actuacions."],"clau":"Línia estratègica, objectiu operatiu, actuació, indicador.","ref":"Metodologia de quadres de comandament de la Generalitat"},{"id":"R871E-044","b":"6","t":"6.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 44","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":44,"k":"teoria","tr":"concepte","q":"Quina de les opcions següents constitueix el conjunt d'eines que poden utilitzar les administracions públiques per definir i garantir determinats estàndards ètics en el comportament dels seus agents i de les seves organitzacions?","op":["Codis laborals i òrgans de supervisió.","Quadres de comandament.","Infraestructura ètica.","Plans estratègics i manuals d'acollida."],"c":2,"ex":["Són només una part.","Els quadres de comandament serveixen per a la gestió, no per a l'ètica.","La infraestructura ètica integra codis, òrgans, formació i canals per garantir estàndards ètics.","No són instruments ètics."],"clau":"Infraestructura ètica: codis, òrgans, formació i canals.","ref":"OCDE, infraestructura ètica"},{"id":"R871E-045","b":"6","t":"6.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 45","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":45,"k":"teoria","tr":"concepte","q":"Quina de les opcions següents és una característica del model CAF?","op":["És un model que només mesura resultats econòmics.","És una eina dissenyada per a les administracions públiques de la UE.","És obligatori segons la normativa catalana.","És equivalent a una norma ISO."],"c":1,"ex":["Mesura agents facilitadors i resultats, no només econòmics.","El CAF (Common Assessment Framework) és el model d'autoavaluació creat per al sector públic europeu.","És voluntari.","No és una norma certificable com les ISO."],"clau":"CAF: autoavaluació per al sector públic europeu.","ref":"Marc comú d'avaluació (CAF), EIPA"},{"id":"R871E-046","b":"6","t":"6.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 46","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":46,"k":"teoria","tr":"requisit","q":"D'acord amb la Llei 19/2014, del 29 de desembre, de transparència, accés a la informació pública i bon govern, quin element ha de contenir necessàriament una carta de serveis?","op":["La planificació de reorganització dels serveis per als propers exercicis.","Les condicions d'accés als serveis.","Els protocols disciplinaris interns per l'incompliment del serveis.","La memòria econòmica del programa pressupostari dels serveis."],"c":1,"ex":["No és contingut de la carta.","La carta ha d'incloure, entre altres, les condicions d'accés, els drets i deures de les persones usuàries i els compromisos de qualitat.","No és contingut de la carta.","No és contingut de la carta."],"clau":"Carta de serveis: serveis, condicions d'accés, drets, compromisos i queixes.","ref":"art. 59 Llei 19/2014"},{"id":"R871E-047","b":"5","t":"5.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 47","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":47,"k":"teoria","tr":"concepte","q":"D'acord amb el Text únic de la Llei de la funció pública de l'Administració de la Generalitat de Catalunya, quina de les opcions següents és una mesura de racionalització de personal?","op":["La modificació puntual de l'horari de treball per necessitats del servei.","La planificació de necessitats de personal basada exclusivament en criteris pressupostaris.","Els plans de formació i capacitació per a la recol·locació del personal.","L'establiment de mesures específiques de promoció interna."],"c":2,"ex":["No és una mesura de racionalització.","La planificació no es basa exclusivament en criteris pressupostaris.","Els plans d'ocupació preveuen formació i capacitació per recol·locar personal.","La promoció interna és un altre instrument."],"clau":"Racionalitzar: plans d'ocupació amb formació i recol·locació.","ref":"Decret legislatiu 1/1997 (plans d'ocupació)"},{"id":"R871E-048","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 48","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":48,"k":"teoria","tr":"excepcio","q":"Es pot concedir una reducció de jornada per interès particular al personal que presta serveis en règim de jornada de dedicació especial?","op":["No, excepte quan disposi d'un informe favorable de la Direcció General de Funció Pública.","Sí, però només amb l'aprovació mitjançant una resolució de la Secretaria General corresponent.","No, en cap cas.","Sí, però només amb l'aprovació del superior jeràrquic i si es garanteix la cobertura del servei."],"c":2,"ex":["No hi ha excepció per informe.","No es pot concedir.","La dedicació especial és incompatible amb la reducció de jornada per interès particular.","No es pot concedir."],"clau":"Dedicació especial i reducció per interès particular no casen.","ref":"Decret 56/2012 (jornada i horaris)"},{"id":"R871E-049","b":"5","t":"5.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 49","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":49,"k":"teoria","tr":"composicio","q":"D'acord amb el Reglament de selecció de personal de l'Administració de la Generalitat de Catalunya, el tribunal qualificador s'ha de constituir amb:","op":["Un nombre senar de membres no inferior a 5 i han de comptar amb el mateix nombre de suplents.","Un nombre parell de membres no inferior a 6 i han de comptar amb el mateix nombre de suplents.","Un nombre senar de membres superior a 5 i han de comptar amb el mateix nombre de suplents.","Un nombre parell de membres no inferior a 4 i han de comptar amb el mateix nombre de suplents"],"c":0,"ex":["Senar, mínim cinc, amb tants suplents com titulars.","El nombre és senar.","Cinc també és vàlid (no inferior a cinc).","El nombre és senar i el mínim, cinc."],"clau":"Tribunal: senar, mínim 5, suplents en paral·lel.","ref":"Decret 28/1986 (Reglament de selecció)"},{"id":"R871E-051","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 51","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":51,"k":"teoria","tr":"termini","q":"D'acord amb l'article 97 del Text refós de la Llei de l'Estatut bàsic de l'empleat públic, quin és el termini de prescripció de les sancions imposades per faltes disciplinàries lleus, comptat des de la fermesa de la resolució sancionadora?","op":["2 anys","1 any","6 mesos","3 mesos"],"c":1,"ex":["Dos anys és per a les sancions per faltes greus.","Les sancions per faltes lleus prescriuen a l'any; les infraccions lleus, als sis mesos.","Sis mesos és la prescripció de la infracció lleu, no de la sanció.","No és cap termini de l'article."],"clau":"Infracció lleu 6 mesos, sanció lleu 1 any; greu 2 anys; molt greu 3 anys.","ref":"art. 97 TREBEP"},{"id":"R871E-052","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 52","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":52,"k":"teoria","tr":"termini","q":"D'acord amb l'article 90 del Text refós de la Llei de l'Estatut bàsic de l'empleat públic, la sanció disciplinària de suspensió de funcions no pot tenir una durada superior a:","op":["2 anys","3 anys","5 anys","6 anys"],"c":3,"ex":["No és el màxim legal.","No és el màxim legal.","No és el màxim legal.","La suspensió ferma pot arribar a sis anys; si supera els sis mesos comporta la pèrdua del lloc."],"clau":"Suspensió: fins a 6 anys; més de 6 mesos, pèrdua del lloc.","ref":"art. 90 TREBEP"},{"id":"R871E-053","b":"5","t":"5.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 53","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":53,"k":"teoria","tr":"encreuament","q":"D'acord amb l'article 5 del Decret 138/2008, de 8 de juliol, d'indemnitzacions per raó del servei, les comissions de servei amb dret a indemnització, llevat de casos excepcionals, no poden tenir una durada superior a:","op":["1 mes, o 3 mesos si s'han de dur a terme en territori estranger. L'òrgan competent pot autoritzar la concessió d'una pròrroga pel temps estrictament indispensable, quan el termini esdevingui insuficient per al compliment total del servei.","3 mesos, o 6 mesos si s'han de dur a terme en territori estranger. L'òrgan competent pot autoritzar la concessió d'una pròrroga pel temps estrictament indispensable quan el termini esdevingui insuficient per al compliment total del servei.","6 mesos. L'òrgan competent pot autoritzar la concessió d'una pròrroga pel temps estrictament indispensable, quan el termini esdevingui insuficient per al compliment total del servei.","1 mes, o 2 mesos si s'han de dur a terme en territori estranger. Aquests límits de durada màxima no són prorrogables."],"c":0,"ex":["Un mes (tres a l'estranger), prorrogable pel temps indispensable.","No són tres i sis mesos.","No són sis mesos.","A l'estranger són tres mesos i sí que es pot prorrogar."],"clau":"Comissió indemnitzable: 1 mes, 3 a l'estranger, prorrogable.","ref":"art. 5 Decret 138/2008"},{"id":"R871E-054","b":"5","t":"5.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 54","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":54,"k":"teoria","tr":"concepte","q":"D'acord amb l'article 4 del Decret 2/2005, d'11 de gener, sobre el règim jurídic del personal eventual de l'Administració de la Generalitat de Catalunya:","op":["La provisió de llocs de personal eventual es duu a terme mitjançant convocatòria pública i pel sistema de lliure designació.","Per la naturalesa especial de les seves funcions, la provisió de llocs de personal eventual es fa sense necessitat de convocatòria pública i tampoc s'han de publicar les resolucions de nomenament de personal eventual; només s'han de notificar a les persones interessades.","La presa de possessió als llocs de treball de personal eventual ha de ser objecte d'inscripció al Registre General de Personal.","El personal eventual pot ser nomenat per la persona titular de la Secretaria General del departament corresponent."],"c":2,"ex":["No hi ha convocatòria pública.","Els nomenaments sí que es publiquen.","La presa de possessió s'inscriu al Registre General de Personal.","El nomena l'òrgan competent (conseller o alt càrrec), no el secretari general per aquest fet."],"clau":"Eventual: sense convocatòria, però amb publicació i inscripció al registre.","ref":"art. 4 Decret 2/2005"},{"id":"R871E-055","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 55","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":55,"k":"teoria","tr":"termini","q":"D'acord amb el VI Conveni col·lectiu únic del personal laboral de la Generalitat de Catalunya, es pot destinar el personal laboral fix a realitzar tasques corresponents a una categoria professional inferior a la que té?","op":["Sí, sempre que sigui per necessitats peremptòries i imprevisibles de l'activitat productiva i pel temps imprescindible, que no podrà excedir en cap cas els 2 mesos cada any.","Sí, sempre que sigui per necessitats peremptòries i imprevisibles de l'activitat productiva i pel temps imprescindible, que no podrà excedir en cap cas els 3 mesos cada any. Aquest període és prorrogable excepcionalment per 3 mesos més, prèvia consulta als representants dels treballadors.","No, només es pot encomanar al personal laboral l'exercici de tasques corresponents a una categoria professional superior a la que tinguin, de la mateixa àrea funcional o, si és d'una altra àrea funcional, sempre que sigui del grup immediatament superior.","No, només en el cas del personal laboral temporal, per necessitats peremptòries i imprevisibles de l'activitat productiva i pel temps imprescindible, que no podrà excedir en cap cas els 3 mesos cada any."],"c":0,"ex":["Sí, per necessitats peremptòries i imprevisibles, com a màxim dos mesos l'any.","El límit són dos mesos, sense la pròrroga descrita.","Sí que es pot, amb límits.","També s'aplica al personal fix."],"clau":"Categoria inferior: màxim 2 mesos l'any.","ref":"VI Conveni col·lectiu únic (treballs de categoria inferior)"},{"id":"R871E-056","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 56","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":56,"k":"teoria","tr":"concepte","q":"Els contractes sotmesos a la Llei 9/2017, de 8 de novembre, de contractes del sector públic s'identifiquen per l'aplicació:","op":["Del valor econòmic del contracte.","Del codi CSP.","Del codi que determini cada administració pública.","Del vocabulari comú de contractes públics."],"c":3,"ex":["El valor no identifica l'objecte.","No existeix.","Hi ha un vocabulari comú europeu.","El CPV (vocabulari comú de contractes públics) identifica l'objecte dels contractes."],"clau":"CPV: el codi comú europeu de l'objecte del contracte.","ref":"art. 2.2 LCSP"},{"id":"R871E-057","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 57","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":57,"k":"teoria","tr":"encreuament","q":"D'acord amb la Llei 9/2017, de 8 de novembre, de contractes del sector públic, els contractes d'obres i de serveis subvencionats per poders adjudicadors estan subjectes a regulació harmonitzada quan són subvencionats:","op":["De forma indirecta i en més d'un 50% del seu import.","De forma directa i en més d'un 50% del seu import.","De forma directa i en més d'un 60% del seu import.","De forma indirecta i en més d'un 60% del seu import."],"c":1,"ex":["La subvenció ha de ser directa.","Subvenció directa i superior al 50 % de l'import, més els llindars.","El percentatge és el 50 %.","Ni indirecta ni 60 %."],"clau":"Contracte subvencionat harmonitzat: directa i més del 50 %.","ref":"art. 23 LCSP"},{"id":"R871E-058","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 58","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":58,"k":"teoria","tr":"concepte","q":"Els òrgans de contractació han de donar publicitat mitjançant internet:","op":["Només dels anuncis de licitació dels contractes.","Només dels anuncis de licitació i d'adjudicació dels contractes.","Només dels plecs de clàusules administratives i de prescripcions tècniques.","De tota la documentació necessària per licitar."],"c":3,"ex":["No només la licitació.","No només licitació i adjudicació.","No només els plecs.","El perfil de contractant ha d'oferir tota la documentació necessària per licitar."],"clau":"Perfil de contractant: tot el que cal per licitar.","ref":"art. 63 LCSP"},{"id":"R871E-059","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 59","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":59,"k":"teoria","tr":"efecte","q":"En matèria de contractació pública, la modificació del plec de prescripcions tècniques particulars després de l'adjudicació del contracte:","op":["Pot comportar la retroacció d'actuacions.","Comporta la retroacció d'actuacions quan es modifiquin d'ofici per l'òrgan de contractació.","Comporta la retroacció d'actuacions quan es modifiquin a petició de l'adjudicatari.","No pot comportar la retroacció d'actuacions, sense excepcions."],"c":0,"ex":["Els plecs es poden modificar amb retroacció d'actuacions, en els termes legals.","No depèn de qui la promou.","No depèn de qui la promou.","Sí que pot comportar-la."],"clau":"Modificar plecs després d'adjudicar: retroacció possible.","ref":"art. 122.1 LCSP"},{"id":"R871E-060","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 60","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":60,"k":"teoria","tr":"concepte","q":"Els contractes subscrits pels poders adjudicadors són invàlids quan:","op":["La invalidesa no derivi de la il·legalitat de les seves clàusules.","Hi concorri alguna de les causes d'invalidesa de dret natural.","En els actes preparatoris o del procediment d'adjudicació es presentin algunes de les causes d'invalidesa de dret administratiu.","En els actes preparatoris o del procediment d'adjudicació es presentin algunes de les causes d'invalidesa de dret mercantil."],"c":2,"ex":["La il·legalitat de les clàusules és causa d'invalidesa.","No existeix.","Són invàlids quan els actes preparatoris o d'adjudicació incorren en causes d'invalidesa de dret administratiu (nul·litat o anul·labilitat).","Les causes són de dret administratiu (o civil), no mercantil."],"clau":"Invalidesa del contracte: vicis administratius en la preparació o adjudicació.","ref":"art. 38 LCSP"},{"id":"R871E-061","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 61","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":61,"k":"teoria","tr":"encreuament","q":"La modificació d'un contracte celebrat per un poder adjudicador que no és administració pública es regeix per:","op":["Les normes de dret privat, i no s'hi aplica la Llei 9/2017, de 8 de novembre.","La Llei 9/2017, de 8 de novembre, i no s'hi apliquen les normes de dret privat.","Les normes de dret privat, però s'hi aplica la Llei 9/2017, de 8 de novembre, pel que fa als supòsits de modificació del contracte.","La Llei 9/2017, de 8 de novembre, en el cas que el plec de clàusules administratives particulars no prevegi la modificació del contracte."],"c":2,"ex":["Els supòsits de modificació de la LCSP sí que s'apliquen.","El règim general és el dret privat.","Efectes i extinció en dret privat, però amb la LCSP en modificació (i cessió, subcontractació, rescissió).","No depèn del plec."],"clau":"Poder adjudicador no AP: dret privat, però modifica com diu la LCSP.","ref":"art. 319 LCSP"},{"id":"R871E-062","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 62","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":62,"k":"teoria","tr":"encreuament","q":"No es pot modificar un contracte:","op":["Sense el dictamen previ de la Comissió Jurídica Assessora.","Sense el dictamen previ de la Comissió Jurídica Assessora, quan el plec de clàusules administratives no prevegi la modificació i la seva quantia, aïllada o conjuntament, sigui superior a un 20% del preu inicial del contracte, IVA exclòs, i el seu preu sigui superior a 3.000.000 d'euros.","Sense el dictamen previ del Consell d'Estat, quan el plec de clàusules administratives no prevegi la modificació i la seva quantia, aïllada o conjuntament, sigui superior a un 20% del preu inicial del contracte, IVA exclòs, i el seu preu sigui superior a 6.000.000 d'euros.","Sense el dictamen previ de la Comissió Jurídica Assessora, quan el plec de clàusules administratives no prevegi la modificació i la seva quantia, aïllada o conjuntament, sigui superior a un 20% del preu inicial del contracte, IVA exclòs, i el seu preu sigui igual o superior a 6.000.000 d'euros."],"c":3,"ex":["No cal sempre.","El llindar de preu és de sis milions.","A Catalunya l'òrgan és la Comissió Jurídica Assessora, i el preu ha de ser igual o superior a sis milions.","Modificació no prevista, més del 20 % i preu igual o superior a 6.000.000 €: dictamen preceptiu de la CJA."],"clau":"Modificació no prevista: 20 % i 6 milions = dictamen CJA.","ref":"art. 191.3.b LCSP; Llei 5/2005"},{"id":"R871E-063","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 63","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":63,"k":"teoria","tr":"concepte","q":"En matèria de subvencions de les administracions públiques, els membres d'una comunitat de béns responen d'una sanció pecuniària de manera:","op":["Solidària","Mancomunada","Individual","Subsidiària"],"c":0,"ex":["Els membres d'agrupacions sense personalitat responen solidàriament de la sanció.","No és mancomunada.","No és individual.","No és subsidiària."],"clau":"Comunitat de béns sancionada: tots responen solidàriament.","ref":"art. 69.2 LGS"},{"id":"R871E-064","b":"6","t":"6.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 64","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":64,"k":"teoria","tr":"concepte","q":"Quina de les opcions següents és l'instrument que té com a objectiu principal assegurar l'assoliment dels 17 objectius de desenvolupament sostenible mitjançant les polítiques públiques impulsades i gestionades per la Generalitat de Catalunya?","op":["El Pla nacional per a l'Agenda 2030.","L'Estratègia Catalana d'Adaptació al Canvi Climàtic.","El Pla d'Acció Auto+ per a l'Agenda 2030.","L'Estratègia mediterrània MedCat 2030."],"c":0,"ex":["El Pla nacional per a l'Agenda 2030 recull els compromisos de la Generalitat amb els ODS.","És un instrument climàtic.","No existeix amb aquest abast.","És una estratègia de projecció mediterrània."],"clau":"ODS a Catalunya: Pla nacional per a l'Agenda 2030.","ref":"Acord GOV/1/2020"},{"id":"R871E-065","b":"5","t":"5.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 65","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":65,"k":"teoria","tr":"concepte","q":"D'acord amb el Text únic de la Llei de la funció pública de l'Administració de la Generalitat de Catalunya, quins son els mitjans per accedir als cossos i les escales de funcionaris o a les categories laborals?","op":["Procediments d'oposició, concurs o promoció interna, amb caràcter general, els cursos de formació o la fase de prova que determini la convocatòria.","Procediments d'oposició, concurs o lliure designació, segons el lloc de treball i, si escau, els cursos de formació o la fase de prova que determini la convocatòria.","Procediments de concurs oposició o concurs, borsa de treball i, si escau, cursos de formació o la fase de prova que determini la convocatòria.","Procediments d'oposició, concurs oposició o concurs i, si escau, els cursos de formació o la fase de prova que determini la convocatòria."],"c":3,"ex":["La promoció interna no és un sistema selectiu en si.","La lliure designació és provisió, no accés.","La borsa de treball no és un sistema d'accés.","Oposició, concurs oposició o concurs, més els cursos o la fase de prova que fixi la convocatòria."],"clau":"Accedir: oposició, concurs oposició o concurs.","ref":"Decret legislatiu 1/1997 (sistemes de selecció)"},{"id":"R871E-066","b":"5","t":"5.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 66","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":66,"k":"teoria","tr":"concepte","q":"D'acord amb l'article 103 del Text únic de la Llei de la funció pública de l'Administració de la Generalitat de Catalunya, quina de les següents opcions és una retribució complementària:","op":["Les pagues extraordinàries.","Les gratificacions per serveis extraordinaris.","Els triennis.","La participació en les sancions pecuniàries imposades, que només pot percebre el personal dels cossos tributaris i respecte dels expedients en què hagi intervingut directament."],"c":1,"ex":["Les pagues extraordinàries són bàsiques.","Les gratificacions per serveis extraordinaris són complementàries.","Els triennis són bàsics.","No existeix aquesta retribució."],"clau":"Bàsiques: sou, triennis, pagues. Complementàries: destinació, específic, productivitat, gratificacions.","ref":"art. 103 Decret legislatiu 1/1997"},{"id":"R871E-068","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 68","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":68,"k":"cas","tr":"calcul","q":"Com a responsable de contractació del Departament de Cultura, us demanen que calculeu el valor estimat del contracte del servei de neteja. El pressupost base de licitació és de 121.000 euros (21 % d'IVA inclòs). El termini d'execució és d'un any, amb una modificació prevista d'un màxim del 20 % anual i una pròrroga per 2 anys més. Quin és el valor estimat del contracte?","op":["120.000 euros","360.000 euros","439.230 euros","300.000 euros"],"c":1,"ex":["Cal treure l'IVA i sumar pròrrogues i modificacions.","Base sense IVA 100.000 € per any; 3 anys (1 més 2 de pròrroga) fan 300.000 €; més el 20 % de modificació, 360.000 €.","No cal aplicar el 21 % sobre res: l'IVA queda fora.","Falta afegir la modificació prevista del 20 %."],"clau":"Valor estimat: sense IVA, amb pròrrogues i modificacions previstes.","ref":"art. 101 LCSP"},{"id":"R871E-069","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 69","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":69,"k":"cas","tr":"requisit","q":"Treballeu com a responsable de contractació al Servei Meteorològic de Catalunya, entitat de dret públic de la Generalitat que té la consideració d'administració pública a l'efecte de la legislació contractual. L'entitat ha de contractar el servei de gestió i manteniment de les estacions meteorològiques automàtiques que hi ha a Catalunya. A un company vostre li han encarregat que redacti el plec de clàusules administratives que ha de regir la licitació, però no té gaire experiència i us demana, com a expert en la matèria, si el contracte està subjecte a regulació harmonitzada. Què li respondríeu?","op":["No, perquè el Servei Meteorològic de Catalunya no és un poder adjudicador.","Sí, si és un contracte subvencionat de manera directa en més del 40% de l'import.","No, perquè és un contracte que la legislació contractual estableix que no està subjecte a regulació harmonitzada.","Sí, si el valor estimat del contracte és igual o superior a la quantia que estableix la legislació contractual."],"c":3,"ex":["Sí que és poder adjudicador (i administració pública).","El criteri de subvenció és el 50 %, i no és el cas.","Els serveis no estan exclosos de la regulació harmonitzada.","Un contracte de serveis d'una administració pública és harmonitzat si el valor estimat arriba al llindar."],"clau":"Harmonitzat = tipus de contracte, poder adjudicador i llindar.","ref":"arts. 19 i 22 LCSP"},{"id":"R871E-070","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 70","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":70,"k":"cas","tr":"organ","q":"El Departament de la Presidència ha de contractar el servei de control horari del Departament, per un valor estimat de 14.000 euros. Us demanen, com a responsable de la contractació, que determineu qui ha d'adjudicar el contracte:","op":["El director o directora general de contractació pública.","El conseller o consellera.","El secretari o la secretària general, o la persona en qui delegui.","L'òrgan que aprovi la licitació."],"c":2,"ex":["No és òrgan de contractació del departament.","A la Generalitat l'òrgan de contractació ordinari és el secretari general, no el conseller.","El secretari general del departament (o qui en tingui la delegació) és l'òrgan de contractació.","Resposta circular."],"clau":"Òrgan de contractació departamental: el secretari general.","ref":"Organització de la contractació de la Generalitat"},{"id":"R871E-071","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 71","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":71,"k":"cas","tr":"concepte","q":"Treballeu al Servei de Contractació del departament competent en l'atenció a la infància i l'adolescència i us demanen quin és el procediment adequat per tramitar la prestació del servei social d'atenció a un grup de menors d'edat estrangers no acompanyats que acaba d'arribar a Catalunya. La xarxa de serveis socials està saturada, fet que posa en greu perill els drets i la integritat física dels nouvinguts. Què proposareu?","op":["Un contracte verbal per urgència","Una tramitació d'emergència","Un procediment obert simplificat","Un contracte menor"],"c":1,"ex":["El contracte verbal només és possible en emergència, i el concepte correcte és la tramitació d'emergència.","Perill greu per a persones: tramitació d'emergència, sense expedient previ.","Massa lent per a un perill greu i immediat.","No respon a la urgència ni s'ajusta a l'import."],"clau":"Perill greu: emergència (art. 120). Pressa sense perill: urgència (art. 119).","ref":"art. 120 LCSP"},{"id":"R871E-072","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 72","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":72,"k":"cas","tr":"requisit","q":"Treballeu al Servei de Contractació del Centre de Telecomunicacions i Tecnologies de la Informació (CTTI), entitat de dret públic de la Generalitat. La responsable del contracte del servei de manteniment de les aplicacions de la Generalitat de Catalunya, adjudicat el maig de 2019 a Global Service TIC, SA, planteja modificar-lo perquè ha augmentat de manera imprevisible la necessitat de la ciutadania de relacionar-se digitalment a causa d'una epidèmia de grip. Es tracta d'un contracte d'un import inicial de 13.100.000 euros (IVA exclòs) i l'import de la modificació proposada és de 4.000.000 d'euros. Se us planteja, com a expert en la matèria, si cal demanar el dictamen de la Comissió Jurídica Assessora. Què li aconselleu?","op":["No, perquè l'import de la modificació és menor de 6.000.000 d'euros.","Sí, perquè es tracta d'una modificació contractual.","Sí, perquè es compleixen tots els requisits legals.","No, perquè el dictamen és facultatiu si la modificació no està prevista en els plecs de clàusules administratives particulars."],"c":2,"ex":["Els sis milions es refereixen al preu del contracte, no a la modificació.","No tota modificació exigeix dictamen.","Modificació no prevista, superior al 20 % (4 de 13,1 milions és un 30 %) i preu del contracte superior a 6 milions: dictamen preceptiu.","És preceptiu, no facultatiu."],"clau":"Aplica la regla: no prevista, més del 20 %, preu de 6 milions o més.","ref":"art. 191.3.b LCSP"},{"id":"R871E-073","b":"2","t":"2.4","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 73","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":73,"k":"cas","tr":"concepte","q":"Participeu com a ponent en unes jornades de tramitació electrònica, i una persona del públic us pregunta què és la interoperabilitat semàntica. Li responeu que, segons disposa el Reial decret 4/2010, de 8 de gener, pel qual es regula l'Esquema Nacional d'Interoperabilitat en l'àmbit de l'Administració Electrònica, és aquella dimensió de la interoperabilitat relativa:","op":["A la capacitat de les entitats i dels processos a través dels quals duen a terme les seves activitats per col·laborar per assolir èxits mútuament acordats relatius als serveis que presten.","Al fet que la informació intercanviada pugui ser interpretable de forma automàtica i reutilitzable per aplicacions que no van intervenir en la seva creació.","A la relació entre sistemes i serveis de tecnologies de la informació, incloent-hi aspectes com ara les interfícies, la interconnexió, la integració de dades i serveis, la presentació de la informació, l'accessibilitat i la seguretat, o altres de naturalesa anàloga.","A la interacció entre elements que corresponen a diverses onades tecnològiques; es manifesta especialment en la conservació de la informació en suport electrònic."],"c":1,"ex":["Això és la interoperabilitat organitzativa.","Semàntica: la informació s'entén i es reutilitza automàticament per aplicacions alienes a la seva creació.","Això és la interoperabilitat tècnica.","Això és la interoperabilitat en el temps."],"clau":"Organitzativa (qui), semàntica (què vol dir), tècnica (com), temporal (quan).","ref":"art. 3 RD 4/2010 (ENI)"},{"id":"R871E-074","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 74","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":74,"k":"cas","tr":"excepcio","q":"El Servei de Contractació us fa l'observació que el Centre de Telecomunicacions i Tecnologies de la Informació (CTTI), és un poder adjudicador que no té la consideració d'administració pública, i els seus contractes es regeixen per normes de dret privat. Hi esteu d'acord?","op":["No, perquè no cal distingir entre el règim de preparació i adjudicació i el règim relatiu als efectes i a l'extinció del contracte.","No, perquè els contractes es regeixen per normes de dret públic.","Sí, però només pel que fa als efectes i l'extinció dels contractes, amb algunes excepcions.","Sí, però només pel que fa als efectes i l'extinció dels contractes, sense cap excepció."],"c":2,"ex":["Sí que cal distingir: preparació i adjudicació segueixen la LCSP.","Els efectes i l'extinció són de dret privat.","Preparació i adjudicació per la LCSP; efectes i extinció en dret privat, amb excepcions (modificació, cessió, subcontractació, rescissió).","Hi ha excepcions."],"clau":"Poder adjudicador no AP: adjudica en públic, executa en privat amb excepcions.","ref":"arts. 317 a 319 LCSP"},{"id":"R871E-075","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 75","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":75,"k":"cas","tr":"requisit","q":"Infraestructures de la Generalitat de Catalunya, SAU, poder adjudicador que no és administració pública a l'efecte de la legislació contractual, necessita modificar un contracte signat amb l'empresa Projectes i Carreteres, SA, per executar les obres de condicionament de la carretera C-63. A causa de diverses incidències aparegudes en el decurs de les obres, s'ha redactat un projecte modificat. En tractar-se d'una modificació no prevista en el plec de clàusules administratives, el responsable del contracte us demana, com a especialista en la matèria, si cal donar audiència a la contractista. Què li respondríeu?","op":["Sí, i la contractista ha de donar per escrit la conformitat a la modificació.","No, perquè la modificació és obligatòria per a la contractista.","Sí, i la contractista ha de donar, per escrit o verbalment, la conformitat a la modificació.","No, perquè la modificació no és obligatòria per a la contractista."],"c":0,"ex":["Per als poders adjudicadors no administració pública, la modificació no prevista requereix la conformitat escrita del contractista.","Per a aquests poders adjudicadors la modificació no és obligatòria per al contractista.","La conformitat ha de ser per escrit.","Sí que cal audiència i conformitat."],"clau":"Poder adjudicador no AP: modificació no prevista només amb conformitat escrita del contractista.","ref":"art. 319 LCSP"},{"id":"R871E-076","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 76","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":76,"k":"cas","tr":"efecte","q":"Sistema d'Emergències Mèdiques, SA (SEM), societat mercantil adscrita al Servei Català de la Salut, va contractar l'1 de gener de 2022 el servei d'atenció psicològica en ambulàncies. El contracte, adjudicat pel procediment obert, va finalitzar el 31 de desembre de 2024, però l'empresa va continuar prestant el servei a instàncies del SEM, fins a l'1 de gener de 2026, quan es va adjudicar el nou contracte a una altra empresa, també pel procediment obert. Com a responsable de la contractació de l'empresa trobeu correcta la prestació del servei durant el 2025?","op":["No, perquè és un encàrrec verbal nul.","Sí, perquè el servei és de caràcter essencial.","Sí, perquè hi ha hagut un retard en la tramitació de la licitació del nou contracte.","Sí, perquè la pròrroga és forçosa fins a la nova adjudicació."],"c":0,"ex":["Continuar sense contracte és un encàrrec verbal prohibit i nul.","L'essencialitat no habilita a contractar sense contracte.","El retard no ho justifica.","La pròrroga forçosa exigeix anunci de licitació tres mesos abans del venciment i té un màxim de nou mesos."],"clau":"Sense contracte no hi ha servei: pròrroga forçosa només si es va licitar a temps.","ref":"arts. 29.4 i 37 LCSP"},{"id":"R871E-077","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 77","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":77,"k":"cas","tr":"termini","q":"Treballeu com a responsable de tramitació de subvencions en el departament competent en matèria d'empresa, el qual ha concedit a l'Associació Empresarial Tecnològica una subvenció de 15.000 euros per fomentar l'emprenedoria. L'Associació, però, només ha justificat parcialment, dins del termini previst, les despeses corresponents a les actuacions de foment realitzades. Què ha de fer el Departament?","op":["Requerir a l'Associació que presenti la documentació justificativa en el termini improrrogable de 15 dies, a fi d'evitar les sancions que li puguin pertocar.","Requerir a l'Associació que presenti la documentació justificativa en el termini de 15 dies, ampliable en 7 dies més si ho sol·licita.","Iniciar el procediment de revocació de la subvenció.","Requerir a l'Associació que presenti la documentació justificativa en el termini improrrogable de 15 dies."],"c":3,"ex":["El requeriment no es fa per evitar sancions.","El termini és improrrogable.","Abans de revocar cal requerir.","Cal requerir la justificació en el termini improrrogable de quinze dies; si no, es perd el dret al cobrament."],"clau":"Justificació incompleta: requeriment de 15 dies improrrogables.","ref":"art. 70.3 RLGS (RD 887/2006)"},{"id":"R871E-078","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 78","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":78,"k":"cas","tr":"concepte","q":"El Departament de Recerca i Universitats vol fer una aportació complementària per finançar les despeses de funcionament d'una universitat pública en concret, lligada al fet que aquesta universitat atén una població geogràficament dispersa i també a l'assoliment d'un objectiu específic de millora de la qualitat del servei que ofereix. Quin és l'instrument idoni per fer-ho?","op":["Un contracte-programa.","Un encàrrec de gestió, amb clàusules que penalitzin l'incompliment de l'objectiu establert.","Un conveni-programa acadèmic-docent.","Un acord-marc de serveis."],"c":0,"ex":["El contracte-programa lliga finançament i objectius de qualitat.","L'encàrrec de gestió no serveix per finançar funcionament.","No és l'instrument previst.","L'acord marc és una figura contractual."],"clau":"Finançament amb objectius: contracte-programa.","ref":"Normativa de finançament universitari de la Generalitat"},{"id":"R871E-080","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 80","exam":"871E","exnom":"Cos superior, opció general (procés 871,
