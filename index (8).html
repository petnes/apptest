dat de cinc anys.","Vint-i-un vocals elegits pel Congrés, amb mandat de quatre anys.","El ministre de Justícia, que el presideix, i vint vocals, amb mandat de sis anys."],"c":1,"ex":["Vuit dels vint vocals són juristes no jutges.","Vint vocals (12 de la carrera judicial i 8 juristes de reconeguda competència) més el president del Suprem; cinc anys.","No són vint-i-un vocals ni quatre anys.","El ministre no en forma part."],"clau":"CGPJ: 20 vocals (12 + 8) i el president del Suprem, 5 anys.","ref":"art. 122 CE; LO 6/1985"},{"id":"P1.5-02","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Amb la Llei orgànica 1/2025, els jutjats de pau:","op":["Es converteixen en oficines de justícia al municipi.","Se suprimeixen sense cap servei substitutiu.","Passen a ser seccions dels tribunals d'instància.","Es mantenen sense canvis."],"c":0,"ex":["La reforma transforma els jutjats de pau en oficines de justícia al municipi, que presten serveis d'assistència i tràmit.","Hi ha un servei substitutiu.","Les seccions dels tribunals d'instància procedeixen dels jutjats unipersonals, no dels de pau.","Sí que canvien."],"clau":"Jutjat de pau = oficina de justícia al municipi.","ref":"LO 1/2025","rev":"Actualitat: revisar el setembre de 2026"},{"id":"P1.5-03","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"requisit","q":"Una empresa vol demandar civilment una altra per una factura impagada. Abans de presentar la demanda:","op":["No cal cap tràmit previ: pot demandar directament.","Ha d'obtenir una autorització del jutjat de guàrdia.","Només cal un intent de mediació si l'import supera els 6.000 euros.","Ha d'acreditar un intent de solució per un mitjà adequat de solució de controvèrsies (negociació, mediació, conciliació...), com a requisit de procedibilitat, amb les excepcions legals."],"c":3,"ex":["Sí que cal el requisit de procedibilitat.","No hi ha cap autorització.","No depèn de l'import.","La LO 1/2025 exigeix un intent previ de MASC en els litigis civils i mercantils, amb excepcions (tutela de drets fonamentals, mesures cautelars, entre altres)."],"clau":"Abans de demandar en civil: intenta un MASC.","ref":"art. 5 LO 1/2025"},{"id":"P1.5-04","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El Tribunal del Jurat:","op":["Està format per dotze jurats presidits per un magistrat; el veredicte exigeix unanimitat.","Està format per set jurats i dos suplents; la culpabilitat exigeix cinc vots.","Està format per nou jurats i dos suplents, presidit per un magistrat; la culpabilitat exigeix set vots i la inculpabilitat, cinc.","Està format per nou jurats presidits per un jutge de pau; la culpabilitat exigeix majoria simple."],"c":2,"ex":["No són dotze ni unanimitat.","Són nou jurats i set vots.","Nou jurats i dos suplents, magistrat president; set vots per als fets desfavorables i la culpabilitat, cinc per als favorables i la inculpabilitat.","El presideix un magistrat i calen set vots."],"clau":"Jurat: 9 més 2; 7 vots per condemnar, 5 per absoldre.","ref":"LO 5/1995"},{"id":"P1.5-05","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El Fiscal General de l'Estat:","op":["És nomenat pel Consell General del Poder Judicial per cinc anys renovables.","És nomenat pel Rei a proposta del Govern, oït el Consell General del Poder Judicial, per un mandat de quatre anys no renovable.","És nomenat pel Rei a proposta del Consell General del Poder Judicial per cinc anys.","És elegit per les Corts Generals per tres cinquenes parts per quatre anys."],"c":1,"ex":["No el nomena el CGPJ.","Proposta del Govern, audiència del CGPJ i compareixença al Congrés; quatre anys no renovables llevat que hagi ocupat el càrrec menys de dos.","La proposta és del Govern i són quatre anys.","No l'elegeixen les Corts."],"clau":"FGE: proposa el Govern, informa el CGPJ, 4 anys sense renovació.","ref":"art. 124.4 CE; art. 31 EOMF"},{"id":"P1.5-06","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El president del Tribunal Superior de Justícia de Catalunya:","op":["És nomenat pel Rei a proposta del Consell General del Poder Judicial.","És nomenat pel Govern de l'Estat a proposta del Fiscal General.","És nomenat pel president de la Generalitat a proposta del Parlament.","És elegit pels magistrats del mateix Tribunal."],"c":0,"ex":["L'Estatut preveu el nomenament reial a proposta del CGPJ.","Això s'assembla al nomenament del fiscal superior, no del president.","La Generalitat no nomena el president del TSJC.","No l'elegeixen els magistrats."],"clau":"President del TSJC: el Rei a proposta del CGPJ. Fiscal superior: el Govern estatal a proposta del FGE.","ref":"arts. 95 i 96 EAC"},{"id":"P1.5-07","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"requisit","q":"Una unitat de policia judicial de Mossos investiga un delicte sota la direcció d'un jutjat d'instrucció. Poden els comandaments policials apartar els agents de la investigació?","op":["Sí, lliurement, perquè la dependència orgànica és policial.","Sí, si l'investigació dura més de sis mesos.","Només amb autorització del conseller d'Interior.","No sense l'autorització o decisió del jutge o del fiscal competent."],"c":3,"ex":["La dependència funcional en la investigació és del jutge i el fiscal.","La durada no hi fa res.","El conseller no pot substituir l'autorització judicial.","Els funcionaris adscrits no poden ser remoguts ni apartats de la investigació concreta sinó per decisió o amb autorització del jutge o fiscal."],"clau":"Policia judicial: qui la dirigeix la investigació decideix qui hi és.","ref":"art. 550 LOPJ; art. 126 CE"},{"id":"P1.5-08","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"D'acord amb la Constitució, la jurisdicció militar:","op":["Ha estat suprimida.","Coneix dels delictes de terrorisme.","Es limita a l'àmbit estrictament castrense i als supòsits d'estat de setge.","Coneix de tots els delictes comesos per militars, sigui quina sigui la matèria."],"c":2,"ex":["Existeix, però limitada.","El terrorisme correspon a la jurisdicció ordinària (Audiència Nacional).","L'art. 117.5 la circumscriu a l'àmbit estrictament castrense i a l'estat de setge.","No és competent per tot delicte d'un militar."],"clau":"Militar: només castrense i setge.","ref":"art. 117.5 CE"},{"id":"P1.5-09","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"competencia","q":"Una persona reclama a la Generalitat una indemnització per un dany causat pel funcionament d'un servei públic i, alhora, contra l'empresa contractista. Quin ordre jurisdiccional coneix del litigi?","op":["El civil, per la presència de l'empresa privada.","El contenciós administratiu, encara que hi participin particulars.","El penal, per determinar la culpa.","El social, per ser una empresa."],"c":1,"ex":["No es divideix pel fet que hi hagi un particular.","La responsabilitat patrimonial de l'Administració és sempre contenciosa, encara que es demandi també un particular o contractista.","No hi ha delicte.","No és matèria social."],"clau":"Responsabilitat de l'Administració: contenciós, amb particulars inclosos.","ref":"art. 9.4 LOPJ"},{"id":"P1.5-10","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"termini","q":"Un familiar d'una persona detinguda considera que la detenció és il·legal i insta un habeas corpus. Qui resol i en quin termini?","op":["L'Audiència Provincial, en setanta-dues hores.","El jutge d'instrucció, en setanta-dues hores.","El fiscal, en vint-i-quatre hores.","El jutge d'instrucció del lloc de la detenció, en vint-i-quatre hores des de la iniciació del procediment."],"c":3,"ex":["No és l'Audiència.","El termini és de vint-i-quatre hores.","El fiscal pot instar-lo, no resoldre'l.","Competent el jutge d'instrucció del lloc; el procediment s'ha de resoldre en vint-i-quatre hores."],"clau":"Habeas corpus: jutge d'instrucció, 24 hores.","ref":"art. 17.4 CE; LO 6/1984"},{"id":"P1.5-11","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"El principi d'inamovibilitat judicial significa que els jutges:","op":["No poden ser separats, suspesos, traslladats ni jubilats sinó per alguna de les causes i amb les garanties previstes a la llei.","No poden canviar de destinació ni a petició pròpia.","No poden ser sancionats disciplinàriament.","Ocupen el càrrec fins als setanta anys sense cap excepció."],"c":0,"ex":["Garantia d'independència: només per causes legals i amb garanties.","Poden concursar a altres destinacions.","Sí que poden ser sancionats.","Hi ha causes legals de cessament."],"clau":"Inamovibilitat: només la llei els mou.","ref":"art. 117.2 CE"},{"id":"P1.5-12","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Els tribunals superiors de justícia:","op":["Depenen orgànicament del Govern autonòmic.","Culminen l'organització judicial en l'àmbit de cada comunitat autònoma, sense perjudici de la jurisdicció del Tribunal Suprem.","Són l'últim grau jurisdiccional en tots els ordres, per damunt del Tribunal Suprem.","Només tenen competències en l'ordre civil."],"c":1,"ex":["El poder judicial és únic i estatal.","Cim de l'organització a cada comunitat, amb el Tribunal Suprem al capdamunt de tots.","El Tribunal Suprem és superior.","Tenen sales civil i penal, contenciosa i social."],"clau":"TSJ: cim autonòmic, però sota el Suprem.","ref":"art. 152.1 CE"},{"id":"P1.6-01","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"majoria","q":"L'aprovació, la modificació o la derogació d'una llei orgànica exigeix:","op":["Majoria absoluta de les dues cambres en la votació de cada article.","Majoria simple del Congrés i ratificació del Senat.","Majoria absoluta del Congrés en una votació final sobre el conjunt del projecte.","Majoria de dos terços del Congrés i majoria absoluta del Senat."],"c":2,"ex":["La votació és final i de conjunt, i l'exigència és del Congrés.","Cal majoria absoluta.","Majoria absoluta del Congrés en votació final de conjunt; el Senat hi participa sense aquesta exigència.","No calen dos terços."],"clau":"LO: majoria absoluta del Congrés, votació final de conjunt.","ref":"art. 81.2 CE"},{"id":"P1.6-02","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Un reial decret llei ha de ser sotmès a debat i votació de totalitat:","op":["Per les dues cambres en els trenta dies següents a la publicació.","Pel Senat en els trenta dies següents a la publicació.","Pel Congrés en els quinze dies següents a la promulgació.","Pel Congrés dels Diputats en els trenta dies següents a la promulgació, per convalidar-lo o derogar-lo."],"c":3,"ex":["El Senat no hi intervé.","És el Congrés.","Són trenta dies.","Convalidació o derogació pel Congrés (convocat si cal) en trenta dies; també pot tramitar-se com a projecte de llei per urgència."],"clau":"Decret llei estatal: només el Congrés, 30 dies.","ref":"art. 86 CE"},{"id":"P1.6-03","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"La delegació legislativa per formar un text articulat s'atorga mitjançant:","op":["Una llei de bases; la de refondre textos legals, mitjançant una llei ordinària.","Una llei orgànica en tots dos casos.","Un acord del Consell de Ministres.","Una llei ordinària; la de refondre textos legals, mitjançant una llei de bases."],"c":0,"ex":["Text articulat: llei de bases. Text refós: llei ordinària que fixa l'abast de la refosa.","No cal llei orgànica.","La delegació la dona el legislador, no el Govern.","Està invertit."],"clau":"Bases per articular, ordinària per refondre.","ref":"arts. 82 i 83 CE"},{"id":"P1.6-04","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"excepcio","q":"El Govern de l'Estat vol aprovar per decret llei una reforma del règim electoral general per urgència. És possible?","op":["Sí, sempre que hi hagi extraordinària i urgent necessitat.","No, perquè el dret electoral general està exclòs del decret llei.","Sí, si el Senat hi dona la conformitat prèvia.","Sí, si el Congrés el convalida en trenta dies."],"c":1,"ex":["La urgència no salva el límit material.","El decret llei no pot afectar institucions bàsiques, drets del títol I, règim autonòmic ni dret electoral general.","El Senat no hi té paper.","La convalidació no esmena el vici."],"clau":"Decret llei: mai en electoral general.","ref":"art. 86.1 CE"},{"id":"P1.6-05","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Segons l'article 150 de la Constitució, la llei d'harmonització de disposicions normatives de les comunitats autònomes exigeix:","op":["Majoria de tres cinquenes parts del Senat.","Majoria simple del Congrés i informe del Consell d'Estat.","Que les Corts apreciïn la necessitat per majoria absoluta de cada cambra.","Que s'aprovi com a llei orgànica."],"c":2,"ex":["No són tres cinquenes parts.","No és majoria simple.","Necessitat apreciada per majoria absoluta de cada cambra; la llei orgànica és per a les de transferència o delegació.","La LO és la de l'art. 150.2."],"clau":"150.2 transferència: LO. 150.3 harmonització: majoria absoluta de cada cambra.","ref":"art. 150 CE"},{"id":"P1.6-06","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"La iniciativa legislativa popular al Parlament de Catalunya requereix:","op":["500.000 signatures, i poden signar les persones majors de divuit anys.","50.000 signatures, i només poden signar les persones majors de divuit anys.","100.000 signatures, i poden signar les persones majors de divuit anys.","50.000 signatures, i poden signar les persones majors de setze anys."],"c":3,"ex":["500.000 és la xifra estatal.","S'admet des dels setze anys.","Són 50.000.","La llei catalana exigeix 50.000 signatures i admet la signatura des dels setze anys."],"clau":"ILP catalana: 50.000 signatures des dels 16 anys.","ref":"Llei 1/2006, modificada per la Llei 7/2014"},{"id":"P1.6-07","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Al Parlament de Catalunya, la iniciativa legislativa exercida pel Govern rep el nom de:","op":["Projecte de llei.","Decret legislatiu.","Proposta de resolució.","Proposició de llei."],"c":0,"ex":["Els textos del Govern són projectes de llei; els dels diputats, grups, iniciativa popular o ens locals, proposicions.","El decret legislatiu és una norma del Govern amb rang de llei, no una iniciativa.","La proposta de resolució no és legislativa.","La proposició és la iniciativa no governamental."],"clau":"Govern: projecte. Diputats: proposició.","ref":"art. 62 EAC; Reglament del Parlament"},{"id":"P1.6-08","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"requisit","q":"Un departament prepara un reglament que desplega una llei del Parlament. Cal el dictamen de la Comissió Jurídica Assessora?","op":["Sí, i és vinculant.","Sí, és preceptiu, encara que no vinculant, perquè es dicta en execució d'una llei.","No, només és facultatiu per als reglaments.","Només si ho demana el Consell de Garanties Estatutàries."],"c":1,"ex":["No és vinculant.","El dictamen de la CJA és preceptiu en els projectes de reglaments executius, i no vinculant.","És preceptiu.","No depèn del CGE."],"clau":"Reglament que desplega una llei: dictamen CJA obligatori, no vinculant.","ref":"art. 8.3 Llei 5/2005; art. 66 Llei 26/2010"},{"id":"P1.6-09","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Les lleis de Catalunya:","op":["Les promulga el Rei i, a l'efecte de l'entrada en vigor, regeix la data de publicació al BOE.","Les promulga el president de la Generalitat i entren en vigor amb la publicació al BOE.","Les promulga el president de la Generalitat en nom del Rei i, a l'efecte de l'entrada en vigor, regeix la data de publicació al DOGC.","Les promulga el president del Parlament i entren en vigor amb la publicació al BOE."],"c":2,"ex":["La promulga el president de la Generalitat i regeix el DOGC.","Regeix el DOGC.","Promulgació pel president en nom del Rei, publicació al DOGC i al BOE, i vigència segons la data del DOGC.","No les promulga el president del Parlament."],"clau":"Llei catalana: promulga el president en nom del Rei; compta el DOGC.","ref":"art. 65 EAC"},{"id":"P1.6-10","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"efecte","q":"Un reglament de la Generalitat regula una matèria reservada a la llei i en contradiu una. Quin és el grau d'invalidesa?","op":["És nul de ple dret.","Només és invàlida la part que contradiu la llei, i la resta és anul·lable.","És vàlid mentre no s'anul·li, i els actes dictats a la seva empara són ferms.","És anul·lable."],"c":0,"ex":["Les disposicions que vulneren la Constitució, les lleis o la reserva de llei són nul·les de ple dret.","Tot el que vulnera la llei és nul.","La nul·litat es pot declarar en qualsevol moment.","La nul·litat dels reglaments il·legals és radical."],"clau":"Reglament contra llei: nul de ple dret.","ref":"art. 47.2 LPAC"},{"id":"P1.6-11","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"L'autorització de les Corts Generals és necessària per a la prestació del consentiment de l'Estat en tractats:","op":["De qualsevol tipus, sempre mitjançant llei orgànica.","De caràcter polític; per atribuir competències a una organització internacional n'hi ha prou amb un acord del Govern.","Només comercials; per als polítics cal referèndum.","De caràcter polític o militar, o que afectin la integritat territorial o els drets fonamentals, entre altres; per atribuir competències a una organització internacional cal llei orgànica."],"c":3,"ex":["No sempre és llei orgànica.","Cedir competències exigeix llei orgànica.","No hi ha referèndum previst.","Art. 94.1: autorització de les Corts per als tractats polítics, militars, sobre integritat territorial o drets fonamentals, financers o que modifiquin lleis; art. 93: llei orgànica per cedir competències."],"clau":"Tractats: art. 94 autorització; art. 93 llei orgànica (UE).","ref":"arts. 93 i 94 CE"},{"id":"P1.6-12","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Quin d'aquests principis NO figura entre els que garanteix l'article 9.3 de la Constitució?","op":["La irretroactivitat de totes les normes.","La jerarquia normativa.","La publicitat de les normes.","La interdicció de l'arbitrarietat dels poders públics."],"c":0,"ex":["La irretroactivitat només es garanteix per a les disposicions sancionadores no favorables o restrictives de drets individuals, no per a totes les normes.","Sí que hi figura.","Sí que hi figura.","Sí que hi figura."],"clau":"9.3: irretroactivitat només de les sancionadores desfavorables o restrictives.","ref":"art. 9.3 CE"},{"id":"P1.6-13","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"La llei de pressupostos generals de l'Estat:","op":["No pot crear ni modificar tributs en cap cas.","No pot crear tributs, però pot modificar-los quan una llei tributària substantiva ho prevegi.","Pot crear i modificar tributs lliurement.","Pot crear tributs si ho autoritza el Senat."],"c":1,"ex":["Sí que pot modificar-los amb habilitació.","Art. 134.7: la llei de pressupostos no pot crear tributs; els pot modificar si ho preveu una llei tributària substantiva.","No pot crear-ne.","El Senat no ho autoritza."],"clau":"Pressupostos: crear tributs no, modificar-los només amb llei substantiva.","ref":"art. 134.7 CE"},{"id":"P1.3-09","b":"1","t":"1.3","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Cada departament de l'Administració de la Generalitat compta amb:","op":["Diverses secretaries generals, una per cada direcció general.","Cap secretaria general: les funcions de gestió interna les assumeix el gabinet del conseller.","Una secretaria general que depèn del Parlament de Catalunya.","Una secretaria general, sota la direcció del conseller, de la qual depenen els serveis comuns del departament."],"c":3,"ex":["Només n'hi ha una.","El gabinet dona suport polític, no gestiona els serveis comuns.","Depèn del conseller, no del Parlament.","Hi ha una única secretaria general per departament, que dirigeix els serveis comuns (personal, pressupost, règim interior)."],"clau":"Un departament, una secretaria general: la casa per dins.","ref":"Llei 13/2008 (organització dels departaments)"},{"id":"P1.3-10","b":"1","t":"1.3","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Els secretaris generals i els directors generals de l'Administració de la Generalitat són nomenats i separats:","op":["Per decret del president de la Generalitat.","Per decret del Govern.","Per ordre del conseller del departament.","Per resolució del secretari del Govern."],"c":1,"ex":["El decret del president és per als consellers.","Els alts càrrecs (secretaris generals, directors generals) es nomenen i cessen per decret del Govern, a proposta del conseller.","Una ordre del conseller no nomena alts càrrecs.","El secretari del Govern no els nomena."],"clau":"Consellers: decret del president. Alts càrrecs: decret del Govern.","ref":"Llei 13/2008 (nomenament dels alts càrrecs)"},{"id":"P1.2-14","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"termini","q":"El Govern de la Generalitat promulga un decret llei el 10 de març. El Parlament no el sotmet a votació fins al 20 d'abril. Quina és la situació del decret llei?","op":["Ha quedat derogat, perquè el termini de trenta dies per validar-lo és improrrogable i va vèncer a l'abril sense votació.","Queda suspès fins que el Consell de Garanties Estatutàries emeti dictamen.","S'ha convertit automàticament en llei per silenci del Parlament.","Continua vigent fins que el Parlament el voti, perquè el termini només és orientatiu."],"c":0,"ex":["Els decrets llei resten derogats si en els trenta dies següents a la promulgació no són validats expressament; el termini és improrrogable.","El Consell de Garanties no intervé en la validació.","El silenci no valida: cal votació expressa.","El termini és improrrogable, no orientatiu."],"clau":"Decret llei català: trenta dies o mort.","ref":"art. 64.2 EAC"},{"id":"P1.4-15","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"excepcio","q":"Davant un jutjat català, un particular invoca la Carta dels Drets Fonamentals de la Unió contra una norma catalana que no aplica dret de la Unió. Prospera la invocació?","op":["Sí, perquè la Carta té el mateix valor que els tractats en qualsevol àmbit.","No, perquè la Carta vincula els Estats membres només quan apliquen el dret de la Unió.","No, perquè la Carta no és jurídicament vinculant.","Sí, sempre que el jutge plantegi abans una qüestió prejudicial."],"c":1,"ex":["El valor de tractat no amplia el seu àmbit d'aplicació.","L'àmbit d'aplicació de la Carta es limita a les situacions regides pel dret de la Unió; les purament internes queden fora.","La Carta és vinculant, però dins del seu àmbit.","La qüestió prejudicial no converteix una situació interna en una d'aplicació del dret de la Unió."],"clau":"Carta: només quan hi ha dret de la Unió pel mig.","ref":"art. 6 TUE; art. 51 Carta"},{"id":"P1.5-13","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"excepcio","q":"Una empresa vol demanar al jutjat mesures cautelars urgents abans de presentar una demanda civil contra una altra empresa. Cal acreditar abans un intent de solució per un mitjà adequat (MASC)?","op":["Sí, perquè el requisit s'aplica sense excepcions en l'ordre civil.","Sí, però només si l'import supera els 2.000 euros.","No, perquè la sol·licitud de mesures cautelars prèvies és una de les excepcions al requisit de procedibilitat.","No, perquè el requisit només afecta l'ordre penal."],"c":2,"ex":["Hi ha excepcions taxades.","No depèn de l'import.","La LO 1/2025 exceptua del requisit, entre altres, les mesures cautelars prèvies i la tutela civil de drets fonamentals.","El requisit és propi de l'ordre civil i mercantil."],"clau":"MASC obligatori, però no per a cautelars ni drets fonamentals.","ref":"art. 5 LO 1/2025"},{"id":"P1.6-14","b":"1","t":"1.6","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"encreuament","q":"El Govern de la Generalitat vol refondre en un sol text tres lleis del Parlament sobre una mateixa matèria. Quin instrument de delegació necessita?","op":["Una llei ordinària de delegació, perquè es tracta de refondre textos legals.","Cap: pot refondre les lleis per decret llei si hi ha urgència.","Una llei de bases, com en qualsevol delegació legislativa.","Un acord del Parlament sense forma de llei."],"c":0,"ex":["L'Estatut distingeix la llei de bases (textos articulats) de la llei ordinària (textos refosos); el resultat és un decret legislatiu.","El decret llei no serveix per exercir una delegació.","La llei de bases és per a textos articulats.","La delegació s'atorga per llei."],"clau":"Refondre: llei ordinària. Articular: llei de bases.","ref":"art. 63 EAC"},{"id":"PE.1-01","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Sobre l'estructura de la doble hèlix de l'ADN, quina afirmació és correcta?","op":["Les dues cadenes són antiparal·leles i el parell A-T està unit per tres ponts d'hidrogen.","Les dues cadenes són antiparal·leles i el parell G-C està unit per tres ponts d'hidrogen.","Les dues cadenes són paral·leles i el parell G-C està unit per tres ponts d'hidrogen.","Les dues cadenes són paral·leles i el parell A-T està unit per dos ponts d'hidrogen."],"c":1,"ex":["A-T només té dos ponts.","Cadenes 5' a 3' en sentit oposat, unides per enllaços fosfodièster; A-T amb dos ponts i G-C amb tres, per això les regions riques en GC fonen a més temperatura.","Les cadenes són antiparal·leles.","Les cadenes són antiparal·leles."],"clau":"Antiparal·leles; GC = 3 ponts, AT = 2.","ref":"Butler, Fundamentals, cap. 2"},{"id":"PE.1-02","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"calcul","q":"Un extracte conté 1 ng d'ADN nuclear humà. Aproximadament, a quantes cèl·lules diploides equival?","op":["Unes 150.","Unes 15.000.","Unes 15.","Unes 1.500."],"c":0,"ex":["Una cèl·lula diploide conté uns 6,6 pg d'ADN; 1.000 pg dividits per 6,6 donen unes 150 cèl·lules.","Serien 100 ng.","Serien 0,1 ng.","Serien 10 ng."],"clau":"6,6 pg per cèl·lula: 1 ng = 150 cèl·lules.","ref":"Butler, Advanced Topics: Methodology, cap. 3"},{"id":"PE.1-03","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El genoma nuclear humà:","op":["Té uns 320 milions de parells de bases per genoma haploide, dels quals prop d'un 1,5 % codifica proteïnes.","Té uns 6.400 milions de parells de bases per genoma haploide, dels quals prop d'un 1,5 % codifica proteïnes.","Té uns 3.200 milions de parells de bases per genoma haploide, dels quals prop d'un 15 % codifica proteïnes.","Té uns 3.200 milions de parells de bases per genoma haploide, dels quals prop d'un 1,5 % codifica proteïnes."],"c":3,"ex":["La mida és deu vegades més gran.","6,4 Gb és el contingut diploide.","La fracció codificant és molt menor.","3,2 Gb haploides (6,4 diploides), amb només un 1,5 % codificant i més de la meitat de seqüències repetitives."],"clau":"3,2 Gb, 1,5 % codificant, més del 50 % repetitiu.","ref":"Butler, Fundamentals, cap. 2"},{"id":"PE.1-04","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"negacio","q":"Sobre l'ADN mitocondrial humà, quina afirmació és INCORRECTA?","op":["És una molècula circular de doble cadena de 16.569 parells de bases.","S'hereta per via materna i no recombina.","Conté introns extensos entre els seus gens.","Hi ha centenars o milers de còpies per cèl·lula."],"c":2,"ex":["Cert: 16.569 pb en la seqüència de referència.","Cert: herència materna sense recombinació.","El genoma mitocondrial és compacte, pràcticament sense introns ni espais intergènics; per això és la falsa.","Cert: l'alt nombre de còpies el fa útil en mostres degradades."],"clau":"ADNmt: 16.569 pb, circular, matern, sense introns, moltes còpies.","ref":"Butler, Advanced Topics: Methodology, cap. 14"},{"id":"PE.1-05","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Un polimorfisme genètic es defineix habitualment com una variant amb una freqüència poblacional mínima; els SNP apareixen al genoma humà, de mitjana, aproximadament:","op":["Freqüència mínima del 5 %; un SNP cada 1.000 parells de bases.","Freqüència mínima de l'1 %; un SNP cada 1.000 parells de bases.","Freqüència mínima de l'1 %; un SNP cada 100.000 parells de bases.","Freqüència mínima de l'1 %; un SNP cada 100 parells de bases."],"c":1,"ex":["El llindar convencional és l'1 %.","Convenció de l'1 % i densitat aproximada d'un SNP per kilobase (dos genomes difereixen en un 0,1 %).","És molt més densa.","La densitat és d'un per kilobase."],"clau":"Polimorfisme: 1 %. SNP: 1 cada 1.000 pb.","ref":"Butler, Fundamentals, cap. 2"},{"id":"PE.1-06","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Quins polimorfismes es detecten per la mida del fragment amplificat i quins per la identitat d'una base?","op":["Els STR, els VNTR i els indels es detecten per longitud; els SNP, per seqüència.","Tots es detecten per seqüència.","Els STR i els SNP es detecten per longitud; els VNTR, per seqüència.","Els SNP es detecten per longitud; els STR, per seqüència."],"c":0,"ex":["Els polimorfismes de longitud (repeticions i insercions o delecions) es resolen per mida en electroforesi; els SNP requereixen detectar la base concreta.","Els STR clàssics s'analitzen per longitud.","Els SNP no es distingeixen per mida.","Està invertit."],"clau":"Longitud: STR, VNTR, indel. Seqüència: SNP.","ref":"Butler, Fundamentals, cap. 2"},{"id":"PE.1-07","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Els VNTR o minisatèl·lits, en comparació amb els STR:","op":["Tenen unitats de repetició de 2 a 7 pb i s'analitzen per PCR amb nanograms d'ADN.","Tenen unitats de repetició de 10 a 100 pb i s'amplifiquen millor que els STR en mostres degradades.","Són polimorfismes d'una sola base.","Tenen unitats de repetició de 10 a 100 pb, es van analitzar per RFLP amb sondes i necessitaven micrograms d'ADN íntegre."],"c":3,"ex":["Això són els STR.","Els fragments llargs són els que pitjor sobreviuen a la degradació.","Són repeticions, no SNP.","Els minisatèl·lits (Jeffreys, 1985) s'analitzaven per digestió amb enzims de restricció i Southern; els fragments llargs exigien ADN abundant i intacte."],"clau":"VNTR: unitats llargues, RFLP, micrograms. STR: unitats curtes, PCR, picograms.","ref":"Butler, Fundamentals, cap. 1 i 2"},{"id":"PE.1-08","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Cal determinar si un home i un nen pertanyen a la mateixa línia paterna directa (avi i net) quan el pare biològic no està disponible. Quin marcador és el més adequat?","op":["L'ADN mitocondrial, perquè segueix la línia paterna.","Els SNP mitocondrials.","Els Y-STR, perquè l'haplotip del cromosoma Y es transmet íntegre de pares a fills, tret de mutació.","Els X-STR, perquè els homes transmeten el cromosoma X als fills."],"c":2,"ex":["L'ADN mitocondrial segueix la línia materna.","Tampoc segueixen la línia paterna.","El cromosoma Y (fora de les regions pseudoautosòmiques) no recombina: avi, pare i net comparteixen haplotip.","Els homes transmeten l'X a les filles, no als fills."],"clau":"Línia paterna: Y-STR. Línia materna: ADNmt.","ref":"Butler, Advanced Topics: Methodology, cap. 13"},{"id":"PE.1-09","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"efecte","q":"Un perfil autosòmic complet mostra només el pic X a l'amelogenina, però els Y-STR s'amplifiquen amb normalitat i alçades equilibrades. Quina és la interpretació més probable?","op":["És un error del kit que obliga a repetir l'extracció.","Es tracta d'un home amb deleció de la regió AMELY; cal confirmar el sexe amb marcadors del cromosoma Y (Y-STR o SRY).","És una dona amb contaminació masculina de baix nivell.","És una mescla d'un home i una dona."],"c":1,"ex":["No és un error tècnic.","La deleció d'AMELY (freqüent en algunes poblacions) fa que homes semblin dones a l'amelogenina; els Y-STR resolen el dubte.","Una contaminació donaria Y-STR febles i desequilibrats.","Una mescla mostraria més de dos al·lels en loci autosòmics."],"clau":"Amelogenina sense Y però Y-STR complets: deleció d'AMELY.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.1-10","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"encreuament","q":"Al laboratori es vol saber si una taca és de saliva o de sang menstrual mitjançant marcadors d'ARN. Quins marcadors escauen?","op":["HBB per a saliva; PRM1 per a sang menstrual.","MUC4 per a saliva; HBB per a sang menstrual.","PRM1 i PRM2 per a saliva; HTN3 per a sang menstrual.","HTN3 i STATH per a saliva; MMP7 i MMP10 per a sang menstrual."],"c":3,"ex":["HBB és de sang perifèrica i PRM1 de semen.","MUC4 és de fluid vaginal.","Les protamines són de semen.","Histatina 3 i estaterina són marcadors salivals; les metal·loproteinases MMP7 i MMP10 (i MMP11) marquen la sang menstrual."],"clau":"Saliva: HTN3, STATH. Menstrual: MMP. Semen: PRM. Sang: HBB. Vaginal: MUC4.","ref":"Butler, Advanced Topics: Methodology, cap. 1; EDNAP"},{"id":"PE.1-11","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Les taxes de mutació aproximades per generació són:","op":["STR: de l'ordre de 10^-3; SNP: de l'ordre de 10^-8.","STR: de l'ordre de 10^-2; SNP: de l'ordre de 10^-5.","STR: de l'ordre de 10^-8; SNP: de l'ordre de 10^-3.","STR i SNP: de l'ordre de 10^-5."],"c":0,"ex":["Els STR muten per lliscament de la polimerasa (0,1 a 0,3 %); els SNP són molt estables, per això serveixen per a ancestralitat i llinatges.","Els STR no arriben a l'1 % per generació.","Està invertit.","Difereixen en cinc ordres de magnitud."],"clau":"STR muten mil·lèsimes; SNP, cent-milionèsimes.","ref":"Butler, Advanced Topics: Methodology, cap. 5 i 12"},{"id":"PE.1-12","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"D'una resta òssia antiga només s'obtenen resultats en els loci d'amplicó més curt. Quina característica de la cromatina explica la mida dels fragments que sobreviuen?","op":["Els telòmers protegeixen els fragments de 500 pb.","L'ADN enrotllat al nucleosoma (uns 147 pb) queda protegit de les nucleases, de manera que els fragments residuals ronden els 150 pb.","Les histones degraden l'ADN fins a uns 50 pb.","La metilació fa que només sobrevisquin fragments de 300 pb."],"c":1,"ex":["Els telòmers no protegeixen l'ADN intern.","El nucleosoma protegeix uns 147 pb; per això els miniSTR (amplicons de menys de 150 pb) i els SNP funcionen en mostres degradades.","Les histones protegeixen, no degraden.","La metilació no determina la mida dels fragments."],"clau":"Nucleosoma 147 pb: fragments de 150 pb i miniSTR.","ref":"Butler, Advanced Topics: Methodology, cap. 10"},{"id":"PE.1-13","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Segons la Llei orgànica 10/2007, la base de dades policial d'identificadors obtinguts a partir de l'ADN només pot contenir:","op":["Identificadors obtinguts de l'ADN codificant que revelin la identitat i el sexe.","Qualsevol identificador genètic obtingut en una investigació.","Identificadors obtinguts de l'ADN no codificant que revelin exclusivament la identitat i el sexe.","Identificadors obtinguts de l'ADN no codificant que revelin identitat, sexe i ancestralitat."],"c":2,"ex":["L'ADN codificant queda exclòs.","Hi ha límits legals estrictes.","La llei limita la inscripció a informació no codificant i només reveladora d'identitat i sexe.","L'ancestralitat i altres trets no s'inscriuen."],"clau":"LO 10/2007: no codificant, identitat i sexe.","ref":"LO 10/2007, art. 4"},{"id":"PE.1-14","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"El sistema HIrisPlex-S permet predir, a partir de SNP:","op":["El grup sanguini.","El sexe cromosòmic.","L'edat biològica del donant.","El color dels ulls, del cabell i de la pell."],"c":3,"ex":["El grup sanguini no en forma part.","El sexe es determina amb amelogenina o marcadors Y.","L'edat s'estima per metilació.","HIrisPlex-S combina SNP de gens de pigmentació (HERC2, OCA2, MC1R, SLC45A2...) per predir ulls, cabell i pell."],"clau":"HIrisPlex-S: ulls, cabell, pell.","ref":"Butler, Advanced Topics: Methodology, cap. 12; Walsh et al."},{"id":"PE.1-15","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Es vol estimar l'edat del donant d'una taca de sang. Quin tipus de marcador dona actualment les millors prediccions?","op":["Els nivells de metilació de citosines en llocs CpG de gens com ELOVL2, FHL2 o KLF14.","El grau d'heteroplàsmia mitocondrial.","El nombre de repeticions dels STR.","La longitud dels telòmers."],"c":0,"ex":["Els rellotges epigenètics de metilació estimen l'edat amb errors d'uns 3 a 5 anys.","L'heteroplàsmia no estima l'edat de manera fiable.","Els STR no canvien amb l'edat.","Els telòmers tenen molta variabilitat individual i poc poder predictiu."],"clau":"Edat: metilació CpG (ELOVL2).","ref":"Butler, Advanced Topics: Methodology, cap. 12; Zbiec-Piekarska et al."},{"id":"PE.1-16","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Dos sospitosos són bessons monozigòtics i el perfil STR del vestigi coincideix amb tots dos. Quina estratègia pot discriminar-los?","op":["Ampliar el nombre de loci STR autosòmics.","Seqüenciar el genoma complet per trobar mutacions puntuals postzigòtiques presents en un sol bessó i comprovar-les al vestigi.","Analitzar els Y-STR.","Analitzar l'ADN mitocondrial."],"c":1,"ex":["Els STR seran idèntics en qualsevol nombre.","Les mutacions somàtiques primerenques diferencien els bessons; també s'exploren diferències de metilació.","Els Y-STR també són idèntics.","L'ADNmt també és idèntic."],"clau":"Bessons: mutacions postzigòtiques per seqüenciació massiva.","ref":"Weber-Lehmann et al. 2014; Butler, Advanced Topics: Interpretation"},{"id":"PE.1-17","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"L'ARN es diferencia de l'ADN perquè:","op":["Conté uracil i desoxiribosa, i és més estable que l'ADN.","Sempre és bicatenari.","Conté uracil en lloc de timina i ribosa amb un grup 2'-OH, que el fa més susceptible a la hidròlisi.","Conté timina en lloc d'uracil i desoxiribosa."],"c":2,"ex":["La ribosa el fa menys estable.","És majoritàriament monocatenari.","Uracil i ribosa; el 2'-OH permet la hidròlisi alcalina i el fa làbil, i les RNases són ubiques.","Això és l'ADN."],"clau":"ARN: uracil, ribosa 2'-OH, més fràgil.","ref":"Butler, Fundamentals, cap. 2"},{"id":"PE.1-18","b":"E","t":"E.1","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Els elements Alu del genoma humà:","op":["Són repeticions en tàndem de 2 a 7 pb.","Són els gens dels ARN ribosòmics.","Representen menys de l'1 % del genoma.","Són seqüències repetides disperses d'uns 300 pb, presents en més d'un milió de còpies (prop de l'11 % del genoma), útils com a diana multicòpia en la quantificació."],"c":3,"ex":["Les repeticions curtes en tàndem són els STR.","No són gens ribosòmics.","Suposen al voltant de l'11 %.","Repeticions disperses SINE d'uns 300 pb, molt abundants, específiques de primats i útils per quantificar ADN humà."],"clau":"Alu: 300 pb, un milió de còpies, 11 %.","ref":"Butler, Fundamentals, cap. 2"},{"id":"PE.2-01","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Els STR utilitzats en genètica forense tenen unitats de repetició:","op":["De 2 a 7 parells de bases, i es prefereixen els dinucleòtids per ser més polimòrfics.","De 2 a 7 parells de bases, i es prefereixen els hexanucleòtids per la seva estabilitat.","De 2 a 7 parells de bases, i es prefereixen els tetranucleòtids perquè produeixen menys stutter i es resolen bé.","De 10 a 100 parells de bases, i es prefereixen els tetranucleòtids."],"c":2,"ex":["Els dinucleòtids fan molt stutter.","Els hexanucleòtids no són l'estàndard.","Unitats curtes (2 a 7 pb); els tetranucleòtids equilibren polimorfisme, resolució i baix stutter.","Unitats de 10 a 100 pb són els VNTR."],"clau":"STR: 2 a 7 pb; el tetranucleòtid és el rei.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.2-02","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Segons la seva estructura, TH01, vWA i D21S11 són, respectivament, STR:","op":["Compost, simple i complex.","Simple, complex i compost.","Complex, compost i simple.","Simple, compost i complex."],"c":3,"ex":["vWA és compost, no simple.","D21S11 és complex.","TH01 és simple.","TH01 repeteix una sola unitat (AATG); vWA té dues o més unitats adjacents; D21S11 combina blocs de diverses unitats amb seqüències intercalades."],"clau":"TH01 simple, vWA compost, D21S11 complex, SE33 hipervariable.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.2-03","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Un perfil mostra l'al·lel 9.3 a TH01. Què indica aquesta designació segons la nomenclatura de la ISFG?","op":["Nou repeticions completes de la unitat AATG més tres bases addicionals, per la pèrdua d'una base en una de les repeticions.","Un al·lel amb un 30 % de stutter.","Un al·lel de 9,3 kilobases.","Nou repeticions i tres unitats parcials."],"c":0,"ex":["Els al·lels amb repetició incompleta es designen amb el nombre de repeticions senceres, un punt i el nombre de bases sobrants; a TH01 9.3 falta una A a la setena repetició.","El stutter no forma part de la nomenclatura.","No fa referència a la mida en kb.","El .3 són tres bases, no unitats."],"clau":"9.3 = 9 repeticions i 3 bases.","ref":"Recomanacions ISFG (Bär et al. 1997); Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.2-04","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"efecte","q":"En un locus tetranucleòtid apareix un pic quatre bases per sota d'un al·lel, amb una alçada del 8 % de l'al·lel principal. Com s'interpreta?","op":["Com l'al·lel minoritari d'una mescla.","Com un producte stutter n-1, perquè queda per sota dels llindars habituals del 10 al 15 %.","Com un pull-up d'un altre color.","Com una microvariant real."],"c":1,"ex":["Un contribuent menor s'esperaria també en altres posicions i loci.","El stutter n-1 es produeix per lliscament de la polimerasa i sol quedar per sota del 15 % de l'al·lel; un 8 % és compatible.","El pull-up apareix en la mateixa mida en un altre canal.","Una microvariant no ocupa la posició n-1 exacta."],"clau":"Stutter: n-1, per sota del 15 %.","ref":"Butler, Advanced Topics: Interpretation, cap. 3"},{"id":"PE.2-05","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Quin és el motiu principal pel qual els tetranucleòtids es prefereixen als dinucleòtids com a marcadors forenses?","op":["Els dinucleòtids són menys polimòrfics.","Els dinucleòtids no existeixen al genoma humà.","Els dinucleòtids generen un stutter molt elevat que dificulta la interpretació, sobretot en mescles.","Els dinucleòtids no s'amplifiquen per PCR."],"c":2,"ex":["Els dinucleòtids són molt polimòrfics, però problemàtics.","Són els STR més abundants del genoma.","Els STR de dos nucleòtids produeixen escales de stutter que confonen la lectura; els de quatre tenen stutter baix i al·lels ben separats.","S'amplifiquen, però amb artefactes."],"clau":"Dinucleòtids: massa stutter.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.2-06","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El conjunt de loci principals del CODIS:","op":["Va passar de 13 a 16 loci l'1 de gener de 2017.","Es manté en 13 loci des de 1997.","Va passar de 13 a 20 loci l'any 2009.","Va passar de 13 a 20 loci l'1 de gener de 2017."],"c":3,"ex":["Són 20.","S'ha ampliat.","L'ampliació va ser el 2017; el 2009 va ser l'ESS europeu.","Els 13 loci de 1997 van ampliar-se a 20 amb D1S1656, D2S441, D2S1338, D10S1248, D12S391, D19S433 i D22S1045 el 2017."],"clau":"CODIS: 13 (1997) i 20 (2017).","ref":"Hares 2015; Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.2-07","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"L'European Standard Set (ESS) de loci STR:","op":["Consta de 12 loci: els 7 originals més 5 miniSTR (D1S1656, D2S441, D10S1248, D12S391 i D22S1045) afegits per la Resolució del Consell de 2009.","Consta de 7 loci i no s'ha ampliat.","Consta de 20 loci des de 2017.","Consta de 13 loci coincidents amb el CODIS original."],"c":0,"ex":["Set loci de 2001 (D3S1358, D8S1179, D18S51, D21S11, FGA, TH01, vWA) més cinc miniSTR de 2009; l'ISSOL d'Interpol hi afegeix l'amelogenina.","Es va ampliar el 2009.","Els 20 són del CODIS.","No coincideix amb el CODIS."],"clau":"ESS: 7 més 5 = 12 (2009).","ref":"Resolució del Consell 2009/C 296/01; Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.2-08","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"efecte","q":"En un estudi de parentiu s'utilitzen vWA i D12S391. Per què cal tenir-ho en compte en el càlcul?","op":["Perquè estan al mateix cromosoma i no es poden utilitzar mai junts.","Perquè estan al cromosoma 12 a poca distància i el lligament pot afectar la independència entre generacions en el càlcul de parentiu.","Perquè el lligament invalida la regla del producte en la identificació d'individus no relacionats.","Perquè comparteixen la mateixa unitat de repetició."],"c":1,"ex":["Es poden utilitzar, amb els ajustos adequats.","vWA i D12S391 disten uns 6,3 Mb; en identificació d'individus no relacionats la regla del producte es manté, però en parentiu cal considerar els haplotips.","En no relacionats els loci lligats són pràcticament independents a nivell poblacional.","La unitat de repetició no és el problema."],"clau":"vWA i D12S391 lligats: compte en parentiu, no en identificació.","ref":"Butler, Advanced Topics: Interpretation, cap. 10; O'Connor et al. 2011"},{"id":"PE.2-09","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"A D21S11 apareix un pic entre les posicions 30 i 31 de l'escala al·lèlica, reproduït en dues amplificacions independents i amb alçada equivalent a la de l'altre al·lel. Com s'ha de designar?","op":["Com un stutter n+1 de l'al·lel 30.","Com un al·lel nul.","Com l'al·lel microvariant 30.2, amb dues bases més que l'al·lel 30.","Com un pull-up."],"c":2,"ex":["Un stutter no tindria l'alçada d'un al·lel ni es repetiria en posició intermèdia.","Un al·lel nul és un al·lel absent, no present.","Les microvariants són al·lels reals amb repeticions incompletes; a D21S11 les .2 (per exemple 29.2, 30.2) són freqüents i es confirmen amb la reproductibilitat.","El pull-up es veu en un altre canal."],"clau":"Pic reproduïble fora de la ladder: microvariant, designa amb punt i bases.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.2-10","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"En un sol locus d'una mostra de referència apareixen tres pics: dos d'alçada similar i un tercer que suma aproximadament l'alçada dels altres dos. Quin patró és?","op":["Un patró trial·lèlic de tipus 1, compatible amb mosaïcisme somàtic.","Una mescla de dues persones.","Un artefacte de pull-up.","Un patró trial·lèlic de tipus 2, compatible amb una duplicació germinal."],"c":0,"ex":["Tipus 1: pics desequilibrats, la suma de dos iguala el tercer, sovint per mutació somàtica; tipus 2: tres pics equilibrats, per duplicació o trisomia.","Una mescla mostraria al·lels extra en diversos loci.","El pull-up no coincideix amb la mida d'un al·lel de l'escala.","El tipus 2 mostra tres pics d'alçada semblant."],"clau":"Trial·lèlic tipus 1: desequilibrat, somàtic; tipus 2: equilibrat, germinal.","ref":"Butler, Advanced Topics: Methodology, cap. 5; Clayton et al. 2004"},{"id":"PE.2-11","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"efecte","q":"Una mostra apareix homozigota en un locus amb un kit i heterozigota amb un altre kit d'un fabricant diferent. Quina és l'explicació més probable?","op":["Una mescla detectada només pel segon kit.","Una contaminació del segon kit.","Un stutter interpretat com a al·lel.","Un al·lel nul per una mutació al lloc d'unió d'un encebador del primer kit, que impedeix amplificar un dels dos al·lels."],"c":3,"ex":["Una mescla apareixeria amb tots dos kits.","La contaminació no és l'explicació més parsimoniosa.","Un stutter no explica l'aparició d'un al·lel real.","Els al·lels silenciosos o nuls sorgeixen quan un encebador no s'uneix per una variant de seqüència; kits amb encebadors diferents els revelen (estudis de concordança)."],"clau":"Homozigot amb un kit i heterozigot amb l'altre: al·lel nul.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.2-12","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"efecte","q":"En una prova de paternitat, el presumpte pare és compatible en 22 loci i mostra una única incompatibilitat a FGA, on el fill porta un al·lel una unitat més llarg. Què cal fer?","op":["Repetir l'anàlisi fins que desaparegui la incompatibilitat.","Excloure només si el pare és més gran de 40 anys.","No excloure la paternitat: considerar una mutació d'un pas, freqüent a FGA, i calcular l'índex de paternitat amb la taxa de mutació del locus.","Excloure la paternitat, perquè una sola exclusió és definitiva."],"c":2,"ex":["Repetir no canvia el genotip real.","L'edat paterna augmenta la taxa, però no és el criteri.","Les recomanacions ISFG demanen almenys dues o tres exclusions per excloure; FGA i SE33 són dels loci amb taxa de mutació més alta, sobretot paterna.","Una sola exclusió no és concloent."],"clau":"Una sola exclusió a FGA: pensa en mutació, no en exclusió.","ref":"Recomanacions ISFG (Gjertson et al. 2007); Butler, Advanced Topics: Interpretation, cap. 14"},{"id":"PE.2-13","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"efecte","q":"En un electroferograma, les alçades dels pics disminueixen progressivament a mesura que augmenta la mida de l'amplicó, fins a desaparèixer als loci més llargs. Quin fenomen és el més probable?","op":["Excés d'ADN, que satura els loci llargs.","Degradació de l'ADN, que fragmenta la molècula i afecta primer els amplicons llargs (efecte ski-slope).","Contaminació amb ADN d'una segona persona.","Un problema de l'escala al·lèlica."],"c":1,"ex":["L'excés d'ADN produeix pics saturats i artefactes, no pèrdua progressiva.","Els fragments degradats no arriben a la mida dels amplicons llargs; l'índex de degradació de la qPCR ho confirma i els miniSTR ho pal·lien.","Una mescla afegeix al·lels, no en treu.","La ladder no altera la mostra."],"clau":"Pendent descendent amb la mida: degradació.","ref":"Butler, Advanced Topics: Methodology, cap. 10"},{"id":"PE.2-14","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El locus TH01 es localitza:","op":["A l'intró 1 del gen de la tirosina hidroxilasa (cromosoma 11).","A l'intró 10 del gen de la peroxidasa tiroidal.","A l'intró 3 del gen del fibrinogen alfa.","A l'intró 40 del gen del factor de von Willebrand."],"c":0,"ex":["TH01: intró 1 de la tirosina hidroxilasa, al cromosoma 11.","Això és TPOX (cromosoma 2).","Això és FGA (cromosoma 4).","Això és vWA (cromosoma 12)."],"clau":"TH01 tirosina hidroxilasa, vWA von Willebrand, FGA fibrinogen, TPOX peroxidasa tiroidal.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.2-15","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Quin dels loci següents és el més polimòrfic (heterozigositat més alta) en poblacions europees?","op":["TPOX.","TH01.","CSF1PO.","SE33."],"c":3,"ex":["TPOX és dels menys informatius (al voltant del 0,62).","TH01 és intermedi.","CSF1PO és poc polimòrfic.","SE33 (ACTBP2) és un STR complex hipervariable amb heterozigositat propera al 0,94."],"clau":"SE33 és el més discriminant; TPOX el que menys.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.2-16","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Els loci Penta D i Penta E:","op":["Són SNP del cromosoma 5.","Estan situats al cromosoma Y.","Són pentanucleòtids amb un stutter molt baix, cosa que els fa especialment útils en mescles.","Són dinucleòtids amb stutter elevat."],"c":2,"ex":["Són STR autosòmics (Penta D al cromosoma 21, Penta E al 15).","Són autosòmics.","Unitats de cinc bases: el lliscament és menys freqüent i el stutter sol quedar per sota del 2 %.","Són pentanucleòtids."],"clau":"Penta: cinc bases, quasi sense stutter.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.2-17","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"La seqüenciació massiva dels STR, en comparació amb l'electroforesi capil·lar:","op":["Redueix el nombre d'al·lels detectables.","Revela isoal·lels de la mateixa longitud però seqüència diferent, i augmenta l'heterozigositat en loci com D12S391, D21S11 o D2S1338.","Només permet determinar la longitud dels al·lels.","No es pot aplicar a STR, només a SNP."],"c":1,"ex":["N'augmenta el nombre.","La seqüència de la regió repetitiva i de les flanquejants distingeix al·lels isomètrics; la nomenclatura ISFG 2016 els descriu entre claudàtors.","Aporta la seqüència, no només la longitud.","S'aplica a STR, SNP i ADNmt."],"clau":"MPS: mateixa mida, seqüència diferent = més al·lels.","ref":"Recomanacions ISFG 2016 (Parson et al.); Butler, Advanced Topics: Methodology, cap. 17"},{"id":"PE.2-18","b":"E","t":"E.2","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Quin criteri de selecció d'un STR forense justifica que els loci escollits estiguin en cromosomes diferents o molt allunyats?","op":["La independència estadística necessària per multiplicar les freqüències (regla del producte).","La reducció del stutter.","La mida de l'amplicó.","La facilitat d'amplificació multiplex."],"c":0,"ex":["Loci no lligats permeten assumir equilibri de lligament i multiplicar les probabilitats al·lèliques.","El stutter depèn de la unitat de repetició.","La mida depèn del disseny dels encebadors.","El multiplex depèn dels encebadors i dels colorants, no de la posició cromosòmica."],"clau":"Cromosomes diferents: per poder multiplicar.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.3-01","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Els SNP del genoma humà són majoritàriament:","op":["Biallèlics, i les transversions són el doble de freqüents que les transicions.","Tetraallèlics, perquè qualsevol base pot aparèixer.","Triallèlics, amb transicions i transversions igual de freqüents.","Biallèlics, i les transicions són aproximadament el doble de freqüents que les transversions."],"c":3,"ex":["Les transicions són les més freqüents.","A la pràctica quasi mai hi ha quatre al·lels.","Els triallèlics són rars.","Gairebé tots tenen dos al·lels; els canvis purina-purina o pirimidina-pirimidina (transicions) predominen."],"clau":"SNP: dos al·lels, i C/T o A/G les combinacions més freqüents.","ref":"Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-02","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Segons la classificació forense de Budowle i van Daal, els SNP d'identitat (IISNP) es caracteritzen per:","op":["Associació amb trets externament visibles.","Herència uniparental sense recombinació.","Heterozigositat alta i freqüències al·lèliques semblants entre poblacions.","Freqüències al·lèliques molt diferents entre poblacions."],"c":2,"ex":["Això defineix els SNP de fenotip (PISNP).","Això defineix els SNP de llinatge (LISNP: Y i mitocondrials).","Els IISNP han de discriminar individus sense revelar origen: molt informatius i poc diferents entre poblacions.","Això defineix els SNP d'ancestralitat (AISNP)."],"clau":"Identitat, ancestralitat, fenotip, llinatge: quatre feines diferents.","ref":"Budowle i van Daal 2008; Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-03","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"calcul","q":"Un laboratori vol assolir amb SNP d'identitat un poder de discriminació comparable al d'un panell de 15 STR. Quants SNP necessita, aproximadament?","op":["Més de 500.","Entre 40 i 60.","Entre 10 i 15.","Entre 100 i 150, però només si són trial·lèlics."],"c":1,"ex":["No en calen tants per identificar.","Un SNP biallèlic aporta molta menys informació que un STR multial·lèlic; calen unes quatre vegades més marcadors.","Amb 15 SNP el poder de discriminació és molt baix.","No cal que siguin trial·lèlics."],"clau":"Regla pràctica: 3 o 4 SNP per cada STR.","ref":"Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-04","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Quin panell de SNP d'identitat dissenyat per electroforesi capil·lar (extensió d'una sola base) va desenvolupar el consorci europeu SNPforID?","op":["El 52-plex.","El 165-plex.","El 90-plex.","El GlobalFiler."],"c":0,"ex":["SNPforID va validar 52 SNP autosòmics en un sol múltiplex analitzat per minisequenciació.","165 és el nombre de SNP d'ancestralitat del panell Precision ID.","No és el panell de SNPforID.","GlobalFiler és un kit d'STR."],"clau":"SNPforID: 52 SNP autosòmics d'identitat.","ref":"Sanchez et al. 2006; Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-05","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"En comparació amb els STR, els SNP com a marcadors forenses ofereixen:","op":["La mateixa mida d'amplicó i millor poder de discriminació per locus.","Stutter més alt i més al·lels per locus.","Amplicons més llargs i taxa de mutació més alta, però millor interpretació de mescles.","Amplicons més curts i taxa de mutació més baixa, però pitjor interpretació de mescles."],"c":3,"ex":["Els SNP discriminen menys per locus.","Els SNP no produeixen stutter i tenen només dos al·lels.","Està invertit.","Els SNP s'amplifiquen en menys de 100 pb i muten poc, però amb dos al·lels és difícil separar contribuents."],"clau":"SNP: curts i estables, però dolents per a mescles.","ref":"Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-06","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"La tècnica SNaPshot (minisequenciació) es basa en:","op":["La hibridació de sondes en un microarray.","L'amplificació al·lel-específica amb PCR a temps real.","L'extensió d'un encebador en una sola base amb ddNTP marcats amb fluorocroms diferents, detectada per electroforesi capil·lar.","La seqüenciació de tot l'amplicó."],"c":2,"ex":["Això són els microarrays.","Això és la PCR al·lel-específica o TaqMan.","L'encebador acaba just abans del SNP i s'allarga una base amb el ddNTP complementari; el color indica l'al·lel.","No seqüencia l'amplicó."],"clau":"SNaPshot: un ddNTP, un color, un al·lel.","ref":"Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-07","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Un laboratori vol predir el color dels ulls, del cabell i de la pell d'un donant desconegut a partir d'una taca. Quin sistema utilitzarà i quants marcadors conté?","op":["Precision ID Ancestry, amb 165 SNP.","HIrisPlex-S, amb 41 SNP.","SNPforID 52-plex.","Un panell de 20 STR CODIS."],"c":1,"ex":["Aquest panell prediu ancestralitat, no fenotip.","HIrisPlex-S combina 41 variants (HERC2, OCA2, MC1R, SLC45A2, TYR...) per a les tres característiques.","És un panell d'identitat.","Els STR no informen del fenotip."],"clau":"Fenotip: HIrisPlex-S (41 SNP).","ref":"Chaitanya et al. 2018; Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-08","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Els microhaplotips són:","op":["Blocs de dos a quatre SNP molt propers (menys de 300 pb) que s'hereten junts, multial·lèlics i sense stutter.","Insercions o delecions d'una sola base.","Fragments d'ADN mitocondrial.","Al·lels STR de menys de 100 pb."],"c":0,"ex":["Combinen la brevetat dels SNP amb la multial·lelicitat: útils en mescles, parentiu i ancestralitat, sobretot per MPS.","No són indels.","No són mitocondrials.","No són STR."],"clau":"Microhaplotip: diversos SNP en bloc, molts al·lels, zero stutter.","ref":"Kidd et al. 2014; Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-09","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"El kit Investigator DIPplex analitza:","op":["Trenta SNP mitocondrials.","Setze Y-STR.","Vint STR autosòmics.","Trenta polimorfismes d'inserció o deleció (indels) biallèlics, per longitud, útils en ADN degradat."],"c":3,"ex":["No analitza ADNmt.","No analitza el cromosoma Y.","No conté STR.","Els indels es detecten per mida en electroforesi capil·lar amb amplicons curts."],"clau":"DIPplex: 30 indels per a mostres degradades.","ref":"Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-10","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"En un cas sense sospitós, es vol identificar el donant d'un perfil a partir de parents llunyans presents en bases de dades de genealogia. Quin tipus de dades cal generar?","op":["Un haplotip Y-STR per consultar la YHRD.","Centenars de milers de SNP (array o seqüenciació) per comparar segments compartits d'ADN mesurats en centimorgans.","Un perfil de 20 STR per comparar-lo amb CODIS.","Una seqüència de la regió control de l'ADNmt."],"c":1,"ex":["Els Y-STR només informen de la línia paterna.","La genealogia genètica forense treballa amb perfils densos de SNP i segments compartits (IBD).","Els STR no detecten parents llunyans en bases genealògiques.","L'ADNmt només informa de la línia materna."],"clau":"Genealogia forense: SNP a l'engròs i centimorgans compartits.","ref":"Butler, Advanced Topics: Methodology, cap. 12; Greytak et al. 2019"},{"id":"PE.3-11","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Els SNP d'ancestralitat (AISNP) se seleccionen perquè:","op":["Tenen freqüències al·lèliques molt diferents entre poblacions continentals.","Tenen freqüències semblants a totes les poblacions.","Estan tots al cromosoma Y.","Codifiquen la pigmentació."],"c":0,"ex":["Un bon AISNP és quasi fix en una població i rar en una altra.","Això és propi dels SNP d'identitat.","Els Y-SNP són de llinatge.","Els de pigmentació són SNP de fenotip."],"clau":"AISNP: al·lel comú aquí, rar allà.","ref":"Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-12","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Es disposa d'un os molt degradat del qual no s'obté cap perfil STR. Quina alternativa basada en SNP té més probabilitats d'èxit i per què?","op":["Un panell de STR amb més cicles de PCR.","Un panell de VNTR per RFLP.","Cap, perquè els SNP necessiten més ADN que els STR.","Un panell de SNP per seqüenciació massiva, perquè els amplicons són molt curts."],"c":3,"ex":["Més cicles no arreglen fragments massa curts per als encebadors STR.","Els VNTR necessiten ADN llarg i íntegre.","Els SNP necessiten menys longitud, no més quantitat.","Els amplicons de SNP de menys de 100 pb sobreviuen a la fragmentació."],"clau":"ADN trencat: SNP curts.","ref":"Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-13","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"La taxa de mutació dels SNP, d'uns 10^-8 per posició i generació, fa que:","op":["Siguin molt estables i adequats per a parentiu llunyà i llinatges, però poc útils per datar mutacions recents.","Mutin més que els STR.","Es descartin en genealogia.","Siguin inadequats per a parentiu."],"c":0,"ex":["Estabilitat: la mateixa variant es manté durant moltes generacions.","Els STR muten unes cent mil vegades més.","La genealogia genètica es basa en SNP.","Precisament són bons per a parentiu."],"clau":"SNP estable = bo per a llinatges i parents llunyans.","ref":"Butler, Advanced Topics: Methodology, cap. 12"},{"id":"PE.3-14","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"El panell ForenSeq DNA Signature Prep (seqüenciació massiva) inclou:","op":["Només SNP mitocondrials.","STR autosòmics, X i Y, i SNP d'identitat, ancestralitat i fenotip en una sola llibreria.","Només STR autosòmics.","Només marcadors del cromosoma Y."],"c":1,"ex":["No analitza ADNmt.","Combina 27 STR autosòmics, X-STR, Y-STR i 94 iiSNP, 56 aiSNP i 22 piSNP.","Inclou també SNP.","Inclou molt més que el cromosoma Y."],"clau":"ForenSeq: STR i SNP d'identitat, ancestralitat i fenotip alhora.","ref":"Butler, Advanced Topics: Methodology, cap. 17"},{"id":"PE.3-15","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Els Y-SNP s'utilitzen en genètica forense principalment per:","op":["Identificar individus dins d'una mateixa família.","Detectar mescles.","Assignar haplogrups i inferir l'origen biogeogràfic de la línia paterna.","Determinar el sexe."],"c":2,"ex":["Els Y-SNP no distingeixen parents paterns.","No serveixen per a mescles.","Els haplogrups Y (nomenclatura ISOGG) es defineixen per SNP; els Y-STR afinen dins de l'haplogrup.","El sexe es determina amb amelogenina o marcadors Y generals."],"clau":"Y-SNP: haplogrup; Y-STR: haplotip.","ref":"Butler, Advanced Topics: Methodology, cap. 13"},{"id":"PE.3-16","b":"E","t":"E.3","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Una mescla de dues persones s'analitza amb un panell de SNP biallèlics. Per què la interpretació és més difícil que amb STR?","op":["Perquè els SNP produeixen molt stutter.","Perquè els SNP no s'amplifiquen en mescles.","Perquè els SNP no tenen escala al·lèlica.","Perquè amb dos al·lels possibles per locus els contribuents se solapen i no es pot deduir el nombre de contribuents pel nombre d'al·lels."],"c":3,"ex":["Els SNP no fan stutter.","S'amplifiquen igual.","La manca de ladder no és el problema principal.","Amb només dos al·lels, tres pics són impossibles i els genotips es confonen; per això es prefereixen STR o microhaplotips."],"clau":"SNP i mescles: massa poques lletres per repartir.","ref":"Butler, Advanced Topics: Interpretation"},{"id":"PE.4-01","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"En un cicle de PCR per a STR, les temperatures aproximades de desnaturalització, hibridació i extensió són:","op":["94 a 95 °C, 55 a 65 °C i 72 °C.","37 °C, 55 °C i 72 °C.","60 °C, 72 °C i 95 °C.","72 °C, 55 °C i 94 °C."],"c":0,"ex":["Es desnaturalitza a prop de l'ebullició, s'hibriden els encebadors a una temperatura propera a la seva Tm i la Taq treballa òptimament a 72 °C.","37 °C no desnaturalitza.","Està desordenat.","Està desordenat."],"clau":"95 separa, 60 enganxa, 72 allarga.","ref":"Butler, Advanced Topics: Methodology, cap. 4"},{"id":"PE.4-02","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"calcul","q":"Un laboratori amplifica una mostra durant 28 cicles amb eficiència ideal. Quantes còpies, en teoria, s'obtenen d'una sola molècula motlle?","op":["28.","Unes 2,7 x 10^8 (2 elevat a 28).","Unes 784 (28 al quadrat).","Unes 2,7 x 10^4."],"c":1,"ex":["El creixement és exponencial, no lineal.","Amb eficiència del 100 % el nombre de còpies és 2 elevat al nombre de cicles; a la pràctica l'eficiència baixa en els darrers cicles.","No és quadràtic.","Falten ordres de magnitud."],"clau":"Còpies = 2 elevat a n (teòric).","ref":"Butler, Advanced Topics: Methodology, cap. 4"},{"id":"PE.4-03","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Quin paper té el Mg2+ en la reacció de PCR i què passa si la mostra conté EDTA?","op":["Estabilitza els encebadors; l'EDTA no hi influeix.","És un inhibidor que cal eliminar; l'EDTA l'afegeix.","És cofactor imprescindible de la polimerasa; l'EDTA el segresta i redueix o anul·la l'amplificació.","Serveix per marcar els fragments amb fluorescència."],"c":2,"ex":["L'EDTA sí que hi influeix.","El magnesi no és inhibidor.","Sense magnesi lliure la Taq no treballa; l'EDTA (tubs de sang) quelata cations divalents.","No té res a veure amb el marcatge."],"clau":"Sense magnesi, la Taq no funciona; l'EDTA se'l menja.","ref":"Butler, Advanced Topics: Methodology, cap. 4"},{"id":"PE.4-04","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"La polimerasa AmpliTaq Gold és una polimerasa hot start. Què implica?","op":["Que treballa a temperatura ambient.","Que no necessita magnesi.","Que corregeix errors de còpia.","Que és inactiva fins a un escalfament inicial (uns 95 °C durant minuts), cosa que evita l'amplificació inespecífica durant la preparació."],"c":3,"ex":["Precisament no treballa fins que s'activa.","Necessita magnesi com totes.","La Taq no té activitat correctora.","L'activació tèrmica impedeix que la polimerasa allargui encebadors mal hibridats abans del primer cicle."],"clau":"Hot start: la polimerasa dorm fins als 95 °C.","ref":"Butler, Advanced Topics: Methodology, cap. 4"},{"id":"PE.4-05","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"efecte","q":"S'amplifiquen 30 pg d'ADN amb un kit STR estàndard. Quin resultat és previsible?","op":["Efectes estocàstics: pèrdua d'al·lels, desequilibri d'heterozigots i stutter més alt.","Cap amplificació, perquè la PCR necessita almenys 1 ng.","Un perfil complet i equilibrat, perquè la PCR és molt sensible.","Saturació i pull-up per excés d'ADN."],"c":0,"ex":["Per sota d'uns 100 a 125 pg (unes 15 a 20 cèl·lules) el mostreig de molècules és aleatori.","Sí que amplifica, però malament.","No serà equilibrat.","Saturació és el símptoma d'excés, no de defecte."],"clau":"Menys de 100 pg: l'atzar mana.","ref":"Butler, Advanced Topics: Methodology, cap. 11"},{"id":"PE.4-06","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Per què s'afegeix un pas final d'extensió a 60 °C durant diversos minuts en els kits STR?","op":["Per eliminar els dímers d'encebadors.","Per completar l'adenilació no dependent de motlle (+A) i evitar pics dividits -A/+A.","Per desnaturalitzar la polimerasa.","Per marcar els fragments amb fluorescència."],"c":1,"ex":["No elimina dímers.","La Taq afegeix una A a l'extrem 3'; si no tots els productes la tenen, cada al·lel surt com a dos pics separats per una base.","No es desnaturalitza a 60 °C.","El marcatge ve de l'encebador."],"clau":"Extensió final: que tots els fragments portin la A.","ref":"Butler, Advanced Topics: Methodology, cap. 4"},{"id":"PE.4-07","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"efecte","q":"Una mostra de sang en tub amb heparina o amb molta hematina no amplifica. Quin control de la quantificació ho hauria detectat i quina solució es pot provar?","op":["La ladder al·lèlica; canviar de capil·lar.","El patró de mides LIZ; reinjectar la mostra.","El control intern de PCR (IPC) retardat; provar BSA, dilució de l'extracte o una purificació addicional.","El control negatiu; augmentar els cicles."],"c":2,"ex":["La ladder no informa d'inhibició.","El patró de mides és de l'electroforesi.","L'IPC de la qPCR es retarda o falla quan hi ha inhibidors; l'albúmina els segresta i la dilució els redueix.","El negatiu detecta contaminació, no inhibició."],"clau":"Inhibició: IPC retardat, BSA o dilució.","ref":"Butler, Advanced Topics: Methodology, cap. 3 i 4"},{"id":"PE.4-08","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Quina quantitat d'ADN motlle es considera òptima per a un kit STR estàndard?","op":["Entre 10 i 20 ng.","Entre 100 i 200 ng.","Menys de 10 pg.","Entre 0,5 i 1 ng."],"c":3,"ex":["Massa: saturació i artefactes.","Molt per sobre del rang.","Massa poc: pèrdua d'al·lels.","Els kits estan optimitzats per a 0,5 a 1 ng (unes 75 a 150 cèl·lules); per sobre apareix saturació i per sota, efectes estocàstics."],"clau":"Dolç: mig nanogram a un nanogram.","ref":"Butler, Advanced Topics: Methodology, cap. 4"},{"id":"PE.4-09","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El kit GlobalFiler amplifica:","op":["21 STR autosòmics, DYS391, un indel del cromosoma Y i amelogenina, en química de sis colors.","Només STR del cromosoma Y.","16 STR autosòmics i SNP d'ancestralitat.","13 STR autosòmics i amelogenina en quatre colors."],"c":0,"ex":["24 marcadors en total, amb els 20 del CODIS ampliat i SE33.","No és un kit Y.","No conté SNP.","Era la configuració dels kits antics."],"clau":"GlobalFiler: 24 marcadors, 6 colors.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.4-10","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"En el disseny d'un múltiplex STR, els encebadors s'han de dissenyar de manera que:","op":["Tinguin temperatures de fusió molt diferents per amplificar-se en cicles alterns.","Tots els amplicons tinguin exactament la mateixa mida.","Tinguin temperatures de fusió semblants i els amplicons d'un mateix color no se solapin en mida.","Cada locus faci servir el mateix fluorocrom."],"c":2,"ex":["No hi ha cicles alterns.","Cal que siguin diferents per distingir-los.","Cal una única temperatura d'hibridació i mides separades dins de cada canal de color.","Els colors serveixen per separar loci que se solapen en mida."],"clau":"Mateixa Tm, mides diferents, colors repartits.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.4-11","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Un perfil mostra, a diversos loci, el pic principal acompanyat d'un pic una base més curt d'alçada semblant. Quina és la causa més probable?","op":["Stutter n-1.","Adenilació incompleta (pics -A), per exemple per excés d'ADN o extensió final insuficient.","Un al·lel microvariant.","Contaminació."],"c":1,"ex":["El stutter es troba a una unitat de repetició (quatre bases), no a una base.","La doble senyal a una base de distància és el patró clàssic de -A/+A.","Una microvariant no acompanyaria tots els al·lels.","La contaminació no es distribueix així."],"clau":"Un pic a una base: adenilació; a quatre bases: stutter.","ref":"Butler, Advanced Topics: Methodology, cap. 4"},{"id":"PE.4-12","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Els controls que s'han d'incloure en cada tanda d'amplificació STR són:","op":["Control positiu amb ADN de referència (9947A o 2800M), control negatiu sense ADN i blanc de reactius de l'extracció.","Una mostra del cas duplicada.","Només un control negatiu.","Només l'escala al·lèlica."],"c":0,"ex":["El positiu verifica que la reacció funciona, el negatiu i el blanc detecten contaminació.","Duplicar no substitueix els controls.","Cal també el positiu i el blanc.","La ladder és de l'electroforesi."],"clau":"Positiu, negatiu, blanc de reactius: sempre.","ref":"Butler, Advanced Topics: Methodology, cap. 4; ISO 17025"},{"id":"PE.4-13","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"La PCR directa consisteix a:","op":["Fer PCR en un sol cicle.","Seqüenciar directament la mostra.","Amplificar sense encebadors.","Amplificar sense extracció prèvia, posant un tros de paper FTA o un hisop directament a la reacció."],"c":3,"ex":["No.","No és seqüenciació.","Sempre calen encebadors.","S'utilitza en mostres de referència amb molt ADN; estalvia temps i pèrdues d'extracció."],"clau":"PCR directa: del FTA al termociclador.","ref":"Butler, Advanced Topics: Methodology, cap. 4"},{"id":"PE.4-14","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Un laboratori vol amplificar mostres molt degradades amb els mateixos loci del CODIS. Quina estratègia de disseny d'encebadors utilitza?","op":["Encebadors més llargs per augmentar l'especificitat.","Encebadors degenerats.","MiniSTR: encebadors situats més a prop de la regió repetitiva per obtenir amplicons de menys de 150 pb.","Encebadors situats més lluny per incloure regions flanquejants."],"c":2,"ex":["La longitud de l'encebador no redueix l'amplicó.","No cal degeneració.","Els miniSTR redueixen la mida de l'amplicó mantenint el mateix locus i la mateixa nomenclatura.","Allunyar-los empitjora el problema."],"clau":"Degradat: acosta els encebadors a la repetició.","ref":"Butler i Shen 2003; Butler, Advanced Topics: Methodology, cap. 10"},{"id":"PE.4-15","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria
