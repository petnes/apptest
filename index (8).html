","tr":"concepte","q":"El sensor de qualitat (QS) del kit Investigator 24plex serveix per:","op":["Mesurar la quantitat d'ADN.","Distingir si la manca de perfil es deu a inhibició o a degradació, gràcies a dos amplicons control de mides diferents.","Assignar el sexe.","Detectar contaminació humana."],"c":1,"ex":["La quantitat es mesura per qPCR.","Els dos amplicons sintètics del QS s'amplifiquen amb la mostra; si fallen hi ha inhibició, si surten i falten els loci llargs hi ha degradació.","El sexe l'assigna l'amelogenina.","No detecta contaminació."],"clau":"QS: diu si és culpa de l'inhibidor o de la degradació.","ref":"Butler, Advanced Topics: Methodology, cap. 5"},{"id":"PE.4-16","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Per què es recomana un nombre de cicles limitat (28 a 30) en lloc de 34 en els kits STR estàndard?","op":["Perquè més cicles augmenten els efectes estocàstics, el stutter, els artefactes i el risc de detectar contaminacions mínimes.","Perquè el termociclador no permet més cicles.","Perquè amb 34 cicles no s'amplifica res.","Perquè la Taq es degrada a partir del cicle 30."],"c":0,"ex":["Els protocols de baixa quantitat (LCN) pugen a 34 cicles i per això exigeixen rèpliques i perfils consens.","Els termocicladors ho permeten.","Sí que amplifica, però amb més artefactes.","La Taq aguanta més cicles."],"clau":"Més cicles, més senyal i més soroll.","ref":"Butler, Advanced Topics: Methodology, cap. 11"},{"id":"PE.4-17","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Els fluorocroms habituals en un kit STR de cinc colors i el patró de mides són:","op":["Un sol fluorocrom per a tot.","Marcatge radioactiu.","LIZ per als loci i FAM per al patró.","FAM (blau), VIC (verd), NED (groc), PET (vermell) i LIZ (taronja) per al patró de mides."],"c":3,"ex":["Un sol color no permetria 20 loci.","No s'utilitza radioactivitat.","El LIZ es reserva al patró de mides.","Cada canal porta diversos loci separats per mida; el LIZ va en tots els pous amb el patró de mides."],"clau":"Quatre colors per als loci, el cinquè (LIZ) per mesurar.","ref":"Butler, Advanced Topics: Methodology, cap. 5 i 6"},{"id":"PE.4-18","b":"E","t":"E.4","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"El control negatiu d'una tanda d'amplificació mostra un perfil parcial. Què cal fer?","op":["Ignorar-ho si les mostres han donat perfil.","Augmentar els cicles per confirmar.","Considerar contaminada la tanda, investigar-ne l'origen (reactius, personal, ambient) i repetir l'amplificació de les mostres.","Restar el perfil del negatiu als perfils de les mostres."],"c":2,"ex":["No es pot ignorar.","Més cicles no resolen res.","Un negatiu positiu invalida la tanda: cal traçar la contaminació, comparar amb la base d'eliminació i repetir.","No es resten perfils."],"clau":"Negatiu amb perfil = tanda invalidada.","ref":"Butler, Advanced Topics: Methodology, cap. 4; recomanacions ENFSI"},{"id":"PE.5-01","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"En l'electroforesi capil·lar, els fragments d'ADN:","op":["Migren cap al càtode, i els més llargs arriben abans.","Migren cap a l'ànode (pol positiu) a través d'un polímer, i els més curts arriben abans al detector.","Migren cap a l'ànode, i els més llargs arriben abans.","No es mouen: es detecten per gravetat."],"c":1,"ex":["La càrrega negativa va cap al positiu.","L'ADN té càrrega negativa; el polímer (POP-4 o POP-7) frena més els fragments llargs.","Els curts són més ràpids.","Cal camp elèctric."],"clau":"Negatiu cap al positiu; petit corre més.","ref":"Butler, Advanced Topics: Methodology, cap. 6"},{"id":"PE.5-02","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"La injecció electrocinètica de la mostra al capil·lar implica que:","op":["Només entra una fracció de la mostra, que depèn del voltatge, del temps i de la concentració de sals (les sals competeixen amb l'ADN).","El volum injectat és sempre d'1 microlitre.","La sal afavoreix l'entrada d'ADN.","Entra tota la mostra del pou."],"c":0,"ex":["Per això les mostres dessalades donen més senyal i es pot augmentar temps o voltatge en mostres pobres.","No és una injecció volumètrica.","La sal redueix l'entrada d'ADN.","No entra tot."],"clau":"Injecció electrocinètica: entra el que la sal deixa.","ref":"Butler, Advanced Topics: Methodology, cap. 6"},{"id":"PE.5-03","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Per què cada mostra porta un patró de mides intern (per exemple GeneScan 600 LIZ)?","op":["Per servir d'escala al·lèlica.","Per detectar inhibidors.","Per quantificar l'ADN.","Per corregir les variacions de mobilitat entre injeccions i calcular la mida de cada pic amb el mètode Local Southern."],"c":3,"ex":["L'escala al·lèlica és una altra mostra amb tots els al·lels.","No detecta inhibició.","No quantifica.","El patró va marcat amb un color propi i permet convertir el temps de migració en mida en cada capil·lar i injecció."],"clau":"Patró de mides: regle intern de cada mostra.","ref":"Butler, Advanced Topics: Methodology, cap. 6 i 8"},{"id":"PE.5-04","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Un pic apareix en el canal verd exactament a la mateixa mida que un pic molt alt i saturat del canal blau. Com s'interpreta?","op":["Com un al·lel real del locus verd.","Com un stutter del locus blau.","Com un pull-up o bleed-through per saturació o calibratge espectral deficient, no com un al·lel.","Com un spike."],"c":2,"ex":["Coincidir exactament en mida amb un pic saturat és el signe del pull-up.","El stutter és al mateix color i a quatre bases.","La sobreposició espectral fa que un pic saturat en un color aparegui en el color veí; cal diluir i reinjectar o revisar la matriu.","Els spikes surten en tots els colors i són estrets."],"clau":"Mateixa mida, altre color, pic saturat: pull-up.","ref":"Butler, Advanced Topics: Methodology, cap. 6"},{"id":"PE.5-05","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"En un electroferograma apareix un pic molt estret, present en tots els colors alhora i no reproduïble en una segona injecció. Què és?","op":["Un al·lel microvariant.","Un spike (artefacte elèctric o partícula), que s'ignora.","Un dye blob.","Un pull-up."],"c":1,"ex":["Els al·lels tenen forma de pic normal i es reprodueixen.","Els spikes són pics agulla en tots els canals i desapareixen en reinjectar.","Els dye blobs són amples i d'un sol color.","El pull-up copia un pic real d'un altre color."],"clau":"Estret, a tots els colors, no repetible: spike.","ref":"Butler, Advanced Topics: Methodology, cap. 6"},{"id":"PE.5-06","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Els dye blobs són:","op":["Pics amples produïts per fluorocrom lliure no lligat a l'encebador, situats habitualment entre 100 i 150 pb.","Fragments del patró de mides.","Pics de stutter.","Al·lels de mida gran."],"c":0,"ex":["Es redueixen amb purificació dels encebadors o filtrant el producte de PCR.","No pertanyen al patró.","No són stutter.","No són al·lels."],"clau":"Blobs: colorant sol, ample i a l'inici del rang.","ref":"Butler, Advanced Topics: Methodology, cap. 6"},{"id":"PE.5-07","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Quina diferència hi ha entre el llindar analític i el llindar estocàstic?","op":["Són el mateix valor.","L'analític és sempre més alt que l'estocàstic.","L'estocàstic separa senyal de soroll i l'analític detecta mescles.","L'analític separa senyal de soroll (uns 50 RFU); l'estocàstic (uns 150 a 200 RFU) marca el nivell per sota del qual pot faltar l'al·lel germà d'un heterozigot."],"c":3,"ex":["Són valors diferents i es validen per separat.","L'estocàstic és el més alt.","Està invertit.","Per sota de l'analític no s'interpreta res; entre tots dos, un pic únic pot ser un heterozigot amb un al·lel perdut."],"clau":"Analític: és real? Estocàstic: pot faltar-ne un altre?","ref":"Butler, Advanced Topics: Interpretation, cap. 2 i 4"},{"id":"PE.5-08","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"calcul","q":"En un locus heterozigot, els dos al·lels mesuren 2.000 i 900 RFU. Quin és el balanç d'heterozigots i què suggereix?","op":["Un 55 %, dins del rang normal.","Un 122 %, impossible.","Un 45 %, per sota del 60 % esperat: possible efecte estocàstic o mescla.","No es pot calcular sense la ladder."],"c":2,"ex":["El càlcul dona el 45 %.","La ràtio es calcula menor entre major.","PHR = pic menor / pic major = 900/2.000 = 0,45; els perfils de bona qualitat mantenen la ràtio per sobre del 60 %.","No depèn de la ladder."],"clau":"PHR = petit / gran; per sota del 60 %, sospita.","ref":"Butler, Advanced Topics: Interpretation, cap. 3"},{"id":"PE.5-09","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Per què cal analitzar l'escala al·lèlica en la mateixa tanda i amb la mateixa química que les mostres?","op":["Perquè la ladder quantifica l'ADN.","Perquè la mobilitat depèn de la temperatura, el polímer i el fluorocrom, i l'al·lel s'assigna per comparació dins de finestres de ±0,5 pb.","Perquè la ladder és un control de contaminació.","No cal: l'assignació es fa només amb el patró de mides."],"c":1,"ex":["No quantifica.","Petits canvis de migració entre tandes farien caure els pics fora de la finestra (al·lels OL).","No és un control de contaminació.","El patró dona la mida; la ladder dona el nom de l'al·lel."],"clau":"Ladder de la mateixa tanda: el nom de l'al·lel depèn d'ella.","ref":"Butler, Advanced Topics: Methodology, cap. 8"},{"id":"PE.5-10","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"El calibratge espectral (matriu) d'un seqüenciador serveix per:","op":["Mesurar la mida dels fragments.","Fixar el llindar analític.","Compensar la degradació de l'ADN.","Restar la superposició d'emissió entre fluorocroms de manera que cada pic aparegui només en el seu canal."],"c":3,"ex":["La mida la dona el patró intern.","El llindar es valida a part.","No té a veure amb la degradació.","Un calibratge deficient produeix pull-up sistemàtic."],"clau":"Matriu: cada color al seu lloc.","ref":"Butler, Advanced Topics: Methodology, cap. 6"},{"id":"PE.5-11","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"efecte","q":"Un laboratori canvia el polímer POP-4 per POP-7 i observa que alguns al·lels queden fora de les finestres de la ladder antiga. Què ha passat i com es resol?","op":["La mobilitat ha canviat amb el polímer; cal analitzar la ladder en les mateixes condicions i, si escau, revalidar.","El patró de mides s'ha esgotat.","Els al·lels han mutat.","L'ADN s'ha degradat."],"c":0,"ex":["Cada polímer i temperatura donen mobilitats pròpies; la ladder de cada tanda absorbeix aquestes diferències.","No és el patró.","Els al·lels no canvien.","No és degradació."],"clau":"Canvies polímer, canvies mobilitat: ladder nova.","ref":"Butler, Advanced Topics: Methodology, cap. 6"},{"id":"PE.5-12","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Per què cal una resolució d'una sola base en l'electroforesi capil·lar d'STR?","op":["Per detectar SNP dins dels STR.","Per distingir microvariants com TH01 9.3 de l'al·lel 10, separats només per una base.","Per quantificar l'ADN.","No cal: n'hi ha prou amb quatre bases."],"c":1,"ex":["La seqüència no es veu en CE.","Els al·lels .1, .2 i .3 exigeixen resolució d'una base.","No quantifica.","Quatre bases no distingirien les microvariants."],"clau":"Una base de resolució: per no confondre 9.3 amb 10.","ref":"Butler, Advanced Topics: Methodology, cap. 6"},{"id":"PE.5-13","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Una mostra de baixa quantitat dona pics d'uns 40 RFU. Quina de les mesures següents és una opció correcta abans de reamplificar?","op":["Baixar el llindar analític fins a 10 RFU.","Reinjectar amb més sal.","Augmentar el temps o el voltatge d'injecció, o dessalar el producte de PCR, per fer entrar més ADN al capil·lar.","Canviar el patró de mides."],"c":2,"ex":["Els llindars no es canvien segons la mostra.","La sal redueix la injecció.","La injecció electrocinètica admet més senyal si s'injecta més temps o amb menys sals.","El patró no hi influeix."],"clau":"Poc senyal: injecta més temps o treu la sal.","ref":"Butler, Advanced Topics: Methodology, cap. 6 i 11"},{"id":"PE.5-14","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Un pic saturat en un instrument 3500 (per sobre d'uns 30.000 RFU) pot provocar:","op":["Migració més lenta.","Desnaturalització de l'ADN.","Pèrdua d'al·lels.","Pics aplanats o dividits, pull-up en altres colors i stutter aparentment elevat."],"c":3,"ex":["No afecta la migració.","No té res a veure amb la desnaturalització.","La saturació no fa perdre al·lels.","La saturació del detector deforma el pic i arrossega els canals veïns; cal diluir el producte i reinjectar."],"clau":"Massa senyal: pics deformats i pull-up.","ref":"Butler, Advanced Topics: Methodology, cap. 6"},{"id":"PE.5-15","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"La formamida Hi-Di que es barreja amb el producte de PCR abans de la injecció serveix per:","op":["Mantenir l'ADN desnaturalitzat (monocatenari) i estable durant la injecció i la separació.","Augmentar la mida dels fragments.","Degradar les proteïnes.","Marcar els fragments amb fluorescència."],"c":0,"ex":["L'anàlisi de fragments es fa amb ADN de cadena senzilla; la formamida de baixa conductivitat evita que es reassocii i no competeix amb la injecció.","No canvia la mida.","No és un enzim.","No marca res."],"clau":"Formamida: cadena senzilla i poca sal.","ref":"Butler, Advanced Topics: Methodology, cap. 6"},{"id":"PE.5-16","b":"E","t":"E.5","o":"propia","src":"pròpia, part específica, fase 1 (setembre 2026)","k":"cas","tr":"concepte","q":"Es detecta un al·lel a D18S51 fora de les finestres de la ladder (OL). Quina és la conducta correcta?","op":["Assignar-li l'al·lel de la finestra més propera.","Reinjectar o reamplificar per confirmar-lo i, si es reprodueix, designar-lo per mida com a microvariant o al·lel fora d'escala.","Descartar-lo sempre com a artefacte.","Considerar la mostra contaminada."],"c":1,"ex":["No es pot arrodonir a la finestra veïna.","Els al·lels OL poden ser microvariants reals; cal confirmar-los abans de designar-los.","Pot ser un al·lel real.","Un OL no implica contaminació."],"clau":"OL: confirma, després anomena per mida.","ref":"Butler, Advanced Topics: Methodology, cap. 8"},{"id":"Lh1fzcbrn","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Segons l'art. 1.1 de la Constitució, quins són els valors superiors de l'ordenament jurídic?","op":["La llibertat, la seguretat, la igualtat i la solidaritat","La llibertat, la justícia, la igualtat i el pluralisme polític","La justícia, la igualtat, la democràcia i el pluralisme polític","La dignitat, la llibertat, la justícia i la igualtat"],"c":1,"ex":["La seguretat i la solidaritat surten en altres preceptes (arts. 2, 9.3 i 17), però no en aquesta llista.","Són els quatre valors que enumera literalment l'art. 1.1 CE.","«Democràtic» qualifica l'Estat, però no és un dels valors superiors.","La dignitat de la persona és el fonament de l'ordre polític (art. 10.1), no un valor superior."],"clau":"Sigla LJIP: Llibertat, Justícia, Igualtat, Pluralisme polític. La dignitat viu a l'art. 10.","ref":"art. 1.1 de la Constitució CE"},{"id":"Lh1ddxlxx","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"termini","q":"La persona detinguda preventivament ha de ser posada en llibertat o a disposició judicial, segons l'art. 17.2 CE, en el termini màxim de:","op":["72 hores","48 hores","5 dies","24 hores"],"c":0,"ex":["És el límit constitucional, tot i que la detenció no pot durar més del temps estrictament necessari.","No és el termini constitucional; 48 hores és la pròrroga possible en casos de terrorisme.","És el màxim en terrorisme amb pròrroga judicial (72 + 48 hores), no la regla de l'art. 17.2.","Les 24 hores apareixen a la LECrim, però el sostre que fixa la Constitució és de 72."],"clau":"El sostre constitucional són 72 hores; la LECrim hi afegeix el límit del temps estrictament necessari.","ref":"art. 17.2 CE"},{"id":"Lhcvuuer","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quins drets estan protegits pel procediment preferent i sumari i pel recurs d'empara (art. 53.2 CE)?","op":["Tots els drets del títol I","L'art. 14, els drets de la secció 1a del capítol II del títol I i l'objecció de consciència","Només els drets dels arts. 15 a 29","Els drets de la secció 2a del capítol II (arts. 30 a 38)"],"c":1,"ex":["Els principis rectors del capítol III només informen la legislació i l'actuació dels poders públics (art. 53.3).","L'art. 53.2 hi inclou l'art. 14 i els arts. 15 a 29; l'empara s'estén a l'objecció de consciència de l'art. 30.","Hi falten la igualtat de l'art. 14 i l'objecció de consciència.","Tenen reserva de llei i contingut essencial, però no empara, llevat de l'objecció de consciència."],"clau":"Empara = 14 + 15 a 29 + objecció de consciència.","ref":"art. 53.2 CE"},{"id":"Lhtabhqf","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"L'art. 104 CE atribueix a les Forces i Cossos de Seguretat, sota la dependència del Govern, la missió de:","op":["Garantir la sobirania i la independència d'Espanya i defensar-ne la integritat territorial","Perseguir els delictes sota la direcció del Ministeri Fiscal","Defensar la legalitat i l'interès públic tutelat per la llei","Protegir el lliure exercici dels drets i llibertats i garantir la seguretat ciutadana"],"c":3,"ex":["És la missió de les Forces Armades (art. 8 CE).","La dependència funcional de jutges i fiscals és pròpia de la policia judicial (art. 126 CE).","És part de la missió del Ministeri Fiscal (art. 124 CE).","És la dicció literal de l'art. 104.1 CE."],"clau":"Policia: protegir drets i garantir la seguretat. Exèrcit: sobirania i integritat. Fiscal: legalitat. Policia judicial: sota jutges i fiscals.","ref":"art. 104 CE"},{"id":"Lh15ffujq","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Segons l'art. 137 CE, l'Estat s'organitza territorialment en:","op":["Províncies, regions i nacionalitats","Municipis, províncies, illes i comunitats autònomes","Municipis, comarques i comunitats autònomes","Municipis, províncies i comunitats autònomes"],"c":3,"ex":["Nacionalitats i regions surten a l'art. 2 com a titulars del dret a l'autonomia, no com a nivells d'organització.","Les illes tenen administració pròpia (art. 141.4), però l'art. 137 només cita tres nivells.","Les comarques no apareixen a l'art. 137; les preveu la legislació autonòmica.","Totes aquestes entitats gaudeixen d'autonomia per a la gestió dels seus interessos respectius."],"clau":"Tres peces al 137: municipi, província, comunitat autònoma.","ref":"art. 137 CE"},{"id":"Lh1ow0s86","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"competencia","q":"La competència exclusiva de l'Estat sobre seguretat pública (art. 149.1.29a CE) s'entén sens perjudici de:","op":["La delegació de la competència a les comunitats autònomes per decret","La possibilitat que les comunitats autònomes creïn policies en la forma que estableixin els estatuts, en el marc d'una llei orgànica","Les competències exclusives dels ajuntaments en matèria d'ordre públic","L'autorització prèvia del Consell de Política de Seguretat"],"c":1,"ex":["La previsió és estatutària i en el marc d'una llei orgànica, no una delegació per decret.","És el text del precepte; la llei orgànica és la LO 2/1986.","Els municipis no tenen cap competència exclusiva d'ordre públic; les policies locals hi col·laboren.","És un òrgan de coordinació creat per la LO 2/1986; no habilita la creació de policies."],"clau":"149.1.29a: seguretat pública estatal, amb policies autonòmiques via estatut i llei orgànica.","ref":"art. 149.1 CE"},{"id":"Lheqvrw1","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"excepcio","q":"Quin d'aquests drets NO es pot suspendre ni en l'estat d'excepció ni en el de setge (art. 55.1 CE)?","op":["La inviolabilitat del domicili","El dret de vaga","El dret de reunió","El dret a la vida i a la integritat física i moral"],"c":3,"ex":["L'art. 18.2 és suspensible en els estats d'excepció i de setge.","L'art. 28.2 també és suspensible.","L'art. 21 és a la llista de drets suspensibles.","L'art. 15 no figura entre els drets suspensibles."],"clau":"Suspensibles: 17, 18.2 i 18.3, 19, 20.1.a i d, 20.5, 21, 28.2 i 37.2. La vida, mai.","ref":"art. 55.1 CE"},{"id":"Lh1j3ztrc","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Segons l'art. 164.4 EAC, la Junta de Seguretat de Catalunya és:","op":["Un òrgan consultiu del Parlament en matèria de seguretat","L'òrgan que coordina les policies locals, presidit pel conseller","L'òrgan de coordinació entre la Policia de la Generalitat i les forces i cossos de seguretat de l'Estat, paritari i presidit pel president de la Generalitat","Un òrgan presidit pel ministre de l'Interior amb majoria estatal"],"c":2,"ex":["No depèn del Parlament; és un òrgan mixt Estat i Generalitat.","Aquesta funció és de la Comissió de Policia de Catalunya (Llei 4/2003).","Així ho defineix l'Estatut.","La composició és paritària i la presideix el president de la Generalitat."],"clau":"Junta de Seguretat: Estat i Generalitat a parts iguals, i presideix el president de la Generalitat.","ref":"art. 164.4 EAC"},{"id":"Lh8n79cd","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"competencia","q":"Quina competència atribueix l'art. 163 EAC a la Generalitat en matèria de seguretat privada?","op":["La competència executiva, que inclou autoritzar empreses, inspeccionar i sancionar","Cap, perquè tota la seguretat privada és estatal","La competència exclusiva, legislativa i executiva","Una competència compartida per dictar legislació de desplegament"],"c":0,"ex":["L'Estatut reserva a la Generalitat l'execució de la legislació estatal.","L'art. 163 sí que atribueix funcions executives a la Generalitat.","La legislació és estatal (Llei 5/2014).","No és compartida: l'Estatut la configura com a executiva."],"clau":"Seguretat privada: competència executiva. Seguretat pública: creació i comandament de la policia pròpia.","ref":"art. 163 EAC"},{"id":"Lhkbzdpf","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Segons l'art. 164.3 EAC, la Policia de la Generalitat-Mossos d'Esquadra té com a àmbit:","op":["El conjunt del territori de Catalunya i totes les funcions pròpies d'un cos de policia","Només les funcions de trànsit i de policia administrativa","Tot el territori, excepte la policia judicial, reservada a l'Estat","Els municipis que no tenen policia local"],"c":0,"ex":["Seguretat ciutadana, ordre públic, policia administrativa i policia judicial.","L'Estatut li reconeix el conjunt de funcions policials.","La policia judicial i la investigació criminal formen part de les seves funcions.","Actua a tot el territori; les policies locals tenen àmbit municipal."],"clau":"Mossos = policia integral: tot el territori i totes les funcions.","ref":"art. 164.3 EAC"},{"id":"Lh1io4lfp","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Com s'anomenen les normes amb rang de llei que dicta el Govern per delegació del Parlament (art. 63 EAC)?","op":["Decrets llei","Lleis de bases","Decrets legislatius","Decrets del Govern"],"c":2,"ex":["Són normes provisionals per a casos de necessitat extraordinària i urgent, sense delegació (art. 64).","La llei de bases és l'instrument de delegació, no la norma que en resulta.","El Parlament hi delega la potestat de dictar normes amb rang de llei.","És la forma dels reglaments, que no tenen rang de llei."],"clau":"Decret legislatiu: el Parlament presta la potestat. Decret llei: el Govern s'avança per urgència.","ref":"art. 63 EAC"},{"id":"Lhqxdhqy","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quina matèria NO pot ser objecte de decret llei segons l'art. 64.1 EAC?","op":["La modificació d'una llei de taxes","Mesures urgents en matèria d'habitatge","El pressupost de la Generalitat","L'organització de l'Administració de la Generalitat"],"c":2,"ex":["No és una de les matèries excloses.","Hi cap el decret llei si hi ha necessitat extraordinària i urgent.","Tampoc no ho poden ser la reforma de l'Estatut, les lleis de desenvolupament bàsic ni la regulació essencial dels drets estatutaris.","No és una matèria vedada."],"clau":"Vedats al decret llei: Estatut, desenvolupament bàsic, pressupost i drets estatutaris.","ref":"art. 64.1 EAC"},{"id":"Lh1ogbrn9","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"A més del català i el castellà, quina llengua és oficial a Catalunya segons l'art. 6 EAC?","op":["La llengua de signes catalana","Cap altra","L'aragonès","L'occità, anomenat aranès a l'Aran"],"c":3,"ex":["Està protegida per l'Estatut, però no és oficial.","L'occità també té aquesta condició.","No és oficial a Catalunya.","Ho estableix l'art. 6.5 EAC."],"clau":"Tres oficials: català, castellà i occità.","ref":"art. 6 EAC"},{"id":"Lh2vzjj9","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Segons l'art. 68 EAC, el Govern és:","op":["L'òrgan col·legiat superior que dirigeix l'acció política i l'Administració de la Generalitat","L'òrgan que exerceix la potestat legislativa","Un òrgan consultiu del president","L'òrgan unipersonal que representa la Generalitat"],"c":0,"ex":["També exerceix la funció executiva i la potestat reglamentària.","Aquesta potestat és del Parlament (art. 55).","És un òrgan de direcció.","Representar la Generalitat correspon al president (art. 67)."],"clau":"Parlament legisla, Govern dirigeix i reglamenta, President representa.","ref":"art. 68 EAC"},{"id":"Lh8p9x4t","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Quin òrgan de cada departament de la Generalitat dirigeix els serveis comuns (personal, pressupost, règim interior)?","op":["La secretaria general","La subdirecció general","El gabinet del conseller","La direcció general"],"c":0,"ex":["Dirigeix els serveis comuns i vetlla pel funcionament intern del departament.","És una unitat de nivell inferior.","Presta suport polític i de comunicació.","Les direccions generals gestionen sectors materials d'activitat."],"clau":"Secretaria general, la casa. Direcció general, una política.","ref":""},{"id":"Lhkp5ipi","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Els organismes autònoms de la Generalitat es caracteritzen per:","op":["Actuar sempre sotmesos al dret privat","Tenir forma de societat amb capital majoritàriament públic","Ser òrgans del departament sense personalitat jurídica","Tenir personalitat jurídica pròpia i actuar sotmesos al dret públic"],"c":3,"ex":["Això caracteritza les societats mercantils públiques.","És la definició d'empresa pública.","Tenen personalitat jurídica diferenciada.","Són entitats instrumentals que exerceixen activitats administratives de manera descentralitzada."],"clau":"Personalitat pròpia i dret públic = organisme autònom.","ref":""},{"id":"Lh13smmpv","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Quina d'aquestes entitats és un organisme autònom adscrit al departament competent en seguretat pública?","op":["La Direcció General de la Policia","La Junta de Seguretat de Catalunya","L'Institut de Seguretat Pública de Catalunya","El Consell de Seguretat de Catalunya"],"c":2,"ex":["És un òrgan del departament, sense personalitat jurídica.","És un òrgan paritari de coordinació entre l'Estat i la Generalitat.","La Llei 10/2007 el configura com a organisme autònom.","És un òrgan consultiu i de participació."],"clau":"ISPC: organisme autònom amb seu a Mollet del Vallès.","ref":"Llei 10/2007"},{"id":"Lh12hr5ff","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Segons l'art. 2.2 de la Llei 40/2015, el sector públic institucional comprèn:","op":["Només els organismes autònoms","Els partits polítics i els sindicats","L'Administració General de l'Estat i les administracions autonòmiques","Els organismes públics i entitats de dret públic, les entitats de dret privat vinculades o dependents i les universitats públiques"],"c":3,"ex":["El concepte és molt més ampli.","No formen part del sector públic.","Són administracions territorials, no sector públic institucional.","És la llista del precepte."],"clau":"Sector públic = territorial (Estat, CA, ens locals) + institucional.","ref":"art. 2.2 de la Llei 40/2015"},{"id":"Lhuptmkj","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quina entitat del sector públic es regeix majoritàriament pel dret privat i té capital social majoritàriament públic?","op":["El consorci","La fundació del sector públic","La societat mercantil pública","L'organisme autònom"],"c":2,"ex":["El creen diverses administracions per a finalitats d'interès comú.","Les fundacions tenen dotació fundacional, no capital social.","El capital social és la marca distintiva.","Es regeix pel dret administratiu."],"clau":"Capital social = societat. Dotació = fundació. Diverses administracions = consorci.","ref":""},{"id":"Lh1skj3g1","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quin tractat va crear la Comunitat Econòmica Europea el 1957?","op":["El Tractat de París","El Tractat de Roma","L'Acta Única Europea","El Tractat de Maastricht"],"c":1,"ex":["El 1951 va crear la CECA.","També va crear l'Euratom.","El 1986 va impulsar el mercat interior.","El 1992 va crear la Unió Europea."],"clau":"París 1951 carbó i acer; Roma 1957 CEE; Maastricht 1992 UE; Lisboa 2007, en vigor el 2009.","ref":""},{"id":"Lh1ah2zxm","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"requisit","q":"Quin acte jurídic de la UE és obligatori en tots els seus elements i directament aplicable a cada Estat membre?","op":["La directiva","La decisió","El reglament","La recomanació"],"c":2,"ex":["Obliga quant al resultat i requereix transposició.","És obligatòria, però només per als destinataris que designa.","Ho estableix l'art. 288 TFUE.","No és vinculant."],"clau":"Reglament: directe per a tothom. Directiva: resultat i transposició.","ref":"art. 288 TFUE"},{"id":"Lh5o6r3e","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quines són les quatre llibertats del mercat interior europeu?","op":["Mercaderies, treballadors, empreses i divises","Lliure circulació de mercaderies, persones, serveis i capitals","Mercaderies, persones, informació i capitals","Persones, capitals, energia i dades"],"c":1,"ex":["Barreja conceptes: els treballadors són part de la lliure circulació de persones.","Són les llibertats fonamentals dels tractats.","La informació no és una de les quatre llibertats.","L'energia i les dades no hi són."],"clau":"Mercat interior = M, P, S, C.","ref":""},{"id":"Lhrcp0ka","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quina institució de la UE té, amb caràcter general, la iniciativa legislativa?","op":["El Parlament Europeu","El Consell de la UE","La Comissió Europea","El Consell Europeu"],"c":2,"ex":["Colegisla amb el Consell, però no té iniciativa general.","Colegisla, però la proposta prové de la Comissió.","Els actes legislatius s'adopten a proposta seva (art. 17.2 TUE).","Dona impuls i orientacions, però no exerceix funcions legislatives."],"clau":"La Comissió proposa; el Parlament i el Consell decideixen.","ref":"art. 17.2 TUE"},{"id":"Lh5x9avk","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"El dret originari de la UE el formen principalment:","op":["Els reglaments i les directives","Els tractats i els seus protocols, i la Carta de drets fonamentals","Les sentències del Tribunal de Justícia","Les lleis dels estats membres"],"c":1,"ex":["Són dret derivat.","La Carta té el mateix valor jurídic que els tractats (art. 6 TUE).","La jurisprudència interpreta el dret, no és dret originari.","Són dret intern."],"clau":"Originari = tractats i Carta. Derivat = el que aproven les institucions.","ref":"art. 6 TUE"},{"id":"Lhm1dx8u","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"La llibertat d'establiment permet:","op":["Que una persona o empresa s'instal·li de manera estable en un altre Estat membre per exercir-hi una activitat econòmica","Treballar per compte d'altri en un altre Estat","Prestar un servei temporal en un altre Estat sense instal·lar-s'hi","Moure capitals sense restriccions"],"c":0,"ex":["Aquesta estabilitat la distingeix de la prestació de serveis.","És la lliure circulació de treballadors.","És la lliure prestació de serveis.","És la lliure circulació de capitals."],"clau":"Establiment = estable. Serveis = de pas.","ref":""},{"id":"Lh1ycvg9w","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quina institució vetlla per la interpretació i aplicació uniforme del dret de la UE?","op":["El Tribunal Europeu de Drets Humans","El Tribunal Internacional de Justícia","El Tribunal de Comptes Europeu","El Tribunal de Justícia de la Unió Europea"],"c":3,"ex":["Pertany al Consell d'Europa, a Estrasburg.","És l'òrgan judicial de l'ONU, a la Haia.","Controla les finances de la Unió.","Té la seu a Luxemburg."],"clau":"Luxemburg és la UE; Estrasburg, el Consell d'Europa.","ref":""},{"id":"Lhkezj4","b":"1","t":"1.5","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quants vocals integren el Consell General del Poder Judicial, a més del president?","op":["Quinze","Vint-i-un","Dotze","Vint"],"c":3,"ex":["Quinze anys és l'experiència mínima exigida als juristes de designació parlamentària.","Vint-i-u és el total si hi comptes el president.","Dotze són els vocals d'origen judicial, i també els magistrats del TC.","Art. 122.3 CE: vint membres nomenats per cinc anys."],"clau":"CGPJ: 20 + president. 12 jutges i 8 juristes, 4 per cambra.","ref":"Art. 122.3 CE"},{"id":"Lh6leiu2","b":"1","t":"1.5","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Segons l'art. 123 CE, el Tribunal Suprem és:","op":["L'òrgan de govern del poder judicial","L'òrgan en què culmina l'organització judicial a Catalunya","L'òrgan jurisdiccional superior en tots els ordres, excepte en matèria de garanties constitucionals","L'intèrpret suprem de la Constitució"],"c":2,"ex":["És el CGPJ.","Aquest és el TSJC (art. 95 EAC).","Les garanties constitucionals corresponen al TC.","Aquest és el Tribunal Constitucional."],"clau":"TS: cim de la jurisdicció ordinària. El TC queda fora del poder judicial.","ref":"art. 123 CE"},{"id":"Lh19dz1dz","b":"1","t":"1.5","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"El Ministeri Fiscal actua conforme als principis de:","op":["Independència, inamovibilitat i responsabilitat","Jerarquia, descentralització i coordinació","Unitat d'actuació i dependència jeràrquica, amb subjecció a la legalitat i la imparcialitat","Oportunitat i discrecionalitat"],"c":2,"ex":["Són principis dels jutges i magistrats (art. 117).","Són principis de l'Administració (art. 103).","Ho estableix l'art. 124.2 CE.","El fiscal està sotmès a la legalitat."],"clau":"Fiscal: unitat i dependència; legalitat i imparcialitat.","ref":"art. 124.2 CE"},{"id":"Lh1yntwpo","b":"1","t":"1.5","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"El Fiscal General de l'Estat és nomenat pel Rei:","op":["A proposta del CGPJ","A proposta del president del Tribunal Suprem","A proposta del Congrés per tres cinquenes parts","A proposta del Govern, escoltat el CGPJ"],"c":3,"ex":["El CGPJ només és escoltat.","No intervé en el nomenament.","No hi ha elecció parlamentària.","Art. 124.4 CE."],"clau":"Govern proposa, CGPJ opina.","ref":"Art. 124.4 CE"},{"id":"Lhp3no2w","b":"1","t":"1.5","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Segons l'art. 95 EAC, el Tribunal Superior de Justícia de Catalunya:","op":["És l'òrgan jurisdiccional en què culmina l'organització judicial a Catalunya","El presideix el president de la Generalitat","Coneix de tots els recursos de cassació","És un òrgan de la Generalitat"],"c":0,"ex":["Sens perjudici de la competència del Tribunal Suprem per unificar doctrina.","El seu president el nomena el Rei a proposta del CGPJ.","La cassació correspon, en general, al Tribunal Suprem.","Forma part del poder judicial, que és únic."],"clau":"A Catalunya, el sostre és el TSJC; per damunt, el TS.","ref":"art. 95 EAC"},{"id":"Lh1ibceja","b":"1","t":"1.5","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"L'art. 117.3 CE atribueix l'exercici de la potestat jurisdiccional, jutjant i fent executar el que s'ha jutjat:","op":["Als jutjats, als tribunals i al Ministeri Fiscal","Al Consell General del Poder Judicial","Exclusivament als jutjats i tribunals determinats per les lleis","Als jutges i a la policia judicial"],"c":2,"ex":["El fiscal promou l'acció de la justícia, però no jutja.","El CGPJ governa el poder judicial, no jutja.","És el principi d'exclusivitat.","La policia judicial auxilia jutges i fiscals."],"clau":"Jutjar i fer executar: només jutges i tribunals.","ref":"art. 117.3 CE"},{"id":"Lh1pdp52o","b":"1","t":"1.6","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Per delegar en el Govern la redacció d'un text articulat, les Corts Generals han d'aprovar:","op":["Una llei de bases","Un  al Consell de la Policia (art. 60 Llei 10/1994)?","op":["Per acord del mateix Consell","Per reglament del Govern","Per llei orgànica","Per ordre del Ministeri de l'Interior"],"c":1,"ex":["No.","Com va fer el Decret 135/2003.","No.","No."],"clau":"Art. 60: les eleccions es despleguen per reglament.","ref":"art. 60 Llei 10/1994"},{"id":"Lh1jw7nvu","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Segons l'art. 1.3 CE, quina és la forma política de l'Estat espanyol?","op":["La república federal","La monarquia presidencialista","La monarquia constitucional pura","La monarquia parlamentària"],"c":3,"ex":["No és la forma política de l'Estat.","No existeix aquesta forma a la Constitució.","El Rei no té poders executius propis; és parlamentària.","Art. 1.3 CE."],"clau":"Valors, sobirania popular i monarquia parlamentària: els tres pilars de l'article primer.","ref":"art. 1.3 CE"},{"id":"Lh1tcay3o","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"On resideix la sobirania nacional segons l'art. 1.2 CE?","op":["En el Rei","En el poble espanyol, del qual emanen els poders de l'Estat","En les Corts Generals","En les nacionalitats i regions"],"c":1,"ex":["El Rei és el cap de l'Estat, no el titular de la sobirania.","Art. 1.2 CE.","Les Corts representen el poble (art. 66), però no en són titulars.","Tenen dret a l'autonomia (art. 2), no la sobirania."],"clau":"Sobirania al poble; representació a les Corts.","ref":"art. 1.2 CE"},{"id":"Lh53tjjc","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Com s'han d'interpretar les normes sobre drets fonamentals segons l'art. 10.2 CE?","op":["De conformitat amb la Declaració universal de drets humans i els tractats internacionals ratificats per Espanya","Només segons la jurisprudència del Tribunal Suprem","De manera restrictiva, per protegir l'ordre públic","Segons el criteri del Govern"],"c":0,"ex":["És el criteri hermenèutic de l'art. 10.2.","La referència són la DUDH i els tractats.","No és el que diu la Constitució.","No hi ha cap criteri governamental."],"clau":"La dignitat és el fonament, i els drets s'interpreten segons la DUDH i els tractats.","ref":"art. 10.2 CE"},{"id":"Lhw00z7m","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Com s'estructura la Constitució de 1978?","op":["Un títol preliminar, deu títols i 169 articles, amb disposicions addicionals, transitòries, derogatòria i final","Set títols i 169 articles","Dotze títols i 200 articles","Un preàmbul i vuit títols"],"c":0,"ex":["Són 4 addicionals, 9 transitòries, 1 derogatòria i 1 final.","Els articles són 169, però els títols són deu més el preliminar.","La Constitució no té dotze títols ni arriba als 200 articles.","Té títol preliminar més deu títols."],"clau":"Preliminar + 10 títols + 169 articles.","ref":""},{"id":"Lhvplvkl","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Qui està legitimat per interposar el recurs d'empara (art. 162.1.b CE)?","op":["Només el Defensor del Poble","Només els jutges i tribunals","Tota persona natural o jurídica que invoqui un interès legítim, el Defensor del Poble i el Ministeri Fiscal","50 diputats o 50 senadors"],"c":2,"ex":["També les persones i el fiscal.","Els jutges plantegen la qüestió d'inconstitucionalitat.","Art. 162.1.b CE.","És la legitimació per al recurs d'inconstitucionalitat."],"clau":"Empara: persones, Defensor i fiscal.","ref":"art. 162.1 CE"},{"id":"Lh1lrc0w8","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Qui pot interposar un recurs d'inconstitucionalitat (art. 162.1.a CE)?","op":["Qualsevol ciutadà amb interès legítim","Els jutges de primera instància","El president del Govern, el Defensor del Poble, 50 diputats, 50 senadors i els òrgans executius i assemblees de les CA","Només el Govern de l'Estat"],"c":2,"ex":["Els ciutadans tenen l'empara, no aquest recurs.","Plantegen la qüestió d'inconstitucionalitat.","Art. 162.1.a CE.","La llista és més àmplia."],"clau":"Recurs d'inconstitucionalitat: 50 + 50, president, Defensor i CA.","ref":"art. 162.1 CE"},{"id":"Lh4y7cy8","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quan es planteja una qüestió d'inconstitucionalitat (art. 163 CE)?","op":["Quan un ciutadà considera vulnerat un dret fonamental","Quan un òrgan judicial considera que una norma amb rang de llei aplicable al cas i de la qual depèn la decisió pot ser contrària a la Constitució","Quan el Govern vol impugnar una llei autonòmica","Quan dues administracions discuteixen una competència"],"c":1,"ex":["Seria un recurs d'empara.","La planteja el jutge davant el TC.","Seria un recurs d'inconstitucionalitat.","Seria un conflicte de competència."],"clau":"Qüestió = pregunta del jutge al TC.","ref":"art. 163 CE"},{"id":"Lh1qmuvty","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Com es declara l'estat d'alarma (art. 116.2 CE)?","op":["Pel Govern amb autorització prèvia del Congrés, per trenta dies","Pel Rei, a proposta del president del Govern","Pel Govern, per decret acordat en Consell de Ministres, per un màxim de quinze dies i donant compte al Congrés","Pel Congrés per majoria absoluta, a proposta del Govern"],"c":2,"ex":["Això és l'estat d'excepció.","El Rei no declara cap estat excepcional; ho fa el Govern o el Congrés.","La pròrroga requereix autorització del Congrés.","Això és l'estat de setge."],"clau":"Alarma 15 dies (Govern); excepció 30 dies (autorització prèvia); setge, majoria absoluta del Congrés.","ref":"art. 116.2 CE"},{"id":"Lh1ga4y09","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"En quins casos es pot entrar en un domicili sense consentiment del titular (art. 18.2 CE)?","op":["Amb resolució judicial o en cas de delicte flagrant","Quan hi hagi sospites raonables de qualsevol infracció","Amb autorització de l'alcalde","Sempre que ho ordeni un comandament policial"],"c":0,"ex":["Són els únics supòsits constitucionals.","No n'hi ha prou amb sospites.","No és un supòsit constitucional.","Cal resolució judicial, llevat de flagrància."],"clau":"Domicili: consentiment, jutge o flagrància.","ref":"art. 18.2 CE"},{"id":"Lh1w9xsvy","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quins drets reconeix l'art. 17.3 CE a tota persona detinguda?","op":["Ser informada immediatament i de manera comprensible dels seus drets i de les raons de la detenció, no declarar i tenir assistència d'advocat","Quedar en llibertat si no confessa en 24 hores","Rebre la visita de familiars abans de declarar","Triar el jutge que la jutjarà"],"c":0,"ex":["Són garanties essencials de la detenció.","No existeix cap dret a la llibertat per no confessar; el límit és la durada de la detenció, no la confessió.","No és un dret de l'art. 17.3.","No existeix."],"clau":"Informació, silenci i advocat.","ref":"art. 17.3 CE"},{"id":"Lh1wlkwx1","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"requisit","q":"Què exigeix l'art. 21.2 CE per a les reunions en llocs de trànsit públic i les manifestacions?","op":["Autorització judicial","Cap requisit","Comunicació prèvia a l'autoritat, que només les pot prohibir per raons fonamentades d'alteració de l'ordre públic amb perill per a persones o béns","Autorització prèvia de l'autoritat governativa"],"c":2,"ex":["Els jutges no autoritzen manifestacions; la comunicació es fa a l'autoritat governativa.","Cal comunicació prèvia.","No cal autorització prèvia.","El dret de reunió no requereix autorització."],"clau":"Reunió: es comunica, no es demana permís.","ref":"art. 21.2 CE"},{"id":"Lh1sdqdtw","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quines associacions prohibeix expressament l'art. 22.5 CE?","op":["Les de caràcter religiós","Les formades per estrangers","Les que no estiguin inscrites en un registre","Les secretes i les de caràcter paramilitar"],"c":3,"ex":["Les associacions religioses són lícites i estan emparades per la llibertat religiosa.","Els estrangers també poden associar-se; la nacionalitat no fa il·legal una associació.","La inscripció té només efectes de publicitat.","També són il·legals les que persegueixen fins o utilitzen mitjans tipificats com a delicte."],"clau":"Prohibides: secretes i paramilitars.","ref":"art. 22.5 CE"},{"id":"Lh1dgxmo5","b":"1","t":"1.1","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Què permet l'art. 55.2 CE?","op":["Suspendre de manera general tots els drets fonamentals","Declarar l'estat de setge sense el Congrés","Suspendre de manera individual determinats drets per a investigacions sobre bandes armades o elements terroristes, amb intervenció judicial i control parlamentari","Suspendre l'autonomia d'una comunitat"],"c":2,"ex":["La suspensió general només es produeix en els estats d'excepció i de setge, i mai de tots els drets.","El setge el declara el Congrés per majoria absoluta; la suspensió individual no hi té res a veure.","Afecta els arts. 17.2 i 18.2 i 18.3.","Això seria l'art. 155."],"clau":"Suspensió general només en excepció i setge; suspensió individual només per terrorisme.","ref":"art. 55.2 CE"},{"id":"Lhgce4gd","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"calcul","q":"Com s'estructura l'Estatut d'autonomia de Catalunya de 2006?","op":["Deu títols i 169 articles","Un títol preliminar i set títols, amb 223 articles","Un títol únic de 223 articles","Cinc títols i 150 articles"],"c":1,"ex":["És l'estructura de la Constitució.","Drets, institucions, poder judicial, competències, relacions, finançament i reforma.","Els 223 articles es reparteixen en set títols, no en un de sol.","L'Estatut té 223 articles i set títols més el preliminar."],"clau":"EAC: preliminar + 7 títols, 223 articles.","ref":""},{"id":"Lhyhf6hd","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"calcul","q":"En quina data es va ratificar en referèndum l'Estatut de 2006?","op":["El 18 de juny de 2006","L'11 de setembre de 2006","El 19 de juliol de 2006","El 28 de juny de 2010"],"c":0,"ex":["L'aprovació com a LO 6/2006 va ser el 19 de juliol.","L'Onze de Setembre és la Diada; el referèndum va ser al juny.","És la data de la llei orgànica.","És la data de la STC 31/2010."],"clau":"Referèndum 18-6-2006; LO 19-7-2006; STC 31/2010.","ref":"LO 6/2006"},{"id":"Lhkniwop","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Qui integra la Generalitat segons l'art. 2.2 EAC?","op":["El Govern, els ajuntaments i les diputacions","El president, el TSJC i el Síndic","El Parlament i el Govern exclusivament","El Parlament, la Presidència de la Generalitat, el Govern i les altres institucions del capítol V del títol II"],"c":3,"ex":["Els ens locals integren el sistema institucional (art. 2.3), però no són aquesta llista.","El TSJC forma part del poder judicial.","Falten la Presidència i altres institucions.","Art. 2.2 EAC."],"clau":"Generalitat: Parlament, Presidència, Govern i altres institucions.","ref":"art. 2.2 EAC"},{"id":"Lhruaq0l","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quina funció té el Consell de Garanties Estatutàries (art. 76 EAC)?","op":["Fiscalitzar els comptes del sector públic","Assessorar el Govern en matèria jurídica","Vetllar per l'adequació de les disposicions de la Generalitat a l'Estatut i a la Constitució","Jutjar els recursos contra les lleis catalanes"],"c":2,"ex":["És la Sindicatura de Comptes.","És la Comissió Jurídica Assessora.","Vetlla per l'adequació a l'Estatut i a la Constitució; des de la STC 31/2010 els seus dictàmens no són vinculants.","Això correspon al Tribunal Constitucional."],"clau":"CGE: guardià de l'Estatut abans que la llei s'aprovi.","ref":"art. 76 EAC"},{"id":"Lh17wzoci","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Segons l'art. 164.1 EAC, correspon a la Generalitat, en el marc de la legislació estatal:","op":["El control de fronteres","La planificació i regulació del sistema de seguretat pública de Catalunya i l'ordenació de les policies locals","La competència exclusiva sobre armes i explosius","La direcció de la Guàrdia Civil a Catalunya"],"c":1,"ex":["És competència estatal.","També la creació i l'organització de la Policia de la Generalitat.","És competència estatal.","La Guàrdia Civil depèn de l'Estat; la Generalitat només hi coordina actuacions a la Junta de Seguretat."],"clau":"La Generalitat planifica i regula el sistema de seguretat i té el comandament suprem dels Mossos.","ref":"art. 164.1 EAC"},{"id":"Lh1uusgt6","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"A qui correspon el comandament suprem de la Policia de la Generalitat-Mossos d'Esquadra segons l'art. 164.2 EAC?","op":["El ministre de l'Interior","El delegat del Govern de l'Estat","A la Generalitat","El Parlament de Catalunya"],"c":2,"ex":["El ministre de l'Interior no comanda la policia autonòmica.","El delegat del Govern de l'Estat no té comandament sobre els Mossos.","El comandament superior l'exerceix el conseller competent en seguretat pública (Llei 4/2003).","No té funcions de comandament."],"clau":"Suprem: Govern. Superior: conseller.","ref":"art. 164.2 EAC"},{"id":"Lh1hyifr","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"En les competències exclusives (art. 110 EAC), la Generalitat exerceix:","op":["La legislació de desplegament de les bases estatals","La potestat reglamentària d'execució","De manera íntegra la potestat legislativa, la reglamentària i la funció executiva","Només la funció executiva"],"c":2,"ex":["És una competència compartida (art. 111).","Pròpia de les executives.","Sense bases estatals.","Això és una competència executiva (art. 112)."],"clau":"Exclusiva: tot. Compartida: sobre bases. Executiva: només executar.","ref":"art. 110 EAC"},{"id":"Lh1vbmrh7","b":"1","t":"1.2","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"termini","q":"Quants diputats pot tenir el Parlament de Catalunya segons l'art. 56.2 EAC?","op":["Exactament 135 per mandat estatutari","Entre 50 i 100","Entre 100 i 150","Entre 150 i 200"],"c":2,"ex":["El nombre concret el fixa la normativa electoral.","El mínim estatutari és de 100 diputats.","Actualment en són 135.","El màxim estatutari és de 150 diputats."],"clau":"Estatut: 100 a 150. Realitat: 135.","ref":"art. 56.2 EAC"},{"id":"Lh1n0ul7n","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quins principis d'organització de l'Administració enumera l'art. 103.1 CE?","op":["Unitat, dependència jeràrquica, legalitat i imparcialitat","Prevenció, proximitat i coresponsabilitat","Eficàcia, jerarquia, descentralització, desconcentració i coordinació","Independència, inamovibilitat i responsabilitat"],"c":2,"ex":["Són principis del Ministeri Fiscal.","Són principis de la Llei 4/2003.","Amb submissió plena a la llei i al dret.","Són principis dels jutges."],"clau":"Eficàcia, jerarquia, descentralització, desconcentració i coordinació.","ref":"art. 103.1 CE"},{"id":"Lh1eq0x8y","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quina diferència hi ha entre desconcentració i descentralització?","op":["Són sinònims","La desconcentració trasllada competències a òrgans inferiors de la mateixa administració; la descentralització, a ens amb personalitat pròpia","La desconcentració crea noves administracions","La descentralització només afecta la signatura"],"c":1,"ex":["No ho són.","És la distinció clàssica.","És al revés.","La descentralització trasllada competències a ens amb personalitat pròpia; la signatura no hi té res a veure."],"clau":"Desconcentrar: dins de casa. Descentralitzar: a una altra persona jurídica.","ref":""},{"id":"Lhhz5odg","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Quins òrgans existeixen en tots els ajuntaments segons la Llei de bases de règim local?","op":["Només l'alcalde i el ple","L'alcalde, la junta de govern i el consell comarcal","L'alcalde, els tinents d'alcalde i el ple","El ple i la diputació provincial"],"c":2,"ex":["També els tinents d'alcalde.","El consell comarcal és d'una altra entitat.","La junta de govern local és obligatòria en municipis de més de 5.000 habitants.","La diputació és d'una altra entitat."],"clau":"Sempre: alcalde, tinents i ple. Més de 5.000: junta de govern.","ref":""},{"id":"Lh8scwcj","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Quin és l'alt òrgan consultiu del Govern de la Generalitat (art. 72 EAC)?","op":["El Consell de Garanties Estatutàries","El Consell de Treball, Econòmic i Social","La Sindicatura de Comptes","La Comissió Jurídica Assessora"],"c":3,"ex":["Vetlla per l'adequació a l'Estatut de les normes.","És consultiu en matèria socioeconòmica.","És fiscalitzadora.","Emet dictàmens, per exemple en revisió d'ofici."],"clau":"CJA assessora el Govern; CGE protegeix l'Estatut.","ref":"art. 72 EAC"},{"id":"Lh1bm95cr","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Què és un consorci segons l'art. 118 LRJSP?","op":["Una societat mercantil de capital privat","Un conveni entre administracions","Una entitat de dret públic amb personalitat pròpia creada per diverses administracions per a activitats d'interès comú","Un òrgan col·legiat sense personalitat"],"c":2,"ex":["El consorci és una entitat de dret públic; el capital privat és propi de les societats mercantils.","El conveni és un acord, no una entitat.","Pot incloure entitats privades sense ànim de lucre.","Té personalitat jurídica."],"clau":"Consorci: diverses administracions, una entitat.","ref":"art. 118 LRJSP"},{"id":"Lh7yldg9","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Què caracteritza el principi de jerarquia?","op":["Els òrgans inferiors poden anul·lar els actes dels superiors","Els òrgans superiors dirigeixen i controlen els inferiors, que els deuen obediència dins de la legalitat","Tots els òrgans tenen el mateix rang","Només s'aplica entre administracions diferents"],"c":1,"ex":["És al revés.","Permet donar instruccions i ordres de servei.","La jerarquia implica precisament rangs diferents, amb superiors i inferiors.","S'aplica dins d'una mateixa administració."],"clau":"Jerarquia: dins de la mateixa administració i de dalt a baix.","ref":""},{"id":"Lh1yipss2","b":"1","t":"1.3","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Què són les instruccions i ordres de servei (art. 6 LRJSP)?","op":["Reglaments amb eficàcia externa","Actes que s'han de publicar sempre al BOE","Mitjans amb què els òrgans dirigeixen l'activitat dels seus òrgans jeràrquicament dependents","Contractes entre òrgans"],"c":2,"ex":["Són de caràcter intern.","Només quan ho exigeix una norma o convé per als destinataris.","El seu incompliment no afecta per si sol la validesa dels actes.","No són negocis jurídics entre òrgans, sinó directrius internes de direcció."],"clau":"Instruccions: ordres internes, no normes.","ref":"art. 6 LRJSP"},{"id":"Lh13zrsq0","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"composicio","q":"Quants estats membres té la Unió Europea?","op":["28","25","30","27"],"c":3,"ex":["Eren 28 abans del Brexit.","Eren 25 el 2004.","La Unió no ha arribat mai als trenta membres.","Des de la sortida del Regne Unit el 31 de gener de 2020."],"clau":"27 des del Brexit (2020).","ref":""},{"id":"Lh1rirwtr","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Com s'elegeixen els membres del Parlament Europeu?","op":["Per sufragi universal directe cada cinc anys","Els nomena la Comissió","Els designen els parlaments nacionals","Els nomena el Consell Europeu"],"c":0,"ex":["Art. 14.3 TUE.","La Comissió no nomena els diputats; és el Parlament qui elegeix el president de la Comissió.","Era així abans de 1979.","El Consell Europeu no nomena diputats; el Parlament és l'única institució elegida directament."],"clau":"Eleccions europees: directes, cada cinc anys.","ref":"Art. 14.3 TUE"},{"id":"Lh1mhd5nh","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Qui forma el Consell Europeu?","op":["Els caps d'Estat o de Govern dels estats membres, el seu president i el president de la Comissió","Els diputats europeus","Un ministre de cada Estat","Un comissari de cada Estat"],"c":0,"ex":["Art. 15.2 TUE.","És el Parlament Europeu.","És el Consell de la UE.","És la Comissió."],"clau":"Consell Europeu = cimeres de líders.","ref":"Art. 15.2 TUE"},{"id":"Lhhb0sqw","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Com s'adopta la majoria qualificada al Consell de la UE amb caràcter general?","op":["Amb la unanimitat","Amb dos terços dels estats","Amb el 55% dels estats membres que representin almenys el 65% de la població","Amb la majoria simple dels estats"],"c":2,"ex":["Només en matèries determinades.","Els dos terços no són cap regla de votació del Consell.","És la doble majoria del Tractat de Lisboa.","La majoria simple només s'usa en qüestions de procediment."],"clau":"Doble majoria: 55% estats, 65% població.","ref":""},{"id":"Lhx354i7","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"calcul","q":"Quina sentència del TJUE va consagrar el principi de primacia del dret comunitari?","op":["Van Gend en Loos (1963)","Costa contra ENEL (1964)","Francovich (1991)","Cassis de Dijon (1979)"],"c":1,"ex":["Va consagrar l'efecte directe.","El dret comunitari preval sobre el dret intern.","Va establir la responsabilitat dels estats per incompliment.","Va desenvolupar el reconeixement mutu de mercaderies."],"clau":"Van Gend en Loos efecte directe; Costa/ENEL primacia.","ref":""},{"id":"Lh9w8pwh","b":"1","t":"1.4","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Què estableix el principi de subsidiarietat (art. 5.3 TUE)?","op":["La Unió sempre té preferència sobre els estats","La Unió només pot actuar per unanimitat","La Unió intervé només si els objectius no els poden assolir de manera suficient els estats membres","Els estats poden deixar d'aplicar el dret de la UE"],"c":2,"ex":["Fora de les competències exclusives, la Unió ha de justificar que actua millor que els Estats; no té preferència incondicional.","La unanimitat és una regla de votació excepcional, no un principi general.","S'aplica fora de les competències exclusives de la Unió.","Els Estats no poden inaplicar ges accedeixen per oposició, no per elecció popular."],"clau":"Jutges: I, I, R + imperi de la llei.","ref":"art. 117.1 CE"},{"id":"Lhireqx","b":"1","t":"1.5","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Què prohibeix l'art. 127.1 CE als jutges, magistrats i fiscals en actiu?","op":["Pertànyer a partits polítics o sindicats","Publicar obres jurídiques","Formar associacions professionals","Votar a les eleccions"],"c":0,"ex":["Poden formar associacions professionals.","Publicar obres jurídiques és una activitat compatible amb la funció judicial.","Sí que poden.","No ho prohibeix."],"clau":"Jutges: associacions sí, partits i sindicats no.","ref":"art. 127.1 CE"},{"id":"Lha8w7py","b":"1","t":"1.5","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quins ordres jurisdiccionals integren la jurisdicció ordinària?","op":["Penal, administratiu i militar exclusivament","Civil, penal, contenciós administratiu i social","Civil, penal, constitucional i social","Civil, mercantil i laboral exclusivament"],"c":1,"ex":["L'ordre militar no forma part de la jurisdicció ordinària, i hi falten el civil i el social.","La jurisdicció militar és especial.","El TC no forma part del poder judicial.","El mercantil s'integra en el civil."],"clau":"Quatre ordres: civil, penal, contenciós i social.","ref":""},{"id":"Lh1pjyuvk","b":"1","t":"1.5","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Amb la LO 1/2025, d'eficiència del servei públic de justícia, quins òrgans substitueixen els jutjats unipersonals?","op":["Les audiències provincials","Els jutjats de pau","Les sales del TSJ","Els tribunals d'instància"],"c":3,"ex":["Continuen existint com a òrgans de segona instància.","Són substituïts per oficines de justícia al municipi.","Les sales dels TSJ són òrgans de segona instància i cassació autonòmica; no substitueixen els jutjats.","S'hi integren els antics jutjats com a seccions."],"clau":"LO 1/2025: tribunals d'instància.","ref":"LO 1/2025"},{"id":"Lh7h94g3","b":"1","t":"1.5","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"organ","q":"Qui presideix el Consell General del Poder Judicial?","op":["El ministre de Justícia","El president del Tribunal Suprem","El president del Tribunal Constitucional","El vocal de més edat"],"c":1,"ex":["No forma part del CGPJ.","Art. 123.2 CE.","El Tribunal Constitucional és fora del poder judicial; el seu president no presideix el CGPJ.","L'edat no dona la presidència; la té el president del Suprem."],"clau":"Un sol president per al TS i el CGPJ.","ref":"Art. 123.2 CE"},{"id":"Lh5jqmrw","b":"1","t":"1.5","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quina és l'extensió territorial de l'Audiència Nacional?","op":["Només la Comunitat de Madrid","Cada comunitat autònoma","Les capitals de província","Tot l'Estat, amb seu a Madrid"],"c":3,"ex":["L'Audiència Nacional no és un tribunal territorial de Madrid, tot i tenir-hi la seu.","Els tribunals de cada comunitat són els superiors de justícia.","A les capitals de província hi ha les audiències provincials.","Coneix, entre d'altres, de delictes de terrorisme i crim organitzat."],"clau":"Audiència Nacional: tot l'Estat.","ref":""},{"id":"Lh1urukm3","b":"1","t":"1.6","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quines lleis són orgàniques segons l'art. 81.1 CE?","op":["Les de desenvolupament dels drets fonamentals i les llibertats públiques, les que aproven els estatuts, el règim electoral general i les altres previstes","Totes les que regulen drets del títol I","Les lleis de pressupostos","Les lleis autonòmiques"],"c":0,"ex":["Requereixen majoria absoluta del Congrés.","Només les de desenvolupament dels drets fonamentals.","No són orgàniques.","Les CA no fan lleis orgàniques."],"clau":"Orgàniques: drets fonamentals, estatuts, electoral i les previstes.","ref":"art. 81.1 CE"},{"id":"Lh1ob06m3","b":"1","t":"1.6","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Què no pot fer una llei de bases segons l'art. 83 CE?","op":["Fixar un termini d'exercici","Delegar en el Govern","Fixar principis i criteris","Autoritzar la modificació de la mateixa llei de bases ni facultar per dictar normes amb caràcter retroactiu"],"c":3,"ex":["Ha de fixar-lo.","És la seva funció.","És precisament el seu contingut.","Són els límits de la delegació."],"clau":"Llei de bases: sense automodificació ni retroactivitat.","ref":"art. 83 CE"},{"id":"Lhli0vod","b":"1","t":"1.6","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"requisit","q":"Com ha de ser la delegació legislativa segons l'art. 82.3 CE?","op":["General per a qualsevol matèria","Sempre en favor del Consell d'Estat","Tàcita i indefinida","Expressa, per a matèria concreta i amb fixació del termini d'exercici"],"c":3,"ex":["Ha de referir-se a una matèria concreta; no es pot delegar en blanc.","És en favor del Govern.","La delegació ha de ser expressa i amb termini; una delegació tàcita o indefinida no val.","S'esgota amb l'ús que en fa el Govern."],"clau":"Delegació: expressa, concreta i amb termini.","ref":"art. 82.3 CE"},{"id":"Lh1j0y0eo","b":"1","t":"1.6","o":"propia","src":"pròpia, bateria anterior (revisada setembre 2026)","k":"teoria","tr":"concepte","q":"Quin termini té el Senat per oposar el seu veto o introduir esmenes a un projecte de llei ordinari?","op":["Un mes","Quinze dies","Tres mesos","Dos mesos"],"c":3,"ex":["Un mes no és el termini ordinari del Senat.","Quinze dies no és cap termini del procediment; el d'urgència és de vint dies.","El termini ordinari és de dos mesos.","Art. 90.2 CE; vint dies naturals si és urgent."],"clau":"Senat: dos mesos, o vint dies si és urgent.","ref":"Art. /* ---------- registre de respostes ---------- */
function record(q,ok,conf,mode){
  const s=st(q.id);const t=today();s.n++;ok?s.ok++:s.ko++;s.last=ok?1:0;s.lc=conf||'';s.ld=t;
  s.h.push([t,ok?1:0,conf||'',mode]);if(s.h.length>40)s.h.shift();
  if(mode==='sim'||mode==='real'){if(!ok){s.box=0;s.due=t+1;}}
  else{
    if(ok&&(!S.cfg.conf||conf==='segur')){s.box=Math.min(5,s.box+1);s.due=t+INT[s.box];}
    else if(ok&&conf==='dubte'){s.box=Math.max(1,s.box);s.due=t+1;}
    else{s.box=0;s.due=t+1;}
  }
  save();
}

/* ---------- seleccions ---------- */
function dueIds(){const t=today();return QS.filter(q=>{const s=S.p[q.id];return s&&s.n>0&&s.due<=t;}).map(q=>q.id);}
function inFocus(q){const f=S.cfg.focus||'all';if(f==='all')return true;if(f==='C')return q.b!=='E'&&q.b!=='A';return q.b===f;}
function newIds(n){const per={};QS.forEach(q=>{if(!seen(q.id)&&inFocus(q)){(per[q.t]=per[q.t]||[]).push(q.id);}});const keys=shuffle(Object.keys(per));keys.forEach(k=>shuffle(per[k]));const out=[];let guard=0;while(out.length<n&&guard<5000){let any=false;for(const k of keys){if(per[k].length){out.push(per[k].shift());any=true;if(out.length>=n)break;}}if(!any)break;guard++;}return out;}
function sessioIds(){const due=shuffle(dueIds()).slice(0,S.cfg.maxDue);const nou=newIds(S.cfg.nou);return due.concat(nou);}
function errorIds(){return QS.filter(q=>{const s=S.p[q.id];return s&&s.n>0&&s.last===0;}).map(q=>q.id);}
function infinitBatch(excl,n){const ex=new Set(excl||[]);const t=today();const tier=[[],[],[],[]];QS.forEach(q=>{if(ex.has(q.id))return;const s=S.p[q.id];const foc=inFocus(q);if(s&&s.n>0&&s.due<=t)tier[0].push(q.id);else if(!s||s.n===0){if(foc)tier[1].push(q.id);}else if(s.box<3&&foc)tier[2].push(q.id);else tier[3].push(q.id);});let out=[];tier.forEach(x=>{if(out.length<n)out=out.concat(shuffle(x).slice(0,n-out.length));});return out;}

/* ---------- vistes ---------- */
let VIEW='home',P={},RUN=null,TIMER=null;
const V={};
function go(v,p){VIEW=v;P=p||{};if(TIMER&&v!=='sim'){clearInterval(TIMER);TIMER=null;}render();window.scrollTo(0,0);}
function render(){const h=V[VIEW]?V[VIEW]():'<div class="card">Vista desconeguda</div>';$('#view').innerHTML=h;$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===VIEW||(VIEW==='home'&&b.dataset.nav==='home')));if(V[VIEW+'_after'])V[VIEW+'_after']();}
function setHdr(t){$('#hdr').textContent=t;}

/* Inici */
