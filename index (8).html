27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":80,"k":"cas","tr":"efecte","q":"En data 11 de maig de 2026, l'òrgan competent del Departament d'Empresa i Treball ha resolt incoar un expedient disciplinari al senyor Jofre Carandell, funcionari interí del cos administratiu, escala administrativa, per la presumpta comissió d'una falta disciplinària de caràcter molt greu. La presumpta falta es va cometre l'1 de gener de 2026. Mentre s'està tramitant aquest expedient, i en data 30 de maig de 2026, finalitza el nomenament de personal interí del senyor Carandell, que era un nomenament per acumulació de tasques. D'acord amb el Reglament de règim disciplinari de la funció pública de l'Administració de la Generalitat de Catalunya, què cal fer?","op":["S'ha de continuar amb la tramitació de l'expedient disciplinari perquè es tracta d'una falta molt greu tipificada al text refós de la Llei de l'Estatut bàsic de l'empleat públic, i aquest preveu que sempre s'ha de determinar la responsabilitat que es derivi d'aquest tipus de faltes.","S'ha de continuar amb la tramitació de l'expedient disciplinari, perquè la falta disciplinària no ha prescrit i, per tant, no es pot considerar extingida la responsabilitat disciplinària. Només es podrà suspendre, si escau, l'execució de la sanció que s'imposi.","S'ha de dictar resolució en què es declararà extingit el procediment disciplinari i s'ordenarà l'arxiu de les actuacions, llevat que per la part interessada insti la continuació de l'expedient.","L'instructor o instructora de l'expedient disciplinari ha d'emetre una diligència per arxivar l'expedient disciplinari. Ens trobem davant d'una causa d'extinció de la responsabilitat disciplinària ex lege i, per tant, no és necessari dictar resolució expressa d'arxiu."],"c":2,"ex":["La pèrdua de la condició extingeix la responsabilitat disciplinària.","Es tracta d'una causa d'extinció, no de prescripció.","La pèrdua de la condició de funcionari extingeix la responsabilitat: resolució que declara extingit el procediment i arxiu, llevat que l'interessat demani continuar.","Cal resolució expressa, no una simple diligència."],"clau":"Cessa l'interí: expedient extingit per resolució, tret que ell demani continuar.","ref":"Reglament de règim disciplinari (Decret 243/1995); art. 63 TREBEP"},{"id":"R871E-081","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 81","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":81,"k":"cas","tr":"encreuament","q":"La Clara Homs és funcionària del cos de gestió d'administració de la Generalitat de Catalunya i va ingressar a aquesta administració en data 19 de març de 2024, prenent possessió d'un lloc de treball al Departament de Cultura, com a primera destinació. Anteriorment, i des de l'1 de desembre de 2021 fins al 18 de març de 2024, havia prestat serveis com a tècnica de promoció turística, amb vinculació de funcionària interina, en un ajuntament. En data 27 d'abril de 2026, adreça una consulta al Servei de Recursos Humans sobre la possibilitat de sol·licitar una excedència voluntària per interès particular amb efectes des del dia 1 de juny de 2026. També demana que se l'informi sobre quin període mínim de temps haurà d'estar en situació d'excedència, si se li concedeix, i sobre si se li reservarà el lloc de treball que actualment ocupa. Quina resposta ha de donar el Servei de Recursos Humans?","op":["No se li pot concedir l'excedència voluntària per interès particular amb efectes de la data que sol·licita, perquè encara no ha complert el període mínim de serveis prestats de manera continuada establert per la normativa vigent. Quan compleixi aquest període mínim, se li podrà concedir l'excedència voluntària per interès particular, però aquesta concessió està supeditada a les necessitats del servei. Si se li concedeix, haurà d'estar en aquesta situació durant un període mínim de 2 anys i no tindrà reserva de lloc de treball.","Sí, se li pot concedir l'excedència voluntària per interès particular amb efectes de la data que sol·licita, perquè haurà complert el període mínim de serveis prestats. La concessió d'aquesta excedència no està supeditada a les necessitats del servei. Haurà d'estar en aquesta situació durant un període mínim de 2 anys i no tindrà reserva de lloc de treball.","Sí, se li pot concedir l'excedència voluntària per interès particular amb efectes de la data que sol·licita, perquè haurà complert el període mínim de serveis prestats. No obstant això, la concessió està supeditada a les necessitats del servei. Si se li concedeix, haurà d'estar en aquesta situació durant un període mínim de 2 anys i no tindrà reserva de lloc de treball.","No se li pot concedir l'excedència voluntària per interès particular amb efectes de la data que sol·licita, perquè encara no ha complert el període mínim de serveis prestats de manera continuada establert per la normativa vigent. Quan compleixi aquest període mínim, se li haurà de concedir l'excedència voluntària per interès particular si la sol·licita, perquè aquesta concessió no està supeditada a les necessitats del servei. Haurà d'estar en aquesta situació durant un període mínim d'un any i no tindrà reserva de lloc de treball."],"c":0,"ex":["Cal cinc anys de serveis efectius immediatament anteriors (a Catalunya), i l'1 de juny de 2026 no hi arriba; la concessió es subordina a les necessitats del servei, dura un mínim de dos anys i no reserva lloc.","No ha complert el període mínim i la concessió sí que depèn del servei.","No ha complert el període mínim de serveis.","La concessió depèn de les necessitats del servei i el mínim són dos anys."],"clau":"Interès particular: 5 anys de serveis, subjecta al servei, 2 anys mínim, sense reserva.","ref":"art. 86 Decret legislatiu 1/1997"},{"id":"R871E-082","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 82","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":82,"k":"cas","tr":"encreuament","q":"El Xavier Bosch és funcionari de carrera del cos de titulació superior, escala d'arquitectura (grup A, subgrup A1), de la Generalitat de Catalunya, amb destinació definitiva a un lloc base del seu cos i escala al Departament de Cultura. En data 16 de juny de 2026, és nomenat, mitjançant un procediment de lliure designació, subdirector general d'Arquitectura i Edificació a una direcció general del Ministeri de Foment de l'Administració General de l'Estat, i pren possessió d'aquest lloc de treball l'endemà. D'acord amb la regulació sobre situacions administratives continguda al Text únic de la Llei de la funció pública de l'Administració de la Generalitat de Catalunya, en quina situació administrativa queda el senyor Bosch a l'Administració de la Generalitat de Catalunya? Té reserva de plaça i destinació?","op":["Queda en la situació de serveis especials i té dret a la reserva de plaça i destinació.","Queda en la situació de serveis en altres administracions públiques sense reserva de plaça i destinació.","Queda en la situació d'excedència voluntària per incompatibilitats i no té dret a la reserva de plaça i destinació.","Queda en la situació de serveis en altres administracions públiques amb reserva de plaça i destinació."],"c":1,"ex":["Un lloc de subdirector general no és càrrec dels que donen serveis especials.","Ocupar un lloc en una altra administració (per lliure designació) és serveis en altres administracions, sense reserva.","No és l'excedència per incompatibilitats.","La situació no comporta reserva de plaça."],"clau":"Lloc en una altra administració: serveis en altres administracions, sense reserva.","ref":"Decret legislatiu 1/1997; art. 88 TREBEP"},{"id":"R871E-083","b":"5","t":"5.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 83","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":83,"k":"cas","tr":"concepte","q":"El senyor Pere Bartolí és contractat laboral indefinit del Departament de Justícia i Qualitat Democràtica, amb la categoria D1, oficial de 1a de manteniment. Un dels complements que percep a la seva nòmina mensual retribueix la preparació i capacitació professional com a retribució bàsica. Com s'anomena aquest complement?","op":["Complement de comandament","Complement de conveni","Complement transversal de lloc de treball","Complement de grup"],"c":3,"ex":["Retribueix funcions de comandament.","No és una retribució bàsica.","És complementari, lligat al lloc.","En el conveni únic, el complement de grup és retribució bàsica i retribueix la preparació i capacitació professional."],"clau":"Conveni únic: sou base i complement de grup són bàsics.","ref":"VI Conveni col·lectiu únic (retribucions)"},{"id":"R871E-084","b":"5","t":"5.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 84","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":84,"k":"cas","tr":"termini","q":"La Marta Muñoz és funcionària interina del cos auxiliar d'administració i presta serveis a un organisme autònom adscrit al Departament de Cultura, amb seu a Barcelona. El director d'aquest organisme li ordena la realització d'una comesa especial de caràcter circumstancial, que s'ha de dur a terme a la localitat de Tarragona entre els dies 11 i 14 de maig de 2026, ambdós inclosos. Un cop realitzada aquesta comesa, i d'acord amb el que estableix el Decret 138/2008, de 8 de juliol, d'indemnitzacions per raó del servei, de quin termini disposa la senyora Muñoz per presentar davant l'òrgan competent la liquidació de les despeses derivades d'aquesta, perquè no s'entengui que renuncia a la percepció de les indemnitzacions corresponents?","op":["1 mes","2 mesos","3 mesos","6 mesos"],"c":3,"ex":["No és el termini del Decret.","No és el termini del Decret.","No és el termini del Decret.","Sis mesos des de l'acabament de la comissió per liquidar; si no, s'entén que hi renuncia."],"clau":"Liquidar dietes: 6 mesos o renúncia.","ref":"Decret 138/2008 (liquidació de les indemnitzacions)"},{"id":"R871E-085","b":"5","t":"5.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 85","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":85,"k":"cas","tr":"termini","q":"El Departament d'Interior i Seguretat Pública vol nomenar 3 tècnics/tècniques superiors per fer front a una situació d'acumulació de tasques relacionada amb la gestió de sancions administratives imposades en l'àmbit de la seguretat ciutadana. Quina és la durada màxima que podran tenir aquests nomenaments, d'acord amb el que estableix el Text refós de la Llei de l'Estatut bàsic de l'empleat públic, aprovat pel Reial decret legislatiu 5/2015, de 30 d'octubre (TREBEP)?","op":["6 mesos, dins d'un període de 12 mesos.","3 mesos, dins d'un període de 6 mesos.","9 mesos, dins d'un període de 18 mesos.","12 mesos, dins d'un període de 2 anys."],"c":2,"ex":["Era el límit anterior a la reforma de 2021.","No és el límit legal.","Excés o acumulació de tasques: nou mesos dins d'un període de divuit.","No és el límit legal."],"clau":"Acumulació de tasques: 9 dins de 18.","ref":"art. 10.1.d TREBEP"},{"id":"R871E-086","b":"5","t":"5.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 86","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":86,"k":"cas","tr":"encreuament","q":"Una societat mercantil del sector públic, amb la forma de societat anònima i participada íntegrament per la Generalitat, ha de contractar un nou conseller delegat, perquè l'actual es jubila. D'acord amb la regulació sobre personal directiu del sector públic de la Generalitat de Catalunya, continguda a la disposició addicional vint-i-unena de la Llei 2/2014, del 27 de gener, de mesures fiscals, administratives, financeres i del sector públic, quin tipus de vinculació amb aquesta societat podrà tenir la persona contractada com a consellera delegada?","op":["Un contracte laboral especial d'alta direcció, en qualsevol cas.","Un contracte laboral especial d'alta direcció o, en cas que els estatuts de la societat ho prevegin, un contracte laboral ordinari.","Un contracte laboral especial d'alta direcció o, en cas que els estatuts de la societat ho prevegin, una vinculació administrativa com a personal eventual.","Un contracte laboral especial d'alta direcció o, en cas que els estatuts de la societat ho prevegin, un contracte mercantil."],"c":3,"ex":["No és l'única possibilitat.","No és laboral ordinari.","No és personal eventual.","Alta direcció o, si els estatuts ho preveuen, contracte mercantil."],"clau":"Directius de societats públiques: alta direcció o mercantil si els estatuts ho diuen.","ref":"DA 21a Llei 2/2014"},{"id":"R871E-088","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 88","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":88,"k":"cas","tr":"calcul","q":"La Montserrat Cucurella és funcionària del cos superior d'administració, amb destinació definitiva des de l'any 2010 en un lloc de treball dels Serveis Territorials de Girona del Departament de la Presidència. En les darreres eleccions sindicals del personal funcionari de l'Administració de la Generalitat, celebrades l'any 2023, la senyora Cucurella va ser escollida delegada de personal de la Junta de Personal dels Serveis Territorials a Girona, que constitueixen una unitat electoral amb un cens de 1.200 persones. D'acord amb el que estableix l'article 41 del Text refós de la Llei de l'Estatut bàsic de l'empleat públic, aprovat pel Reial decret legislatiu 5/2015, de 30 d'octubre (TREBEP), de quin crèdit d'hores mensuals, dins de la jornada de treball i retribuïdes com a treball efectiu disposarà la senyora Cucurella per a l'exercici de la seva funció representativa?","op":["40 hores","21 hores","30 hores","20 hores"],"c":0,"ex":["A partir de 751 funcionaris, 40 hores mensuals.","No és cap tram legal.","30 hores és el tram de 251 a 500.","20 hores és el tram de 101 a 250."],"clau":"Crèdit horari: 15, 20, 30, 35 i 40 hores segons el cens.","ref":"art. 41.1.d TREBEP"},{"id":"R871E-089","b":"6","t":"6.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 89","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":89,"k":"cas","tr":"concepte","q":"Heu de redactar un informe relatiu a l'adopció de polítiques, en especial fiscals, salarials i de protecció social, per aconseguir progressivament una major igualtat, i el vostre cap us ha dit que tingueu en compte l'Agenda 2030 a l'hora de redactar-lo. A quin objectiu de desenvolupament sostenible (ODS) heu de fer referència?","op":["ODS 8, promoure el creixement econòmic sostingut, inclusiu i sostenible, l'ocupació plena i productiva i el treball digne per a tothom.","ODS 1, erradicar la pobresa a tot el món i en totes les seves formes.","ODS 5, aconseguir la igualtat de gènere i apoderar totes les dones i nenes.","ODS 10, reduir la desigualtat en i entre els països."],"c":3,"ex":["L'ODS 8 és treball i creixement.","L'ODS 1 és pobresa.","L'ODS 5 és igualtat de gènere.","L'ODS 10 inclou la fita 10.4: polítiques fiscals, salarials i de protecció social per a més igualtat."],"clau":"Fiscal, salarial i protecció social per a la igualtat: ODS 10.","ref":"Agenda 2030, fita 10.4"},{"id":"R871E-090","b":"5","t":"5.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 90","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":90,"k":"cas","tr":"concepte","q":"Treballeu al Servei d'Organització del Departament de Cultura i la vostra cap us ha demanat que li faciliteu la relació de llocs de treball del Departament de la Presidència. Podeu tenir accés a aquesta relació de llocs de treball?","op":["Sí, sempre que la demani al Departament de la Presidència.","Sí, perquè és pública.","No, perquè només es pot disposar de la relació de llocs de treball del seu Departament.","Sí, però us l'ha de facilitar la Direcció General de Funció Pública."],"c":1,"ex":["No cal demanar-la.","Les relacions de llocs de treball són públiques.","És pública per a tothom.","No cal cap intermediari."],"clau":"La RLT és pública.","ref":"art. 74 TREBEP; Decret legislatiu 1/1997"},{"id":"R871E-092","b":"5","t":"5.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 92","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":92,"k":"cas","tr":"quantia","q":"Heu de preparar l'oferta d'ocupació pública de 2027 i us heu d'assegurar que, d'acord amb el TREBEP, es garanteixi l'accés a la funció pública de les persones amb discapacitat que tinguin reconeguda aquesta condició legal. Quin percentatge cal reservar a aquest efecte?","op":["El 2 %","No inferior al 7 %","El 3 %","No inferior al 5 %"],"c":1,"ex":["No és el percentatge legal.","Reserva no inferior al 7 % de les vacants (2 % per a discapacitat intel·lectual).","No és el percentatge legal.","Era el percentatge anterior a 2011."],"clau":"Discapacitat a l'OOP: mínim 7 %.","ref":"art. 59 TREBEP"},{"id":"R871E-093","b":"5","t":"5.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 93","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":93,"k":"cas","tr":"concepte","q":"Participeu en la revisió de sol·licituds d'un procés selectiu de la Generalitat. Us trobeu amb una persona ciutadana d'un Estat membre de la Unió Europea i heu de revisar el compliment del coneixement de les llengües oficials. On podeu consultar la indicació dels mitjans d'acreditació requerits per aquest procés selectiu?","op":["A la convocatòria del procés selectiu corresponent.","A l'oferta d'ocupació pública de la qual derivi el procés selectiu.","Al Decret 28/1986, de 30 de gener, de Reglament de selecció de personal de l'Administració de la Generalitat de Catalunya.","Al Decret llei 1/1997, de 31 d'octubre, pel qual s'aprova la refosa en un Text únic dels preceptes de determinats textos legals vigents a Catalunya en matèria de funció pública."],"c":0,"ex":["Els mitjans d'acreditació concrets els fixa cada convocatòria.","L'oferta no detalla mitjans d'acreditació.","El reglament no fixa els mitjans concrets.","La llei no fixa els mitjans concrets."],"clau":"Requisits i com acreditar-los: a la convocatòria.","ref":"Bases de les convocatòries; Decret 28/1986"},{"id":"R871E-094","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 94","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":94,"k":"cas","tr":"termini","q":"Una persona us escriu a la bústia de recursos humans i comenta que es troba en situació de baixa per incapacitat temporal, la qual li impedeix gaudir de les vacances durant l'any natural. Us pregunta si les podrà gaudir més endavant i, en cas afirmatiu, quan. Què li respondríeu?","op":["Que les vacances es consideren perdudes i no es poden gaudir posteriorment.","Que es podran gaudir en qualsevol moment dins dels 12 mesos següents a l'any en què s'hagin originat.","Que es podran gaudir en el moment de la reincorporació de la baixa, sempre que no hagin transcorregut més de 12 mesos a partir del final de l'any en què s'hagin originat.","Que es podran gaudir en el moment de la reincorporació de la baixa, sempre que no hagin transcorregut més de 18 mesos a partir del final de l'any en què s'hagin originat."],"c":3,"ex":["No es perden.","No són dotze mesos ni en qualsevol moment.","El límit són divuit mesos.","Es gaudeixen en reincorporar-se, si no han passat més de divuit mesos des del final de l'any."],"clau":"Vacances i IT: divuit mesos després de l'any.","ref":"art. 50 TREBEP"},{"id":"R871E-095","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 95","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":95,"k":"cas","tr":"efecte","q":"Una treballadora està gaudint d'una excedència voluntària per tenir cura d'un fill, que finalitza al febrer de 2027. Mentre està d'excedència, al maig de 2026, té un segon fill. Es posa en contacte amb el Servei de Recursos Humans per consultar si, quan finalitzi l'excedència que està gaudint actualment al febrer de 2027, podrà sol·licitar una segona excedència per 3 anys més. Què li haurien de respondre?","op":["Que es poden acumular dos períodes d'excedència en cas que s'esdevingui una nova causa, i podrà sol·licitar la segona excedència a partir del febrer de 2027.","Que no es poden acumular dos períodes d'excedència en cas que s'esdevingui una nova causa, i no podrà sol·licitar la segona excedència.","Que no es poden acumular dos períodes d'excedència en cas que s'esdevingui una nova causa. Si durant el període d'excedència un nou subjecte causant dona dret a un altre període d'excedència, l'inici d'aquest posa fi al primer; per tant, podrà sol·licitar la nova excedència al maig de 2026.","Que no es poden acumular dos períodes d'excedència en cas que s'esdevingui una nova causa. Si durant el període d'excedència un nou subjecte causant dona dret a un altre període d'excedència, hi ha d'haver, almenys un any entre les excedències; per tant, podrà sol·licitar la nova excedència al febrer de 2028."],"c":2,"ex":["No s'acumulen.","Sí que pot demanar la nova, però des del nou fet causant.","El nou fill obre un nou període que posa fi al primer: des del maig de 2026.","No hi ha cap espera d'un any."],"clau":"Nou fill durant l'excedència: comença un nou període i s'acaba l'anterior.","ref":"art. 89.4 TREBEP; Llei 8/2006"},{"id":"R871E-096","b":"5","t":"5.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 96","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":96,"k":"cas","tr":"termini","q":"Esteu treballant al Servei de Recursos Humans del Departament de Salut i us arriba una consulta d'una persona treballadora que necessita una excedència per tenir cura de la seva sogra, que ha estat operada, que no es pot valer per si mateixa i que no pot exercir cap activitat retribuïda. Quina excedència li pot ser concedida?","op":["Excedència voluntària per agrupació familiar, que es pot sol·licitar per una durada superior a 3 anys i mentre, per raons d'edat, accident, malaltia o discapacitat, la sogra no es pugui valdre per si mateixa i no desenvolupi cap activitat retribuïda.","Excedència voluntària per tenir cura de familiars, per un període mínim de 3 mesos i màxim de 3 anys.","Excedència voluntària per tenir cura de familiars, per un període mínim de 10 dies i màxim de 3 mesos, prorrogable, excepcionalment, fins a 3 mesos més.","Excedència voluntària per tenir cura de familiars, per un període mínim de 6 mesos amb reserva del lloc de treball i màxim de 3 anys."],"c":1,"ex":["L'agrupació familiar és per seguir el cònjuge, no per cuidar.","Cura de familiars fins al segon grau (la sogra és afinitat de primer grau): mínim tres mesos i màxim tres anys.","No són aquests terminis.","El mínim són tres mesos."],"clau":"Cura de familiars: de 3 mesos a 3 anys.","ref":"Llei 8/2006, art. 5"},{"id":"R871E-097","b":"2","t":"2.4","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 97","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":97,"k":"cas","tr":"termini","q":"Sou tècnic superior i treballeu a l'Assessoria Jurídica del Departament de la Presidència. El vostre cap està resolent un procediment i us pregunta quina validesa tenen les inscripcions de representacions. Té dubtes sobre una inscripció realitzada l'1 de desembre de 2022. Què li respondríeu?","op":["No és vàlida. Els apoderaments inscrits tenen una validesa màxima de 3 anys a comptar de la data d'inscripció.","És vàlida. Els apoderaments inscrits tenen una validesa màxima de 4 anys a comptar de la data d'inscripció.","És vàlida. Els apoderaments inscrits tenen una validesa màxima de 5 anys a comptar de la data d'inscripció.","No és valida. Els apoderaments inscrits tenen una validesa màxima de 2 anys a comptar de la data d'inscripció."],"c":2,"ex":["El màxim són cinc anys.","El màxim són cinc anys.","Els apoderaments inscrits al registre electrònic valen com a màxim cinc anys; el de desembre de 2022 encara és vàlid.","El màxim són cinc anys."],"clau":"Apoderament inscrit: 5 anys.","ref":"art. 6.6 LPAC"},{"id":"R871E-098","b":"6","t":"6.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 98","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":98,"k":"cas","tr":"organ","q":"Treballeu en una unitat directiva que presta serveis finalistes i us ha encarregat la tramitació de l'elaboració de la carta de serveis. Un cop ja està elaborada, com s'ha de trametre per a la seva aprovació?","op":["Mitjançant una ordre de la persona titular del departament competent del servei que n'és objecte.","Mitjançant una resolució de la persona titular del departament competent del servei que n'és objecte.","Mitjançant una resolució de la persona titular de l'òrgan o àrea funcional departamental competent en matèria de qualitat dels serveis públics.","Mitjançant una ordre de la persona titular de l'òrgan o àrea funcional departamental competent en matèria de qualitat dels serveis públics."],"c":1,"ex":["No és una ordre.","Les cartes de serveis s'aproven per resolució del titular del departament.","L'aprova el conseller, no l'àrea de qualitat.","No és una ordre ni de l'àrea de qualitat."],"clau":"Carta de serveis: resolució del conseller.","ref":"Normativa de cartes de serveis de la Generalitat"},{"id":"R871E-099","b":"6","t":"6.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 99","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":99,"k":"cas","tr":"concepte","q":"Després d'implementar una carta de serveis, a la Direcció General on treballeu, rebeu propostes d'actuació i suggeriments per part de la ciutadania. Què se n'ha de fer d'aquestes aportacions?","op":["Conservar-les internament com a part de la documentació, sense fer-les públiques, i valorar-les amb els indicadors que hi estan associats.","Donar a conèixer de manera anonimitzada aquestes propostes i suggeriments, i reconèixer i fer públiques les iniciatives que aporten una millora substancial.","Donar accés només a les propostes i suggeriments aprovats per un òrgan intern.","Donar resposta personalment a cada ciutadà o ciutadana, però no publicar-les."],"c":1,"ex":["No es poden amagar.","Es publiquen anonimitzades i es reconeixen les que milloren el servei.","No hi ha aquest filtre.","Cal publicar-les."],"clau":"Suggeriments: publicar-los anonimitzats i reconèixer els bons.","ref":"Llei 19/2014 (cartes de serveis i participació)"},{"id":"R871E-100","b":"6","t":"6.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 100","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":100,"k":"cas","tr":"efecte","q":"Treballeu al Departament de Justícia i Qualitat Democràtica i cal tramitar una consulta popular no referendària que va convocar l'Ajuntament de Gósol el passat 7 de desembre de 2025, on es formulava la pregunta següent: «Esteu d'acord que el municipi de Gósol sol·liciti el canvi de província i s'integri a la província de Barcelona?». Com es defineix el resultat d'aquesta consulta?","op":["Preceptiu","No preceptiu","No vinculant","Vinculant"],"c":2,"ex":["Preceptiu no descriu el resultat.","No preceptiu no descriu el resultat.","El resultat d'una consulta popular no referendària no és vinculant.","Les consultes no referendàries no vinculen."],"clau":"Consulta no referendària: resultat no vinculant.","ref":"Llei 10/2014"},{"id":"R871E-101","b":"6","t":"6.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 101","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":101,"k":"cas","tr":"concepte","q":"Treballeu a l'Assessoria Jurídica del Departament de la Presidència i rebeu una trucada de la senyora Joana Casamajor. Vol saber què valora l'Administració per iniciar un procés participatiu en relació amb una iniciativa normativa. L'informeu que aquest dret es pot exercir amb relació a les iniciatives normatives pertinents:","op":["Quan afecten fins a 50.000 persones.","Per la importància o la matèria que regulen.","Quan afecten més de 50.000 persones.","Quan afecten determinats col·lectius."],"c":1,"ex":["No hi ha llindar de persones.","La participació s'obre en les iniciatives que, per la importància o la matèria, ho justifiquen.","No hi ha llindar de persones.","No és el criteri."],"clau":"Participació en normes: per importància o matèria.","ref":"art. 69 Llei 19/2014"},{"id":"R871E-108","b":"2","t":"2.4","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 108","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":108,"k":"cas","tr":"organ","q":"Treballeu a la Comissió d'Assistència Jurídica Gratuïta i rebeu una impugnació que arriba mitjançant petició genèrica contra una resolució desfavorable a una persona física, a la qual se li denega el dret i que heu de tramitar. Abans de passar la impugnació al Gabinet Jurídic, us adoneu que la persona recurrent no és la mateixa que la persona a qui se li ha denegat el dret. D'acord amb l'article 5.5 de la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques, a qui correspon incorporar a l'expedient administratiu l'acreditació de la condició de representant que consti en el Registre electrònic d'apoderaments?","op":["A l'òrgan competent per tramitar.","A l'òrgan competent per resoldre.","A l'òrgan judicial.","Al vostre superior jeràrquic."],"c":0,"ex":["L'òrgan que tramita incorpora d'ofici l'acreditació del registre d'apoderaments.","No és qui resol.","No hi ha òrgan judicial.","No és una qüestió de jerarquia."],"clau":"Representació inscrita: l'òrgan que tramita la incorpora d'ofici.","ref":"art. 5.5 LPAC"},{"id":"R871E-109","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 109","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":109,"k":"cas","tr":"concepte","q":"El Centre de Telecomunicacions i Tecnologies de la Informació (CTTI), entitat de dret públic de la Generalitat de Catalunya, necessita adquirir un programa d'ordinador antivirus desenvolupat a mida, per subministrar als departaments de la Generalitat. Com a responsable de contractació de l'entitat, com qualificaríeu el contracte?","op":["Contracte de concessió de serveis.","Contracte de subministrament.","Contracte de serveis.","Contracte mixt de subministrament i serveis."],"c":2,"ex":["No hi ha gestió de cap servei públic.","Un programa a mida no és subministrament: només ho és el programari estàndard.","El desenvolupament de programari a mida és un contracte de serveis.","No és mixt."],"clau":"Programari estàndard, subministrament; a mida, serveis.","ref":"art. 16.3.b LCSP"},{"id":"R871E-110","b":"5","t":"5.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871 (part específica del cos superior), 27-06-2026, pregunta 110","exam":"871E","exnom":"Cos superior, opció general (procés 871, 27-06-2026), part específica i pràctica: preguntes que encaixen amb el temari comú","num":110,"k":"cas","tr":"concepte","q":"Avui heu consolidat el grau 24. Quina modalitat de promoció professional s'ha aplicat?","op":["Carrera horitzontal","Carrera vertical","Promoció interna vertical","Promoció interna horitzontal"],"c":0,"ex":["Consolidar grau sense canviar de lloc és carrera horitzontal.","La vertical és l'ascens a llocs superiors.","La promoció interna és canvi de cos o escala.","No és promoció interna."],"clau":"Consolidar grau: carrera horitzontal.","ref":"art. 16 TREBEP"},{"id":"PA.1-01","b":"A","t":"A.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Amb la Llei orgànica 1/2025, d'eficiència del servei públic de justícia, l'organització judicial de primer grau passa a basar-se en:","op":["Tribunals d'instància només en l'ordre penal; la resta d'ordres mantenen els jutjats.","Tribunals d'instància amb seccions (civil, instrucció, contenciosa administrativa, social...) en lloc de jutjats unipersonals, i oficines de justícia al municipi en lloc de jutjats de pau.","Audiències provincials ampliades que absorbeixen els jutjats, i jutjats de pau reforçats.","Sales d'instància dels tribunals superiors de justícia."],"c":1,"ex":["Abasta tots els ordres.","La LO 1/2025 substitueix els jutjats unipersonals per seccions dels tribunals d'instància i els jutjats de pau per oficines de justícia al municipi.","Les audiències no absorbeixen els jutjats i els de pau desapareixen com a tals.","No són sales dels TSJ."],"clau":"LO 1/2025: tribunals d'instància amb seccions i oficines de justícia al municipi.","ref":"LO 1/2025, de 2 de gener","rev":"Actualitat: comprova-ho el setembre de 2026 i una setmana abans de l'examen"},{"id":"PA.1-02","b":"A","t":"A.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"termini","q":"Un ciutadà vol demandar una comunitat de propietaris per una reclamació de quantitat. La seva advocada li diu que abans ha d'intentar una solució per un mitjà adequat (MASC). Des de quan és exigible aquest requisit?","op":["Des del 3 d'abril de 2025, en què va entrar en vigor la part processal de la LO 1/2025.","Només és exigible en assumptes de família.","Des de l'1 de gener de 2024, amb la Llei d'eficiència processal.","Encara no és exigible: entra en vigor l'1 de gener de 2027."],"c":0,"ex":["La LO 1/2025 es va publicar el 3 de gener de 2025 i l'exigència de MASC va entrar en vigor tres mesos després, el 3 d'abril de 2025.","S'exigeix en tots els litigis civils i mercantils, amb excepcions.","No hi va haver cap llei d'eficiència vigent el 2024.","Ja és exigible."],"clau":"MASC obligatori des del 3 d'abril de 2025.","ref":"LO 1/2025, art. 5 i disposició final","rev":"Actualitat: comprova-ho el setembre de 2026 i una setmana abans de l'examen"},{"id":"PA.1-03","b":"A","t":"A.3","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"calcul","q":"Després de l'entrada de Bulgària, quants Estats membres formen la zona euro?","op":["20.","19.","27.","21."],"c":3,"ex":["Vint eren abans de Bulgària.","Dinou eren abans de Croàcia.","No tots els Estats de la Unió tenen l'euro.","Croàcia va fer 20 el 2023 i Bulgària fa 21 des de l'1 de gener de 2026."],"clau":"Zona euro 2026: 21 Estats.","ref":"Decisions del Consell (UE) de juliol de 2025","rev":"Actualitat: comprova-ho el setembre de 2026 i una setmana abans de l'examen"},{"id":"PA.2-01","b":"A","t":"A.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"La Llei 9/2025, de 13 de novembre, del Parlament de Catalunya, va afegir a la Llei 26/2010 la regulació dels serveis proactius i personalitzats. Aquests serveis:","op":["S'activen automàticament sense cap consentiment, per eficiència administrativa.","Substitueixen l'obligació de resoldre expressament.","S'ofereixen a la persona sense que els hagi sol·licitat, a partir de les dades que l'Administració ja té, i exigeixen el seu consentiment exprés i específic.","Només es poden prestar a empreses obligades a relacionar-se electrònicament."],"c":2,"ex":["Cal consentiment.","No afecten l'obligació de resoldre.","Els serveis proactius anticipen l'oferta a partir de dades pròpies, però només amb consentiment exprés, específic, informat i inequívoc.","Van adreçats a la ciutadania en general."],"clau":"Serveis proactius: l'Administració s'avança, però amb el teu consentiment específic.","ref":"art. 40 bis Llei 26/2010 (Llei 9/2025)","rev":"Actualitat: comprova-ho el setembre de 2026 i una setmana abans de l'examen"},{"id":"PA.1-04","b":"A","t":"A.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"La Llei orgànica 5/2024, d'11 de novembre, del dret de defensa:","op":["Reforma únicament el torn d'ofici.","Regula els mitjans adequats de solució de controvèrsies.","Regula el dret fonamental de defensa reconegut a l'article 24 de la Constitució, aplicable a tots els ordres jurisdiccionals i també als procediments administratius.","Regula el dret a la protecció de dades en l'àmbit judicial."],"c":2,"ex":["Va més enllà del torn d'ofici.","Els MASC els regula la LO 1/2025.","Desplega el dret de defensa de l'art. 24 CE, amb garanties davant tribunals i administracions.","No és una llei de protecció de dades."],"clau":"LO 5/2024 = dret de defensa (art. 24 CE).","ref":"LO 5/2024","rev":"Actualitat: comprova-ho el setembre de 2026 i una setmana abans de l'examen"},{"id":"P1.1-01","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"encreuament","q":"Arran d'una catàstrofe natural, el Consell de Ministres declara l'estat d'alarma. Quina durada màxima té la declaració inicial i qui n'ha d'autoritzar la pròrroga?","op":["Quinze dies; la pròrroga l'autoritza el Senat.","Quinze dies; la pròrroga l'autoritza el Congrés dels Diputats.","Trenta dies; la pròrroga l'autoritza el Consell de Ministres amb informe al Congrés.","Trenta dies; la pròrroga l'autoritza el Congrés dels Diputats."],"c":1,"ex":["El Senat no intervé en els estats excepcionals.","L'alarma la declara el Govern per decret, amb un màxim de quinze dies, i només el Congrés pot autoritzar-ne la pròrroga.","El Govern no pot prorrogar-la per si sol.","Trenta dies és el màxim de l'estat d'excepció, no de l'alarma."],"clau":"Alarma: 15 dies del Govern, pròrroga del Congrés.","ref":"art. 116.2 CE; LO 4/1981"},{"id":"P1.1-02","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"L'estat d'excepció es declara:","op":["Pel Govern, amb autorització prèvia del Congrés, per un màxim de trenta dies prorrogables per trenta més.","Pel Congrés per majoria absoluta a proposta del Govern, per un màxim de trenta dies.","Pel Govern, amb autorització prèvia del Congrés, per un màxim de seixanta dies no prorrogables.","Pel Govern, donant-ne compte al Congrés, per un màxim de quinze dies prorrogables."],"c":0,"ex":["Excepció: decret del Govern amb autorització prèvia del Congrés, trenta dies, prorrogable per trenta més amb els mateixos requisits.","La declaració pel Congrés per majoria absoluta és la del setge.","Són trenta dies prorrogables per trenta, no seixanta d'entrada.","Donar-ne compte i quinze dies són característiques de l'alarma."],"clau":"Excepció: 30 més 30, amb autorització prèvia del Congrés.","ref":"art. 116.3 CE"},{"id":"P1.1-03","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"majoria","q":"Un projecte de reforma constitucional que afecta només el títol IV (el Govern) segueix el procediment ordinari. Quina majoria exigeix i quan cal referèndum?","op":["Dos terços de cada cambra; referèndum obligatori.","Majoria absoluta de cada cambra; referèndum si el demana el Govern.","Tres cinquenes parts de cada cambra; referèndum obligatori.","Tres cinquenes parts de cada cambra; referèndum només si el demanen una desena part dels membres de qualsevol cambra dins els quinze dies següents a l'aprovació."],"c":3,"ex":["Dos terços i referèndum obligatori corresponen a la reforma agreujada.","La majoria absoluta no és suficient.","El referèndum és facultatiu en el procediment ordinari.","Procediment ordinari: 3/5 de cada cambra (o 2/3 del Congrés amb majoria absoluta del Senat) i referèndum facultatiu a petició d'1/10 d'una cambra en quinze dies."],"clau":"Reforma ordinària: 3/5 i referèndum només si el demana 1/10 en 15 dies.","ref":"art. 167 CE"},{"id":"P1.1-04","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Una reforma que afecti la secció primera del capítol II del títol I (drets fonamentals) exigeix:","op":["Dos terços de cada cambra i referèndum facultatiu, sense dissolució.","Majoria absoluta de cada cambra, dissolució de les Corts i referèndum obligatori.","Dos terços de cada cambra, dissolució de les Corts, ratificació per les noves Corts amb dos terços i referèndum obligatori.","Tres cinquenes parts de cada cambra i referèndum facultatiu."],"c":2,"ex":["La dissolució i el referèndum obligatori són inexcusables.","Cal dos terços, no majoria absoluta.","Reforma agreujada: 2/3 de cada cambra, dissolució immediata, les noves Corts ratifiquen i aproven el text per 2/3, i referèndum obligatori.","Això és el procediment ordinari."],"clau":"Reforma agreujada: 2/3, dissolució, 2/3 i referèndum sempre.","ref":"art. 168 CE"},{"id":"P1.1-05","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"composicio","q":"Els membres del Tribunal Constitucional són nomenats per un mandat de:","op":["Nou anys, amb renovació per meitats cada quatre anys i mig.","Nou anys, amb renovació per terços cada tres anys.","Dotze anys, amb renovació per terços cada quatre anys.","Sis anys, amb renovació per meitats cada tres anys."],"c":1,"ex":["La renovació és per terços.","Dotze magistrats (4 Congrés, 4 Senat, 2 Govern, 2 CGPJ), nou anys, renovats per terços cada tres anys.","El mandat és de nou anys.","Ni sis anys ni meitats."],"clau":"TC: 12 magistrats, 9 anys, per terços cada 3.","ref":"art. 159 CE"},{"id":"P1.1-06","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"termini","q":"El Govern de la Generalitat vol impugnar una llei estatal davant el Tribunal Constitucional. De quin termini disposa des de la publicació de la llei?","op":["Tres mesos; nou mesos si la Comissió Bilateral s'ha reunit per negociar i ho ha comunicat al Tribunal.","Un mes; tres si s'ha reunit la Comissió Bilateral.","Sis mesos; dotze si s'ha reunit la Comissió Bilateral.","Tres mesos, sense cap possibilitat d'ampliació."],"c":0,"ex":["El recurs d'inconstitucionalitat s'interposa en tres mesos; el termini s'amplia a nou si es reuneix la Comissió Bilateral de Cooperació i es comunica al Tribunal.","Els terminis són tres i nou mesos.","Els terminis són tres i nou mesos.","Sí que hi ha ampliació via Comissió Bilateral."],"clau":"Inconstitucionalitat: 3 mesos, o 9 amb Comissió Bilateral.","ref":"art. 33 LOTC"},{"id":"P1.1-07","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"termini","q":"Una ciutadana considera que una resolució judicial ferma ha vulnerat el seu dret a la intimitat. Per demanar empara al Tribunal Constitucional:","op":["Ha d'haver esgotat la via judicial i té vint dies des de la notificació de la resolució que la posa fi.","Pot acudir directament al Tribunal en vint dies, sense esgotar la via judicial.","Pot acudir directament al Tribunal en trenta dies, sense esgotar la via judicial.","Ha d'haver esgotat la via judicial i té trenta dies des de la notificació de la resolució que la posa fi."],"c":3,"ex":["Vint dies és el termini contra actes administratius o del Govern.","Ni sense esgotar ni vint dies.","L'empara és subsidiària: cal esgotar la via judicial.","Contra resolucions judicials: via judicial esgotada i trenta dies des de la notificació."],"clau":"Empara: 30 dies si ve d'un jutjat, 20 si ve de l'Administració.","ref":"arts. 43 i 44 LOTC"},{"id":"P1.1-08","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El Defensor del Poble és elegit:","op":["Per les Corts Generals, per majoria absoluta de cada cambra, per quatre anys.","Pel Congrés dels Diputats, per majoria de tres cinquenes parts, per nou anys.","Per les Corts Generals, per majoria de tres cinquenes parts de cada cambra, per cinc anys.","Pel Govern, a proposta de les Corts, per cinc anys."],"c":2,"ex":["Cal tres cinquenes parts i el mandat és de cinc anys.","L'elegeixen les dues cambres i el mandat és de cinc anys.","Alt comissionat de les Corts, elegit per 3/5 de cada cambra, mandat de cinc anys.","No el nomena el Govern."],"clau":"Defensor del Poble: 3/5 de cada cambra, 5 anys.","ref":"art. 54 CE; LO 3/1981"},{"id":"P1.1-09","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"En les investigacions sobre bandes armades o terrorisme, la suspensió individual de drets pot afectar:","op":["La llibertat ideològica, la inviolabilitat del domicili i el secret de les comunicacions.","El termini màxim de detenció preventiva, la inviolabilitat del domicili i el secret de les comunicacions.","El termini de detenció, la llibertat d'expressió i el dret de reunió.","La llibertat de residència, el dret de reunió i el dret d'associació."],"c":1,"ex":["La llibertat ideològica no és suspenible.","L'art. 55.2 permet suspendre, amb intervenció judicial i control parlamentari, només els drets dels arts. 17.2, 18.2 i 18.3.","Ni l'expressió ni la reunió entren en la suspensió individual.","Cap d'aquests entra en la suspensió individual."],"clau":"Suspensió individual: detenció (17.2), domicili (18.2) i comunicacions (18.3).","ref":"art. 55.2 CE"},{"id":"P1.1-10","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"excepcio","q":"Una plataforma reuneix 600.000 signatures per presentar al Congrés una proposició de llei sobre un nou impost. És admissible com a iniciativa legislativa popular?","op":["Sí, perquè supera les 500.000 signatures i cap matèria n'està exclosa.","No, perquè calen almenys 750.000 signatures acreditades.","Sí, sempre que l'admeti la Mesa del Senat.","No, perquè les matèries tributàries estan excloses de la iniciativa popular, encara que superi les 500.000 signatures."],"c":3,"ex":["Hi ha matèries excloses.","El mínim són 500.000 signatures.","La iniciativa es presenta al Congrés.","Les 500.000 signatures es compleixen, però la matèria tributària està exclosa, igual que les pròpies de llei orgànica, les internacionals i la gràcia."],"clau":"ILP estatal: 500.000 signatures i mai en tributs, LO, tractats ni gràcia.","ref":"art. 87.3 CE; LO 3/1984"},{"id":"P1.1-11","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El Congrés dels Diputats es compon de:","op":["Un mínim de 300 i un màxim de 400 diputats, fixats en 350 per la llei electoral, elegits per quatre anys.","Un mínim de 350 i un màxim de 400 diputats, elegits per quatre anys.","350 diputats fixats per la Constitució, elegits per cinc anys.","Un mínim de 300 i un màxim de 350 diputats, elegits per quatre anys."],"c":0,"ex":["La Constitució fixa una forquilla de 300 a 400 i la LOREG en fixa 350; legislatura de quatre anys.","El mínim és 300.","La xifra de 350 és de la llei electoral, i la legislatura dura quatre anys.","El màxim constitucional és 400."],"clau":"Congrés: entre 300 i 400 (350 per llei), 4 anys.","ref":"art. 68 CE; LOREG"},{"id":"P1.1-12","b":"1","t":"1.1","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"encreuament","q":"Trenta-vuit diputats presenten una moció de censura amb candidat. Es pot votar l'endemà mateix?","op":["Sí, si ho acorda la Mesa, i prospera amb majoria simple.","No: cal esperar cinc dies des de la presentació, i prospera només amb majoria absoluta del Congrés.","No: cal esperar deu dies, i prospera amb majoria de tres cinquenes parts.","No es pot tramitar, perquè calen almenys cinquanta diputats."],"c":1,"ex":["Ni l'endemà ni majoria simple.","La moció la proposen com a mínim 1/10 dels diputats (35), inclou candidat, no es vota fins passats cinc dies i exigeix majoria absoluta.","El termini és de cinc dies i la majoria absoluta.","Amb 38 diputats es supera la desena part (35)."],"clau":"Censura: 1/10, candidat, 5 dies d'espera, majoria absoluta.","ref":"art. 113 CE"},{"id":"P1.2-01","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"encreuament","q":"En la primera votació d'investidura, el candidat a president de la Generalitat obté 65 vots favorables dels 135 diputats. Què passa?","op":["No és investit; se celebra una segona votació 72 hores després, en què cal majoria absoluta.","No és investit i el Parlament queda dissolt automàticament.","No és investit; se celebra una segona votació 48 hores després, en què n'hi ha prou amb majoria simple.","És investit, perquè en la primera votació n'hi ha prou amb majoria simple."],"c":2,"ex":["La segona és a les 48 hores i amb majoria simple.","La dissolució només arriba si passen dos mesos des de la primera votació sense investidura.","A la primera votació cal majoria absoluta (68); si no s'assoleix, nova votació al cap de 48 hores amb majoria simple.","A la primera cal majoria absoluta."],"clau":"Investidura: absoluta, i 48 hores després, simple.","ref":"art. 67 EAC; art. 4 Llei 13/2008"},{"id":"P1.2-02","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"termini","q":"Si cap candidat a president de la Generalitat és elegit, el Parlament queda dissolt automàticament quan:","op":["Han passat dos mesos des de la constitució del Parlament.","Han passat tres mesos des de la primera votació d'investidura.","Han passat sis mesos des de les eleccions.","Han passat dos mesos des de la primera votació d'investidura."],"c":3,"ex":["No es compta des de la constitució de la cambra.","Són dos mesos.","No són sis mesos.","El còmput de dos mesos comença amb la primera votació d'investidura, com a l'Estat."],"clau":"Dos mesos des de la primera votació: dissolució automàtica.","ref":"art. 4 Llei 13/2008"},{"id":"P1.2-03","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"La moció de censura al Parlament de Catalunya:","op":["La proposen com a mínim una cinquena part dels diputats, inclou un candidat i exigeix majoria absoluta.","La proposen com a mínim una cinquena part dels diputats, no cal candidat i exigeix majoria simple.","La proposa qualsevol grup parlamentari, inclou un candidat i exigeix majoria de tres cinquenes parts.","La proposen com a mínim una desena part dels diputats, inclou un candidat i exigeix majoria absoluta."],"c":0,"ex":["Una cinquena part (27 diputats), amb candidat, majoria absoluta i cinc dies d'espera.","Cal candidat i majoria absoluta.","Cal una cinquena part i majoria absoluta.","Una desena part és la regla del Congrés, no del Parlament."],"clau":"Censura catalana: 1/5 dels diputats (27), no 1/10.","ref":"art. 43 Llei 13/2008"},{"id":"P1.2-04","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"La iniciativa per reformar els títols I i II de l'Estatut correspon:","op":["A una desena part dels diputats, al Govern i a 500.000 signatures acreditades.","A una cinquena part dels diputats, al Govern i a 300.000 signatures acreditades.","Al Parlament per majoria absoluta, al Govern i a 50.000 signatures.","A les Corts Generals, al Govern de l'Estat i a 300.000 signatures."],"c":1,"ex":["Ni una desena part ni 500.000.","Iniciativa: 1/5 dels diputats, el Govern o 300.000 signatures; després 2/3 del Parlament, ratificació de les Corts i referèndum.","La xifra de 50.000 és la de la iniciativa legislativa popular ordinària.","Les Corts no tenen la iniciativa de reforma."],"clau":"Reforma títols I i II: 1/5, Govern o 300.000 signatures.","ref":"art. 222 EAC"},{"id":"P1.2-05","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Els membres del Consell de Garanties Estatutàries tenen un mandat de:","op":["Sis anys renovable, amb renovació per meitats cada tres anys.","Cinc anys no renovable, coincidint amb la legislatura.","Nou anys no renovable, amb renovació per terços cada tres anys.","Nou anys renovable una vegada."],"c":2,"ex":["Ni sis anys ni renovable.","No és de cinc anys.","Nou anys no renovables i renovació per terços cada tres anys, com el Tribunal Constitucional.","No és renovable."],"clau":"CGE: 9 anys, no renovable, terços cada 3.","ref":"art. 77 EAC; Llei 2/2009"},{"id":"P1.2-06","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El Síndic de Greuges és elegit:","op":["Pel Govern, a proposta del Parlament, per nou anys.","Pel Parlament, per majoria de tres cinquenes parts, per un mandat de cinc anys renovable.","Pel Parlament, per majoria absoluta, per un mandat de cinc anys renovable.","Pel Parlament, per majoria de tres cinquenes parts, per un mandat de nou anys no renovable."],"c":3,"ex":["L'elegeix el Parlament, no el Govern.","El mandat és de nou anys no renovable.","Cal tres cinquenes parts i el mandat és de nou anys.","Tres cinquenes parts del Parlament i nou anys no renovables."],"clau":"Síndic: 3/5 i 9 anys sense reelecció.","ref":"art. 79 EAC; Llei 24/2009"},{"id":"P1.2-07","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"composicio","q":"La Sindicatura de Comptes està formada per:","op":["Set síndics elegits pel Parlament per tres cinquenes parts, amb mandat de sis anys renovable.","Cinc síndics designats pel Govern, amb mandat de sis anys.","Set síndics elegits pel Parlament per majoria absoluta, amb mandat de quatre anys.","Nou síndics elegits pel Parlament per tres cinquenes parts, amb mandat de nou anys no renovable."],"c":0,"ex":["Set síndics, 3/5 del Parlament, sis anys i poden ser reelegits.","No els designa el Govern.","Cal tres cinquenes parts i són sis anys.","Són set i el mandat és de sis anys renovable."],"clau":"Sindicatura: 7 síndics, 6 anys renovables.","ref":"art. 81 EAC; Llei 18/2010"},{"id":"P1.2-08","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Quines llengües són oficials a Catalunya segons l'Estatut?","op":["El català i el castellà; l'aranès només és oficial a l'Aran.","El català, el castellà i l'occità, denominat aranès a l'Aran, del qual és llengua pròpia.","El català, el castellà i la llengua de signes catalana.","Només el català, com a llengua pròpia i oficial."],"c":1,"ex":["L'Estatut declara l'occità oficial a Catalunya, no només a l'Aran.","L'occità és llengua pròpia de l'Aran i oficial a tot Catalunya, d'acord amb l'Estatut i les lleis.","La llengua de signes es regula, però no és llengua oficial.","El castellà també és oficial."],"clau":"Tres llengües oficials: català, castellà i occità (aranès).","ref":"art. 6 EAC"},{"id":"P1.2-09","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"competencia","q":"En una matèria de competència compartida, què correspon a la Generalitat?","op":["La potestat legislativa, la reglamentària i la funció executiva, en el marc de les bases que fixi l'Estat.","Només la funció executiva, amb potestat reglamentària d'organització dels serveis.","Totes les potestats de manera íntegra, sense intervenció estatal.","Només la potestat reglamentària per desplegar la llei estatal."],"c":0,"ex":["Compartida: la Generalitat legisla, reglamenta i executa dins de les bases estatals.","Això descriu la competència executiva.","Això descriu la competència exclusiva.","No es limita a reglamentar."],"clau":"Compartida = legislar i executar dins de les bases de l'Estat.","ref":"art. 111 EAC"},{"id":"P1.2-10","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Un decret llei del Govern de la Generalitat ha de ser:","op":["Convalidat o derogat pel Parlament en el termini de trenta dies des de la promulgació.","Convalidat pel Govern en vint dies i comunicat al Parlament.","Convalidat o derogat pel Parlament en el termini de quinze dies des de la publicació.","Ratificat pel Consell de Garanties Estatutàries en trenta dies."],"c":0,"ex":["El Parlament el convalida o deroga en trenta dies; també pot tramitar-lo com a projecte de llei per urgència.","El Govern no convalida la seva pròpia norma.","El termini és de trenta dies.","El Consell de Garanties no convalida."],"clau":"Decret llei català: 30 dies i el Parlament decideix.","ref":"art. 64 EAC"},{"id":"P1.2-11","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"La Comissió Bilateral Generalitat-Estat:","op":["Té composició paritària, la presideix sempre l'Estat i es reuneix un cop l'any.","Té majoria estatal i la presideix el ministre competent.","Té composició paritària, presidència alternada cada sis mesos i es reuneix cada trimestre.","Té composició paritària, presidència alternada per torns d'un any i es reuneix en plenari almenys dues vegades l'any."],"c":3,"ex":["La presidència s'alterna.","La composició és paritària.","L'alternança és anual i el mínim són dues sessions plenàries l'any.","Nombre igual de representants, presidència alternada anual i plenari almenys dues vegades l'any."],"clau":"Comissió Bilateral: paritària, alterna cada any, dos plens l'any.","ref":"art. 183 EAC"},{"id":"P1.2-12","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"El consell de vegueria substitueix:","op":["El consell comarcal.","La subdelegació del Govern de l'Estat.","La diputació provincial.","La delegació territorial del Govern."],"c":2,"ex":["Les comarques i els consells comarcals es mantenen.","La subdelegació és de l'Estat.","L'Estatut preveu que els consells de vegueria substitueixin les diputacions.","La delegació territorial és Administració de la Generalitat, no govern local."],"clau":"Vegueria: substitueix la diputació.","ref":"art. 91 EAC"},{"id":"P1.2-13","b":"1","t":"1.2","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El Parlament de Catalunya està format per:","op":["135 diputats fixats per l'Estatut, elegits per un mandat de quatre anys.","Entre 100 i 150 diputats, elegits per un mandat de quatre anys.","Entre 100 i 135 diputats, elegits per un mandat de quatre anys.","Entre 100 i 150 diputats, elegits per un mandat de cinc anys."],"c":1,"ex":["Els 135 són una xifra transitòria, no fixada per l'articulat.","L'Estatut fixa la forquilla de 100 a 150 (135 mentre no hi hagi llei electoral) i la legislatura de quatre anys.","El màxim és 150.","La legislatura és de quatre anys."],"clau":"Parlament: de 100 a 150 (ara 135), 4 anys.","ref":"art. 56 EAC i disposició transitòria 2a"},{"id":"P1.3-01","b":"1","t":"1.3","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Els consellers de la Generalitat són nomenats i separats:","op":["Pel Parlament, a proposta del president, per resolució del Parlament.","Pel Govern, per acord del Govern.","Pel president, amb ratificació del Parlament per majoria simple.","Lliurement pel president de la Generalitat, per decret del president."],"c":3,"ex":["El Parlament no intervé en el nomenament dels consellers.","El Govern no nomena els seus membres.","No cal ratificació parlamentària.","El president nomena i separa lliurement els consellers mitjançant decret."],"clau":"Consellers: els posa i els treu el president, per decret.","ref":"art. 68 EAC; Llei 13/2008"},{"id":"P1.3-02","b":"1","t":"1.3","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Les disposicions de caràcter general de la Generalitat adopten la forma de:","op":["Ordre, si les aprova el Govern; decret, si les aprova un conseller.","Acord, si les aprova el Govern; instrucció, si les aprova un conseller.","Decret, si les aprova el Govern; ordre, si les aprova un conseller.","Decret, si les aprova el Govern; resolució, si les aprova un conseller."],"c":2,"ex":["Està invertit.","Els acords i les instruccions no són reglaments.","El Govern dicta decrets i els consellers, ordres, en exercici de la potestat reglamentària.","La resolució és un acte administratiu, no una disposició general."],"clau":"Govern: decret. Conseller: ordre.","ref":"Llei 13/2008 (potestat reglamentària)"},{"id":"P1.3-03","b":"1","t":"1.3","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"Quin d'aquests càrrecs té la condició d'alt càrrec de l'Administració de la Generalitat?","op":["El cap de servei.","El director o directora general.","El subdirector o subdirectora general.","El cap de secció."],"c":1,"ex":["Els caps de servei són personal funcionari, no alts càrrecs.","Els secretaris generals, els directors generals i els delegats territorials són alts càrrecs, nomenats per decret del Govern.","Els subdirectors generals tampoc són alts càrrecs.","Els caps de secció són llocs de comandament funcionarial."],"clau":"Alts càrrecs: del director general cap amunt; el subdirector ja no.","ref":"art. 2 Llei 13/2005"},{"id":"P1.3-04","b":"1","t":"1.3","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"composicio","q":"Quantes delegacions territorials del Govern hi ha a Catalunya i quina és la més recent?","op":["Vuit; la del Penedès.","Quatre, coincidint amb les províncies.","Vuit; la de les Terres de l'Ebre.","Set; la de la Catalunya Central."],"c":0,"ex":["Barcelona, Girona, Lleida, Tarragona, Terres de l'Ebre, Catalunya Central, Alt Pirineu i Aran i, la darrera, el Penedès.","No coincideixen amb les províncies.","Les Terres de l'Ebre són anteriors.","Són vuit i la més recent és el Penedès."],"clau":"Vuit delegacions; el Penedès és l'última.","ref":"Organització territorial de l'Administració de la Generalitat"},{"id":"P1.3-05","b":"1","t":"1.3","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"encreuament","q":"El Govern vol crear una entitat amb personalitat jurídica pròpia i règim de dret administratiu per gestionar un servei públic. Quina figura escau i com es crea?","op":["Un consorci, creat per llei del Parlament.","Una societat mercantil, creada per llei del Parlament.","Un organisme autònom, creat per decret del Govern.","Un organisme autònom, creat per llei del Parlament."],"c":3,"ex":["Els consorcis es creen per conveni.","Les societats es constitueixen per acord del Govern, en règim de dret privat.","No es creen per decret.","Els organismes autònoms es creen per llei, que en fixa funcions, recursos i organització."],"clau":"Organisme autònom: per llei. Consorci: per conveni. Societat: acord del Govern.","ref":"art. 91 LRJSP; arts. 113 a 115 Llei 26/2010"},{"id":"P1.3-06","b":"1","t":"1.3","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"El Consell Tècnic del Govern:","op":["Està format pels consellers i adopta les decisions del Govern per delegació.","Està format pels directors generals i aprova els reglaments.","Està format pels secretaris generals dels departaments i prepara els assumptes que ha de tractar el Govern.","És un òrgan consultiu extern format per juristes."],"c":2,"ex":["Els consellers formen el Govern, no el Consell Tècnic.","No aprova reglaments.","El Consell Tècnic reuneix els secretaris generals i prepara i estudia els assumptes previs a les reunions del Govern.","L'òrgan consultiu extern de juristes és la Comissió Jurídica Assessora."],"clau":"Consell Tècnic = secretaris generals preparant el Govern.","ref":"Llei 13/2008 (Consell Tècnic)"},{"id":"P1.3-07","b":"1","t":"1.3","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"Les fundacions del sector públic de la Generalitat es constitueixen:","op":["Per llei del Parlament.","Amb autorització prèvia del Govern, per escriptura pública.","Per decret del president.","Per resolució del conseller competent, sense intervenció del Govern."],"c":1,"ex":["La llei és per als organismes autònoms.","Cal autorització prèvia del Govern per constituir-les o adherir-s'hi.","No es creen per decret del president.","Cal l'autorització del Govern."],"clau":"Fundació pública: autorització prèvia del Govern.","ref":"Acords del Govern d'autorització; art. 133 LRJSP (règim estatal)"},{"id":"P1.3-08","b":"1","t":"1.3","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"El personal eventual de l'Administració de la Generalitat:","op":["Fa funcions de confiança o assessorament especial i cessa automàticament quan cessa l'autoritat que el va nomenar.","Es nomena per resolució del secretari general i té reserva de lloc.","Fa funcions de confiança i adquireix la condició de funcionari als dos anys.","Fa funcions directives i es proveeix per concurs de mèrits."],"c":0,"ex":["Confiança o assessorament especial, nomenament lliure i cessament lligat al de l'autoritat.","No té reserva de lloc.","Mai adquireix la condició de funcionari per aquesta via.","No fa funcions directives ordinàries ni es proveeix per concurs."],"clau":"Eventual: confiança, i se'n va quan se'n va qui el va nomenar.","ref":"art. 12 TREBEP; Decret 2/2005"},{"id":"P1.4-01","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"majoria","q":"Al Consell de la Unió Europea, la majoria qualificada exigeix:","op":["El 55 % dels Estats membres (almenys 15) que representin el 65 % de la població; la minoria de bloqueig necessita almenys 4 Estats.","El 72 % dels Estats en tots els casos, sense criteri de població.","El 65 % dels Estats membres que representin el 55 % de la població; la minoria de bloqueig necessita almenys 3 Estats.","La majoria simple dels Estats que representin dos terços de la població."],"c":0,"ex":["Doble majoria: 55 % dels Estats i 65 % de la població; per bloquejar calen com a mínim quatre Estats.","El 72 % s'aplica només quan el Consell no actua a proposta de la Comissió, i amb el criteri de població.","Els percentatges estan invertits i la minoria de bloqueig és de quatre.","No és majoria simple."],"clau":"Majoria qualificada: 55 % Estats, 65 % població, bloqueig de 4.","ref":"art. 16 TUE; art. 238 TFUE"},{"id":"P1.4-02","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El president del Consell Europeu:","op":["És elegit pel Parlament Europeu, per cinc anys, no renovable.","És elegit pel Consell Europeu per majoria qualificada, per dos anys i mig, renovable una vegada.","És elegit pel Consell Europeu per unanimitat, per cinc anys.","És el cap de Govern de l'Estat que exerceix la presidència rotatòria, per sis mesos."],"c":1,"ex":["No l'elegeix el Parlament.","Mandat de dos anys i mig, renovable un cop, elegit pel mateix Consell Europeu per majoria qualificada.","És per majoria qualificada i dos anys i mig.","La presidència rotatòria de sis mesos és la del Consell (de ministres)."],"clau":"Consell Europeu: president de 2,5 anys, un cop renovable.","ref":"art. 15.5 TUE"},{"id":"P1.4-03","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El president de la Comissió Europea:","op":["És elegit directament pels ciutadans en les eleccions europees.","És designat pel Consell de la Unió per majoria simple.","És proposat pel Consell Europeu, tenint en compte les eleccions europees, i elegit pel Parlament Europeu per majoria dels membres que el componen.","És proposat pel Parlament Europeu i nomenat pel Consell Europeu per unanimitat."],"c":2,"ex":["No hi ha elecció directa.","El Consell de ministres no el designa.","Proposta del Consell Europeu per majoria qualificada i elecció pel Parlament per majoria dels seus membres; mandat de cinc anys.","La proposta és del Consell Europeu."],"clau":"Comissió: la proposa el Consell Europeu i l'elegeix el Parlament.","ref":"art. 17.7 TUE"},{"id":"P1.4-04","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"encreuament","q":"Un departament pregunta si cal aprovar una norma catalana per aplicar un reglament de la Unió Europea. Què li respondreu?","op":["Sí, perquè el reglament només obliga quant al resultat i cal transposar-lo.","No, perquè el reglament només vincula les institucions de la Unió.","Sí, perquè cap norma europea s'aplica sense una llei estatal o autonòmica.","No, perquè el reglament és obligatori en tots els seus elements i directament aplicable, sense transposició."],"c":3,"ex":["Això és la directiva.","Vinculen Estats i particulars.","Els reglaments no necessiten norma interna (només, si de cas, mesures d'execució).","Els reglaments s'apliquen directament a tots els Estats; la transposició és pròpia de les directives."],"clau":"Reglament: directe. Directiva: transposar.","ref":"art. 288 TFUE"},{"id":"P1.4-05","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"cas","tr":"efecte","q":"Una directiva clara, precisa i incondicional no s'ha transposat dins de termini. Un particular pot invocar-la?","op":["Sí, davant l'Estat (efecte directe vertical), però no contra un altre particular.","Només després que el Tribunal de Justícia declari l'incompliment.","Sí, tant contra l'Estat com contra qualsevol particular.","No, mai: les directives només vinculen els Estats."],"c":0,"ex":["Efecte directe vertical: invocable contra l'Estat quan és clara, precisa i incondicional i ha vençut el termini; no hi ha efecte horitzontal.","No cal cap sentència prèvia.","No té efecte directe horitzontal.","Sí que es pot invocar davant l'Estat."],"clau":"Directiva no transposada: contra l'Estat sí, contra un veí no.","ref":"Jurisprudència TJUE (Van Duyn, Marshall)"},{"id":"P1.4-06","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"En el procediment legislatiu ordinari de la Unió Europea:","op":["La iniciativa correspon al Parlament Europeu, i el Consell Europeu aprova en una sola lectura.","La iniciativa correspon a la Comissió, i el Parlament Europeu i el Consell legislen conjuntament, amb fins a tres lectures i un comitè de conciliació.","La iniciativa correspon al Consell, i el Parlament només emet un dictamen consultiu.","La iniciativa correspon a la Comissió, i el Consell Europeu decideix per unanimitat."],"c":1,"ex":["La iniciativa és de la Comissió i el Consell Europeu no legisla.","Comissió proposa; Parlament i Consell són colegisladors en fins a tres lectures amb conciliació.","El Parlament és colegislador, no consultiu.","El Consell Europeu no legisla."],"clau":"Ordinari: Comissió proposa, Parlament i Consell decideixen.","ref":"art. 289 i 294 TFUE"},{"id":"P1.4-07","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"composicio","q":"El Tribunal de Justícia de la Unió Europea (Tribunal de Justícia) està format per:","op":["Un jutge per Estat membre i cap advocat general, amb mandat de cinc anys.","Quinze jutges i onze advocats generals, amb mandat de sis anys.","Un jutge per Estat membre (27) i onze advocats generals, amb mandat de sis anys renovable.","Dos jutges per Estat membre i vuit advocats generals, amb mandat de nou anys."],"c":2,"ex":["Hi ha onze advocats generals.","Hi ha un jutge per Estat.","27 jutges (un per Estat) i 11 advocats generals; mandat de sis anys renovable, amb renovació parcial cada tres.","Dos jutges per Estat és el Tribunal General."],"clau":"Tribunal de Justícia: 27 jutges i 11 advocats generals; Tribunal General: 2 per Estat.","ref":"arts. 19 TUE i 252 TFUE"},{"id":"P1.4-08","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El Tribunal de Comptes Europeu:","op":["Té quinze membres, nomenats per cinc anys, i enjudicia la responsabilitat comptable.","Té set membres elegits pel Parlament Europeu per sis anys.","Té un membre per Estat, nomenat per nou anys no renovables, i controla el pressupost dels Estats.","Té un membre per Estat, nomenat per sis anys renovables, i fa l'auditoria externa dels comptes de la Unió."],"c":3,"ex":["No enjudicia ni són quinze.","No els elegeix el Parlament.","El mandat és de sis anys i no controla els pressupostos estatals.","Un membre per Estat, sis anys renovables, auditoria externa dels ingressos i despeses de la Unió."],"clau":"Tribunal de Comptes UE: 27, 6 anys, auditor extern.","ref":"arts. 285 a 287 TFUE"},{"id":"P1.4-09","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"La iniciativa ciutadana europea exigeix:","op":["Un milió de signatures de ciutadans d'almenys set Estats membres.","Dos milions de signatures de ciutadans d'almenys nou Estats membres.","Cinc-centes mil signatures de ciutadans d'almenys quatre Estats membres.","Un milió de signatures de ciutadans d'almenys quatre Estats membres."],"c":0,"ex":["Un milió de signataris procedents almenys d'una quarta part dels Estats (set).","No calen dos milions.","No en són prou 500.000.","Calen set Estats, no quatre."],"clau":"ICE: un milió i set Estats.","ref":"art. 11.4 TUE; Reglament (UE) 2019/788"},{"id":"P1.4-10","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"termini","q":"Segons l'article 50 del TUE, si un Estat notifica la intenció de retirar-se i no s'assoleix cap acord, els tractats deixen d'aplicar-se:","op":["A l'any de la notificació, sense possibilitat de pròrroga.","Als dos anys de la notificació, llevat que el Parlament Europeu decideixi prorrogar el termini per majoria.","Als dos anys de la notificació, llevat que el Consell Europeu, per unanimitat i d'acord amb l'Estat, decideixi prorrogar el termini.","Als cinc anys de la notificació."],"c":2,"ex":["El termini és de dos anys i és prorrogable.","La pròrroga la decideix el Consell Europeu, no el Parlament.","Dos anys des de la notificació, prorrogables per unanimitat del Consell Europeu amb l'acord de l'Estat.","Són dos anys."],"clau":"Retirada: dos anys, pròrroga per unanimitat.","ref":"art. 50 TUE"},{"id":"P1.4-11","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"La Carta dels Drets Fonamentals de la Unió Europea:","op":["Té el mateix valor que els tractats i vincula els Estats en tots els àmbits, també els purament interns.","Té el mateix valor jurídic que els tractats i vincula els Estats membres només quan apliquen el dret de la Unió.","Té valor de recomanació sense efectes jurídics.","Forma part del Conveni Europeu de Drets Humans."],"c":1,"ex":["No s'estén a les situacions purament internes.","Des de Lisboa té el mateix valor que els tractats; s'aplica als Estats només quan apliquen dret de la Unió.","És vinculant.","El Conveni és del Consell d'Europa, un instrument diferent."],"clau":"Carta: valor de tractat, però només quan s'aplica dret de la Unió.","ref":"art. 6 TUE; art. 51 Carta"},{"id":"P1.4-12","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"concepte","q":"El principi segons el qual, fora de les competències exclusives, la Unió intervé només si els objectius no poden ser assolits suficientment pels Estats membres s'anomena:","op":["Subsidiarietat.","Primacia.","Proporcionalitat.","Atribució."],"c":0,"ex":["Subsidiarietat: la Unió actua només si pot fer-ho millor que els Estats.","La primacia és la prevalença del dret de la Unió sobre el nacional.","La proporcionalitat limita el contingut i la forma de l'acció al que cal.","L'atribució limita la Unió a les competències atribuïdes pels tractats."],"clau":"Subsidiarietat: només si els Estats no arriben.","ref":"art. 5 TUE"},{"id":"P1.4-13","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"composicio","q":"El Parlament Europeu elegit el 2024 està format per:","op":["751 diputats, elegits per quatre anys; Espanya n'elegeix 54.","720 diputats, elegits per quatre anys; Espanya n'elegeix 61.","705 diputats, elegits per cinc anys; Espanya n'elegeix 59.","720 diputats, elegits per cinc anys per sufragi universal directe; Espanya n'elegeix 61."],"c":3,"ex":["751 i 54 són anteriors al Brexit.","La legislatura és de cinc anys.","705 i 59 eren les xifres de la legislatura anterior.","Des de 2024 són 720 escons i Espanya en té 61; legislatura de cinc anys."],"clau":"PE 2024: 720 escons, 61 espanyols, 5 anys.","ref":"art. 14 TUE; Decisió (UE) 2023/2061"},{"id":"P1.4-14","b":"1","t":"1.4","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"encreuament","q":"El Comitè Executiu del Banc Central Europeu està format per:","op":["Vint-i-set membres, un per Estat, amb mandat de vuit anys.","Dotze membres, amb mandat de sis anys renovable.","Sis membres, amb mandat de vuit anys no renovable.","Sis membres, amb mandat de cinc anys renovable."],"c":2,"ex":["Un per Estat és el Consell General; el Comitè en té sis.","Són sis i vuit anys.","President, vicepresident i quatre membres més, vuit anys no renovables; amb els governadors dels bancs centrals de l'euro formen el Consell de Govern.","El mandat és de vuit anys no renovable."],"clau":"BCE: Comitè Executiu de 6, 8 anys, sense renovació.","ref":"art. 283 TFUE"},{"id":"P1.5-01","b":"1","t":"1.5","o":"propia","src":"pròpia, fase 1 (setembre 2026)","k":"teoria","tr":"composicio","q":"El Consell General del Poder Judicial està integrat per:","op":["El president del Tribunal Suprem i dotze vocals, tots jutges, amb mandat de cinc anys.","El president del Tribunal Suprem, que el presideix, i vint vocals, dotze jutges o magistrats i vuit juristes, amb man
