  const due=Math.min(dueIds().length,S.cfg.maxDue),nou=Math.min(S.cfg.nou,QS.filter(q=>!seen(q.id)&&inFocus(q)).length),err=errorIds().length;
  const tot=QS.length,reals=QS.filter(q=>q.o==='real'||q.o==='real_adaptada').length,esp=qsBloc('E').length;
  const vist=QS.filter(q=>seen(q.id)).length;
  return `<div class="card"><h2>Sessió del dia</h2><div class="mut">${due} per repassar · ${nou} noves</div>
  <div class="bar"><i style="width:${pct(vist,tot)}%"></i></div><div class="mut">${vist} de ${tot} preguntes vistes · ${reals} reals · ${esp} d'específica</div>
  <div style="margin-top:10px"><button class="btn wide" data-a="sessio">Comença la sessió (${due+nou})</button></div></div>
  <div class="grid2">
  <button class="tile" data-a="infinit"><b>Mode infinit</b><span>Preguntes sense fi: primer les pendents, després les noves</span></button>
  <button class="tile" data-a="go" data-v="temes"><b>Per tema</b><span>Tria bloc i tema, test o lectura</span></button>
  <button class="tile" data-a="errors"><b>Errors</b><span>${err} preguntes fallades l'última vegada</span></button>
  <button class="tile" data-a="go" data-v="simcfg"><b>Simulacre</b><span>Temps, penalització i nota neta</span></button>
  <button class="tile" data-a="go" data-v="real"><b>Examen real</b><span>Les preguntes oficials, en el seu ordre</span></button>
  <button class="tile" data-a="go" data-v="lect"><b>Lectura</b><span>Preguntes resoltes, com uns apunts</span></button>
  <button class="tile" data-a="go" data-v="fitxes"><b>Fitxes</b><span>Els punts clau de cada tema</span></button>
  <button class="tile" data-a="go" data-v="quadern"><b>Quadern d'errors</b><span>Les claus del que falles</span></button>
  <button class="tile" data-a="go" data-v="stats"><b>Estadístiques</b><span>Mapa de temes, trampes i evolució</span></button>
  </div><footer class="p">${VERSIO} · progrés desat en aquest navegador</footer>`;};

/* Temari */
V.temes=function(){setHdr('Temari');
  return TEMARI.blocs.map(b=>{const qs=qsBloc(b.id);return `<div class="card"><h2>${esc(b.id)}. ${esc(b.nom)} <span class="mut">(${qs.length})</span></h2>${b.rev?`<div class="mut">${esc(b.rev)}</div>`:''}
  ${b.temes.map(t=>{const m=mastery(t.id);const cls=m.cls;return `<div class="li"><div><b>${esc(t.id)}</b> ${esc(t.nom)} <span class="chip ${cls?'':''}" style="${cls==='g'?'border-color:var(--ok);color:var(--ok)':cls==='a'?'border-color:var(--warn);color:var(--warn)':cls==='r'?'border-color:var(--ko);color:var(--ko)':''}">${m.n} preg · ${m.seen} vistes · ${m.dom} dominades</span></div>
  <div class="row" style="margin-top:6px"><button class="btn small" data-a="tema" data-t="${esc(t.id)}" ${m.n?'':'disabled'}>Test</button><button class="btn small sec" data-a="go" data-v="lect" data-t="${esc(t.id)}" ${m.n?'':'disabled'}>Lectura</button><button class="btn small sec" data-a="go" data-v="fitxa" data-t="${esc(t.id)}">Fitxa</button></div></div>`;}).join('')}</div>`;}).join('');};

/* Quiz (sessió, tema, errors) */
function startRun(mode,ids,title,extra){if(!ids.length){alert('No hi ha preguntes per a aquest mode.');return;}
  RUN=Object.assign({mode,ids,i:0,ans:{},ord:{},title,t0:Date.now(),dub:{}},extra||{});
  ids.forEach(id=>{const q=BYID[id];let o=[0,1,2,3];if(mode!=='real'&&!q.op.some(x=>REFOPT.test(x)))o=shuffle(o);RUN.ord[id]=o;});
  go(mode==='sim'||mode==='real'?'sim':'quiz');}
function curQ(){return BYID[RUN.ids[RUN.i]];}
function optHtml(q,o,state){const a=RUN.ans[q.id];return o.map((k,i)=>{let cls='opt';let ex='';if(a&&a.done){if(k===q.c)cls+=' ok';else if(a.sel===k)cls+=' ko';else cls+=' dim';ex=q.ex[k]?`<span class="ex">${esc(q.ex[k])}</span>`:'';}else if(a&&a.sel===k)cls+=' sel';return `<button class="${cls}" data-a="opt" data-k="${k}"><span class="l">${LET[i]})</span><span>${esc(q.op[k])}${ex}</span></button>`;}).join('');}
function chips(q){const tm=TEMA[q.t];return `<span class="chip ${q.o==='real'?'real':q.o==='real_adaptada'?'ad':''}">${q.o==='real'?'Real':q.o==='real_adaptada'?'Real adaptada':'Pròpia'}</span><span class="chip">${esc(q.b)} · ${esc(q.t)}${tm?' '+esc(tm.nom):''}</span><span class="chip">${q.k==='cas'?'Cas':'Teoria'}</span><span class="chip">${esc(TRAMPES[q.tr]||q.tr)}</span>`;}
V.quiz=function(){const q=curQ();setHdr(RUN.title);const a=RUN.ans[q.id]||{};const o=RUN.ord[q.id];const n=RUN.ids.length;
  let conf='';if(S.cfg.conf&&a.sel!=null&&!a.done){conf=`<div class="mut">Com de segur estàs? (tecles S, D, A)</div><div class="conf"><button data-a="conf" data-c="segur">Segur</button><button data-a="conf" data-c="dubte">Dubte</button><button data-a="conf" data-c="atzar">Atzar</button></div>`;}
  let fb='';if(a.done){fb=`<div class="fb ${a.ok?'ok':'ko'}"><b>${a.ok?'Correcte':'Incorrecte'}</b>${a.conf?` · marcat com a ${CONF[a.conf].toLowerCase()}`:''}${!a.ok||a.conf!=='segur'&&S.cfg.conf?' · tornarà aviat':''}
  ${q.clau?`<div class="clau">Clau: ${esc(q.clau)}</div>`:''}${q.ref?`<div class="ref">Referència: ${esc(q.ref)}</div>`:''}${q.src?`<div class="ref">Procedència: ${esc(q.src)}</div>`:''}${q.rev?`<div class="ref">Revisar: ${esc(q.rev)}</div>`:''}</div>
  <button class="btn wide" data-a="next">${RUN.i+1<n?'Següent (Enter)':'Acaba'}</button>`;}
  const inf=RUN.mode==='infinit';return `<div class="row" style="justify-content:space-between"><span class="mut">${inf?(RUN.i+1)+' · mode infinit':(RUN.i+1)+' / '+n}</span><button class="btn small sec" data-a="exit">Surt</button></div>${inf?'':`<div class="bar"><i style="width:${pct(RUN.i,n)}%"></i></div>`}<div>${chips(q)}</div><div class="q">${esc(q.q)}</div>${optHtml(q,o)}${conf}${fb}<div class="kb noprint">Tecles: 1 a 4 per respondre · Enter per continuar · Esc per sortir</div>`;};
function answer(k){const q=curQ();const a=RUN.ans[q.id]||(RUN.ans[q.id]={});if(a.done)return;a.sel=k;if(S.cfg.conf){render();}else{finish('');}}
function finish(conf){const q=curQ();const a=RUN.ans[q.id];if(!a||a.sel==null||a.done)return;a.done=true;a.conf=conf;a.ok=(a.sel===q.c);record(q,a.ok,conf,RUN.mode);render();}
function next(){const q=curQ();const a=RUN.ans[q.id];if(!a||!a.done)return;if(RUN.mode==='infinit'&&RUN.i+1>=RUN.ids.length){const more=infinitBatch(RUN.ids.slice(-60),30);more.forEach(id=>{const qq=BYID[id];let o=[0,1,2,3];if(!qq.op.some(x=>REFOPT.test(x)))o=shuffle(o);RUN.ord[id]=o;RUN.ids.push(id);});}if(RUN.i+1<RUN.ids.length){RUN.i++;render();window.scrollTo(0,0);}else{go('runres');}}
V.runres=function(){setHdr('Resultat');const ids=RUN.ids.filter(id=>RUN.ans[id]&&RUN.ans[id].done);let ok=0;ids.forEach(id=>{if(RUN.ans[id]&&RUN.ans[id].ok)ok++;});const per={};ids.forEach(id=>{const q=BYID[id];const p=per[q.t]=per[q.t]||{n:0,ok:0};p.n++;if(RUN.ans[id]&&RUN.ans[id].ok)p.ok++;});
  return `<div class="card center"><div class="big">${ok} / ${ids.length}</div><div class="mut">${pct(ok,ids.length)} % d'encerts · ${RUN.title}</div></div>
  <div class="card"><h3>Per tema</h3><table>${Object.keys(per).map(t=>`<tr><td>${esc(t)} ${esc(temaNom(t))}</td><td>${per[t].ok}/${per[t].n}</td></tr>`).join('')}</table></div>
  <div class="row"><button class="btn" data-a="go" data-v="home">Inici</button><button class="btn sec" data-a="errors">Repassa errors</button></div>`;};

/* Simulacre */
V.simcfg=function(){setHdr('Simulacre');const c=S.cfg.sim;const nE=qsBloc('E').length,nA=qsBloc('A').length;
  return `<div class="card"><h2>Configura el simulacre</h2><div class="mut">Els valors de les bases (nombre de preguntes, temps i penalització) es poden fixar aquí quan els confirmis.</div>
  <label class="f">Nombre de preguntes<input type="number" id="sN" value="${c.n}" min="5" max="200"></label>
  <label class="f">Temps (minuts)<input type="number" id="sM" value="${c.min}" min="1" max="300"></label>
  <label class="f">Penalització per error (fracció d'una resposta correcta: 0,25 = un error resta un quart)<input type="number" id="sP" value="${c.pen}" min="0" max="1" step="0.01"></label>
  <label class="f">% part comuna<input type="number" id="sPC" value="${c.pc}" min="0" max="100"></label>
  <label class="f">% part específica (genètica forense, ${nE} disponibles)<input type="number" id="sPE" value="${c.pe}" min="0" max="100"></label>
  <label class="f">% actualitat (${nA} disponibles)<input type="number" id="sPA" value="${c.pa}" min="0" max="100"></label>
  <button class="btn wide" data-a="simstart">Comença</button></div>
  ${S.sims.length?`<div class="card"><h3>Darrers simulacres</h3><table>${S.sims.slice(-8).reverse().map(s=>`<tr><td>${new Date(s.d).toLocaleDateString('ca-ES')}</td><td>${s.ok}✓ ${s.ko}✗ ${s.bl}○</td><td>${s.net.toFixed(2)} / ${s.n}</td><td><b>${s.nota.toFixed(2)}</b></td></tr>`).join('')}</table></div>`:''}`;};
function simStart(){const c=S.cfg.sim;c.n=+$('#sN').value||60;c.min=+$('#sM').value||90;c.pen=+$('#sP').value||0;c.pc=+$('#sPC').value||0;c.pe=+$('#sPE').value||0;c.pa=+$('#sPA').value||0;save();
  const tot=c.pc+c.pe+c.pa||1;const want={C:Math.round(c.n*c.pc/tot),E:Math.round(c.n*c.pe/tot),A:Math.round(c.n*c.pa/tot)};
  const pools={C:shuffle(QS.filter(q=>q.b!=='E'&&q.b!=='A').map(q=>q.id)),E:shuffle(qsBloc('E').map(q=>q.id)),A:shuffle(qsBloc('A').map(q=>q.id))};
  let ids=[];['C','E','A'].forEach(k=>{ids=ids.concat(pools[k].splice(0,want[k]));});
  const rest=shuffle(pools.C.concat(pools.E,pools.A));while(ids.length<c.n&&rest.length)ids.push(rest.shift());
  shuffle(ids);startRun('sim',ids,'Simulacre',{end:Date.now()+c.min*60000,pen:c.pen});}
V.sim=function(){const q=curQ();const real=RUN.mode==='real';setHdr(real?'Examen real':'Simulacre');const a=RUN.ans[q.id]||{};const o=RUN.ord[q.id];const n=RUN.ids.length;
  const grid=RUN.ids.map((id,i)=>`<button data-a="simgo" data-i="${i}" class="${RUN.ans[id]&&RUN.ans[id].sel!=null?'done':''} ${RUN.dub[id]?'dub':''} ${i===RUN.i?'cur':''}">${i+1}</button>`).join('');
  return `<div class="row" style="justify-content:space-between"><span class="mut">${RUN.i+1} / ${n}</span><button class="btn small sec" data-a="exit">Surt</button>${real?'<span class="mut">sense temps</span>':'<span class="timer" id="tm"></span>'}</div><div class="bar"><i style="width:${pct(RUN.i,n)}%"></i></div>
  <div>${chips(q)}</div><div class="q">${esc(q.q)}</div>${optHtml(q,o)}
  <div class="row"><button class="btn small sec" data-a="simblank">Deixa en blanc</button><button class="btn small ${RUN.dub[q.id]?'':'sec'}" data-a="simdub">${RUN.dub[q.id]?'Marcada com a dubtosa':'Marca com a dubtosa'}</button></div>
  <div class="navgrid">${grid}</div>
  <div class="row"><button class="btn sec" data-a="simprev" ${RUN.i===0?'disabled':''}>Anterior</button><button class="btn" data-a="simnext">${RUN.i+1<n?'Següent':'Acaba i corregeix'}</button></div>
  <div class="kb">Tecles: 1 a 4 respondre · Enter següent · D dubtosa</div>`;};
V.sim_after=function(){if(RUN.mode==='real')return;const tick=()=>{const ms=RUN.end-Date.now();const e=$('#tm');if(!e)return;if(ms<=0){clearInterval(TIMER);TIMER=null;simFinish(true);return;}const s=Math.floor(ms/1000);e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');e.classList.toggle('low',ms<5*60000);};if(TIMER)clearInterval(TIMER);TIMER=setInterval(tick,1000);tick();};
function simFinish(auto){if(TIMER){clearInterval(TIMER);TIMER=null;}
  if(!auto){const nb=RUN.ids.filter(id=>!(RUN.ans[id]&&RUN.ans[id].sel!=null)).length;if(nb&&!confirm(nb+' preguntes en blanc. Vols corregir igualment?'))return;}
  let ok=0,ko=0,bl=0;const perB={};
  RUN.ids.forEach(id=>{const q=BYID[id];const a=RUN.ans[id]||(RUN.ans[id]={});const b=perB[q.b]=perB[q.b]||{n:0,ok:0,ko:0,bl:0};b.n++;
    if(a.sel==null){bl++;b.bl++;a.done=true;a.ok=false;a.blank=true;}else{a.done=true;a.ok=a.sel===q.c;if(a.ok){ok++;b.ok++;}else{ko++;b.ko++;}record(q,a.ok,RUN.dub[id]?'dubte':'',RUN.mode);}
    if(RUN.dub[id]){a.dub=true;}});
  const net=ok-ko*RUN.pen;const nota=Math.max(0,net/RUN.ids.length*10);
  const dd=RUN.ids.filter(id=>RUN.dub[id]&&RUN.ans[id].sel!=null);const dok=dd.filter(id=>RUN.ans[id].ok).length;
  if(RUN.mode==='sim'){S.sims.push({d:Date.now(),n:RUN.ids.length,ok,ko,bl,pen:RUN.pen,net,nota,perB,dn:dd.length,dok,min:Math.round((Date.now()-RUN.t0)/60000)});}save();
  RUN.res={ok,ko,bl,net,nota,perB,dn:dd.length,dok};go('simres');}
function riscText(pen){let dn=0,dok=0;QS.forEach(q=>{const s=S.p[q.id];if(!s||!s.h)return;s.h.forEach(h=>{if(h[2]==='dubte'){dn++;if(h[1])dok++;}});});const th=pen/(1+pen);
  if(dn<8)return `Encara tinc poques dades sobre les preguntes que marques com a dubtoses (${dn}). Amb la penalització ${pen}, arriscar compensa si encertes més del ${Math.round(th*100)} % de les dubtoses.`;
  const a=dok/dn;return `En les preguntes que marques com a dubtoses encertes el ${Math.round(a*100)} % (${dok} de ${dn}). Amb penalització ${pen} el punt d'equilibri és el ${Math.round(th*100)} %: ${a>th+0.05?'et compensa contestar-les.':a<th-0.05?'et surt més a compte deixar-les en blanc.':'estàs just al límit; contesta només les que puguis reduir a dues opcions.'}`;}
V.simres=function(){const real=RUN.mode==='real';setHdr(real?'Resultat de l\'examen real':'Resultat del simulacre');const r=RUN.res;
  return `<div class="card center"><div class="big">${r.nota.toFixed(2)}</div><div class="mut">nota sobre 10 · ${r.ok} encerts, ${r.ko} errors, ${r.bl} en blanc · net ${r.net.toFixed(2)} de ${RUN.ids.length}</div></div>
  <div class="card"><h3>Per bloc</h3><table>${Object.keys(r.perB).map(b=>{const x=r.perB[b];const nn=x.ok-x.ko*RUN.pen;return `<tr><td>${esc(b)} ${esc(blocNom(b))}</td><td>${x.ok}✓ ${x.ko}✗ ${x.bl}○</td><td>${pct(Math.max(0,nn),x.n)} %</td></tr>`;}).join('')}</table></div>
  ${real?'':`<div class="card"><h3>Arriscar o deixar en blanc</h3><div>${riscText(RUN.pen)}</div></div>`}
  <div class="card"><h3>Revisió</h3>${RUN.ids.map((id,i)=>{const q=BYID[id];const a=RUN.ans[id];return `<div class="li"><div class="mut">${i+1} · ${esc(q.t)} ${a.blank?'○ en blanc':a.ok?'✓':'✗'} ${a.dub?'· dubtosa':''}</div><div><b>${esc(q.q)}</b></div><div class="lect">${RUN.ord[id].map((k,j)=>`<div class="opt ${k===q.c?'ok':(a.sel===k?'ko':'dim')}"><span class="l">${LET[j]})</span><span>${esc(q.op[k])}${q.ex[k]?`<span class="ex">${esc(q.ex[k])}</span>`:''}</span></div>`).join('')}</div>${q.clau?`<div class="clau">Clau: ${esc(q.clau)}</div>`:''}${q.ref?`<div class="ref">${esc(q.ref)}</div>`:''}</div>`;}).join('')}</div>
  <div class="row"><button class="btn" data-a="go" data-v="home">Inici</button><button class="btn sec" data-a="go" data-v="stats">Estadístiques</button></div>`;};

/* Examen real */
V.real=function(){setHdr('Examen real');const ex={};QS.filter(q=>q.exam).forEach(q=>{(ex[q.exam]=ex[q.exam]||[]).push(q);});
  const keys=Object.keys(ex);if(!keys.length)return '<div class="card">Encara no hi ha exàmens reals carregats.</div>';
  return `<div class="card"><div class="mut">Preguntes oficials en l'ordre original, sense barrejar les opcions, amb la resposta de la plantilla de correcció. No hi ha temps ni penalització; es corregeix al final.</div></div>`+keys.map(k=>{const qs=ex[k].sort((a,b)=>(a.num||0)-(b.num||0));return `<button class="tile" data-a="realstart" data-x="${esc(k)}"><b>${esc(qs[0].exnom||k)}</b><span>${qs.length} preguntes</span></button>`;}).join('');};
function realStart(x){const ids=QS.filter(q=>q.exam===x).sort((a,b)=>(a.num||0)-(b.num||0)).map(q=>q.id);startRun('real',ids,'Examen real '+x,{end:Date.now()+100*3600000,pen:0});}

/* Lectura */
V.lect=function(){setHdr('Lectura');const t=P.t;
  if(!t){return `<div class="card"><h2>Lectura</h2><div class="mut">Tria un tema: veuràs cada pregunta amb la resposta bona marcada i la seva explicació, per llegir-les com si fossin apunts.</div></div>`+TEMARI.blocs.map(b=>`<div class="card"><h3>${esc(b.id)}. ${esc(b.nom)}</h3><div class="row">${b.temes.map(x=>`<button class="btn small sec" data-a="go" data-v="lect" data-t="${esc(x.id)}" ${qsTema(x.id).length?'':'disabled'}>${esc(x.id)}</button>`).join('')}</div></div>`).join('');}
  const qs=qsTema(t);return `<div class="card"><h2>${esc(t)} ${esc(temaNom(t))}</h2><div class="mut">${qs.length} preguntes</div><div class="row noprint"><button class="btn small sec" data-a="go" data-v="lect">Altres temes</button><button class="btn small sec" data-a="print">Imprimeix</button></div></div>`+qs.map((q,i)=>`<div class="card lect">${chips(q)}<div class="q">${i+1}. ${esc(q.q)}</div>${q.op.map((o,k)=>`<div class="opt ${k===q.c?'ok':'dim'}"><span class="l">${LET[k]})</span><span>${esc(o)}${q.ex[k]?`<span class="ex">${esc(q.ex[k])}</span>`:''}</span></div>`).join('')}${q.clau?`<div class="clau">Clau: ${esc(q.clau)}</div>`:''}${q.ref?`<div class="ref">${esc(q.ref)}</div>`:''}${q.src?`<div class="ref">${esc(q.src)}</div>`:''}</div>`).join('');};

/* Fitxes */
V.fitxes=function(){setHdr('Fitxes');return `<div class="card"><h2>Fitxes de tema</h2><div class="mut">De 8 a 12 punts clau per llegir abans del test.</div></div>`+TEMARI.blocs.map(b=>`<div class="card"><h3>${esc(b.id)}. ${esc(b.nom)}</h3>${b.temes.map(x=>`<div class="li"><button class="tile" data-a="go" data-v="fitxa" data-t="${esc(x.id)}"><b>${esc(x.id)} ${esc(x.nom)}</b><span>${(FITXES[x.id]||[]).length?(FITXES[x.id].length+' punts'):'fitxa pendent (propera fase)'}</span></button></div>`).join('')}</div>`).join('');};
V.fitxa=function(){const t=P.t;setHdr('Fitxa '+t);const f=FITXES[t]||[];return `<div class="card"><h2>${esc(t)} ${esc(temaNom(t))}</h2>${f.length?`<ol class="pt">${f.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<div class="mut">Fitxa pendent: s\'afegirà en la fase d\'aquest bloc.</div>'}<div class="row noprint" style="margin-top:12px"><button class="btn small" data-a="tema" data-t="${esc(t)}" ${qsTema(t).length?'':'disabled'}>Test del tema</button><button class="btn small sec" data-a="go" data-v="lect" data-t="${esc(t)}" ${qsTema(t).length?'':'disabled'}>Lectura</button><button class="btn small sec" data-a="print">Imprimeix</button></div></div>`;};

/* Quadern d'errors */
V.quadern=function(){setHdr('Quadern d\'errors');const ids=errorIds();if(!ids.length)return '<div class="card"><h2>Quadern d\'errors</h2><div class="mut">Encara no hi ha errors registrats. Quan fallis una pregunta, la seva clau apareixerà aquí, ordenada per tema.</div></div>';
  const per={};ids.forEach(id=>{const q=BYID[id];(per[q.t]=per[q.t]||[]).push(q);});
  return `<div class="card noprint"><h2>Quadern d'errors</h2><div class="mut">${ids.length} preguntes fallades l'última vegada que van sortir. Desapareixen quan les tornes a encertar.</div><div class="row" style="margin-top:8px"><button class="btn small" data-a="errors">Repassa-les ara</button><button class="btn small sec" data-a="print">Imprimeix</button></div></div>`+Object.keys(per).sort().map(t=>`<div class="card"><h3>${esc(t)} ${esc(temaNom(t))}</h3>${per[t].map(q=>`<div class="li"><div>${esc(q.q)}</div><div class="mut">Resposta: ${esc(q.op[q.c])}</div>${q.clau?`<div class="clau">Clau: ${esc(q.clau)}</div>`:''}${q.ref?`<div class="ref">${esc(q.ref)}</div>`:''}</div>`).join('')}</div>`).join('');};

/* Estadístiques */
V.stats=function(){setHdr('Estadístiques');
  const map=TEMARI.blocs.map(b=>`<div class="card"><h3>${esc(b.id)}. ${esc(b.nom)}</h3><div class="map">${b.temes.map(t=>{const m=mastery(t.id);return `<div class="${m.cls}" data-a="tema" data-t="${esc(t.id)}" title="${esc(t.nom)}">${esc(t.id)}<small>${m.dom}/${m.n}</small></div>`;}).join('')}</div></div>`).join('');
  const tr={};let tot=0,totko=0;const cf={segur:[0,0],dubte:[0,0],atzar:[0,0]};
  QS.forEach(q=>{const s=S.p[q.id];if(!s||!s.h)return;s.h.forEach(h=>{const x=tr[q.tr]=tr[q.tr]||[0,0];x[0]++;tot++;if(!h[1]){x[1]++;totko++;}if(h[2]&&cf[h[2]]){cf[h[2]][0]++;if(h[1])cf[h[2]][1]++;}});});
  const trRows=Object.keys(tr).sort((a,b)=>pct(tr[b][1],tr[b][0])-pct(tr[a][1],tr[a][0])).map(k=>`<tr><td>${esc(TRAMPES[k]||k)}</td><td>${tr[k][1]} de ${tr[k][0]}</td><td>${pct(tr[k][1],tr[k][0])} % d'error</td></tr>`).join('');
  const cfRows=Object.keys(cf).map(k=>`<tr><td>${CONF[k]}</td><td>${cf[k][1]} de ${cf[k][0]}</td><td>${cf[k][0]?pct(cf[k][1],cf[k][0])+' % d\'encert':'sense dades'}</td></tr>`).join('');
  const ev=S.sims.length?`<div class="row" style="align-items:flex-end;height:120px;gap:4px">${S.sims.slice(-15).map(s=>`<div title="${s.nota.toFixed(2)}" style="flex:1;background:var(--acc);height:${Math.max(4,s.nota*10)}%;border-radius:4px 4px 0 0"></div>`).join('')}</div><div class="mut">Nota de cada simulacre (0 a 10), del més antic al més recent.</div>`:'<div class="mut">Encara no has fet cap simulacre.</div>';
  return `<div class="card"><h2>Resum</h2><div>${tot} respostes registrades · ${pct(tot-totko,tot)} % d'encert global</div><div class="mut">Verd: 70 % o més del tema dominat (caixa 3 o superior i encertada). Ambre: entre 40 i 70 %. Vermell: menys del 40 %. Gris: sense començar.</div></div>${map}
  <div class="card"><h3>Trampes en què més caus</h3>${trRows?`<table>${trRows}</table>`:'<div class="mut">Sense dades encara.</div>'}</div>
  <div class="card"><h3>Calibratge de la teva seguretat</h3><table>${cfRows}</table><div class="mut" style="margin-top:6px">${riscText(S.cfg.sim.pen)}</div></div>
  <div class="card"><h3>Evolució</h3>${ev}</div>`;};

/* Ajustos */
V.ajustos=function(){setHdr('Ajustos');const c=S.cfg;
  return `<div class="card"><h2>Estudi</h2>
  <div class="sw"><span>Marcar la seguretat (segur, dubte, atzar) abans de veure la solució</span><input type="checkbox" id="cConf" ${c.conf?'checked':''}></div>
  <div class="sw"><span>Tema fosc</span><input type="checkbox" id="cDark" ${c.theme==='dark'?'checked':''}></div>
  <label class="f" style="margin-top:10px">Preguntes noves per sessió<input type="number" id="cNou" value="${c.nou}" min="0" max="100"></label>
  <label class="f">Màxim de repassos per sessió<input type="number" id="cMax" value="${c.maxDue}" min="5" max="300"></label>
  <label class="f">D'on surten les preguntes noves (sessió del dia i mode infinit)<select id="cFocus">${[['all','Tot el temari'],['C','Només part comuna (blocs 1 a 7)'],['E','Només part específica (genètica forense)'],['A','Només actualitat']].concat(TEMARI.blocs.filter(b=>!['A','E'].includes(b.id)).map(b=>[b.id,'Bloc '+b.id+': '+b.nom])).map(x=>`<option value="${x[0]}" ${c.focus===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select></label>
  <button class="btn" data-a="cfgsave">Desa</button></div>
  <div class="card"><h2>Progrés</h2><div class="mut">Exporta el progrés per passar-lo del mòbil al PC i importa'l a l'altre dispositiu. A l'iPhone, «Exporta» obre el menú de compartir (desa-ho a Fitxers o envia-t'ho); «Copia» el posa al porta-retalls per enganxar-lo a l'altre dispositiu.</div><div class="row" style="margin-top:8px"><button class="btn sec" data-a="exp">Exporta progrés</button><button class="btn sec" data-a="copy">Copia progrés</button><label class="btn sec" style="cursor:pointer">Importa progrés (fitxer)<input type="file" id="fImp" accept="application/json,.json,text/plain" class="hide"></label></div>
  <details style="margin-top:10px"><summary class="mut">Importa progrés enganxant el text</summary><textarea id="tImp" placeholder="Enganxa aquí el progrés exportat"></textarea><div style="margin-top:6px"><button class="btn small sec" data-a="impText">Importa del text</button></div></details></div>
  <div class="card"><h2>Preguntes noves</h2><div class="mut">Importa un lot en JSON (una llista d'objectes amb id, b, t, q, op, c, ex, clau, ref, k, tr, o). Lots carregats: ${S.extra.length} preguntes.</div><div class="row" style="margin-top:8px"><label class="btn sec" style="cursor:pointer">Importa lot JSON<input type="file" id="fQ" accept="application/json,.json,text/plain" class="hide"></label>${S.extra.length?'<button class="btn sec" data-a="delextra">Esborra lots</button>':''}</div></div>
  <div class="card"><h2>Perill</h2><button class="btn sec" data-a="reset">Esborra tot el progrés</button></div>
  <footer class="p">${VERSIO} · ${QS.length} preguntes carregades</footer>`;};

function importProgres(txt){try{const o=JSON.parse(txt);if(!o||!o.p)throw 0;Object.keys(o.p).forEach(id=>{const mine=S.p[id];if(!mine||(o.p[id].n||0)>(mine.n||0))S.p[id]=o.p[id];});const seen={};S.sims=(S.sims||[]).concat(o.sims||[]).filter(s=>{const k=s.d+'_'+s.n;if(seen[k])return false;seen[k]=1;return true;}).sort((a,b)=>a.d-b.d);if(o.extra)o.extra.forEach(q=>{if(!S.extra.some(x=>x.id===q.id))S.extra.push(q);});save();build();alert('Progrés importat.');render();}catch(x){alert('El text no és un progrés vàlid.');}}
/* ---------- accions ---------- */
const ACT={
 go:d=>go(d.v,{t:d.t}),
 sessio:()=>startRun('sessio',sessioIds(),'Sessió del dia'),
 infinit:()=>startRun('infinit',infinitBatch([],30),'Mode infinit'),
 exit:()=>{if(RUN&&(RUN.mode==='sim'||RUN.mode==='real')){if(confirm('Sortir sense corregir?'))go('home');return;}const any=RUN&&RUN.ids.some(id=>RUN.ans[id]&&RUN.ans[id].done);go(any?'runres':'home');},
 tema:d=>startRun('tema',shuffle(qsTema(d.t).map(q=>q.id)),'Tema '+d.t),
 errors:()=>startRun('errors',shuffle(errorIds()),'Repàs d\'errors'),
 opt:d=>{const k=+d.k;if(RUN.mode==='sim'||RUN.mode==='real'){const q=curQ();const a=RUN.ans[q.id]||(RUN.ans[q.id]={});a.sel=k;render();}else answer(k);},
 conf:d=>finish(d.c),
 next:()=>next(),
 simstart:()=>simStart(),
 simgo:d=>{RUN.i=+d.i;render();},
 simprev:()=>{if(RUN.i>0){RUN.i--;render();}},
 simnext:()=>{if(RUN.i+1<RUN.ids.length){RUN.i++;render();window.scrollTo(0,0);}else simFinish(false);},
 simblank:()=>{const q=curQ();if(RUN.ans[q.id])RUN.ans[q.id].sel=null;render();},
 simdub:()=>{const q=curQ();RUN.dub[q.id]=!RUN.dub[q.id];render();},
 realstart:d=>realStart(d.x),
 print:()=>window.print(),
 cfgsave:()=>{S.cfg.conf=$('#cConf').checked;S.cfg.theme=$('#cDark').checked?'dark':'light';S.cfg.nou=+$('#cNou').value||0;S.cfg.maxDue=+$('#cMax').value||60;S.cfg.focus=$('#cFocus').value||'all';save();applyTheme();render();},
 exp:async()=>{const json=JSON.stringify(S);const name='opo-progres-'+new Date().toISOString().slice(0,10)+'.json';
   try{if(navigator.canShare&&typeof File!=='undefined'){const f=new File([json],name,{type:'application/json'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Progrés OPO'});return;}}}catch(e){if(e&&e.name==='AbortError')return;}
   const blob=new Blob([json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);},
 copy:async()=>{const json=JSON.stringify(S);try{await navigator.clipboard.writeText(json);alert('Progrés copiat al porta-retalls.');}catch(e){const t=document.createElement('textarea');t.value=json;document.body.appendChild(t);t.select();try{document.execCommand('copy');alert('Progrés copiat al porta-retalls.');}catch(x){alert('No s\'ha pogut copiar. Fes servir Exporta.');}t.remove();}},
 impText:()=>{const t=$('#tImp');if(!t||!t.value.trim())return;importProgres(t.value);t.value='';},
 delextra:()=>{if(confirm('Esborrar les preguntes importades?')){S.extra=[];save();build();render();}},
 reset:()=>{if(confirm('Segur que vols esborrar tot el progrés? No es pot desfer.')){S.p={};S.sims=[];save();render();}}
};
document.body.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&ACT[a.dataset.a]){ACT[a.dataset.a](a.dataset,a);return;}const n=e.target.closest('[data-nav]');if(n){if(RUN&&(VIEW==='sim')&&!confirm('Sortir sense corregir?'))return;go(n.dataset.nav);}});
document.body.addEventListener('change',e=>{
  if(e.target.id==='fImp'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importProgres(r.result);r.readAsText(f);}
  if(e.target.id==='fQ'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const arr=JSON.parse(r.result);if(!Array.isArray(arr))throw 0;let n=0,bad=0;arr.forEach(q=>{if(q&&q.id&&q.q&&Array.isArray(q.op)&&q.op.length===4&&typeof q.c==='number'&&q.c>=0&&q.c<4&&q.t){if(!q.b)q.b=String(q.t).split('.')[0];if(!Array.isArray(q.ex)||q.ex.length!==4)q.ex=['','','',''];if(!BYID[q.id]&&!S.extra.some(x=>x.id===q.id)){S.extra.push(norm(q));n++;}}else bad++;});save();build();alert(n+' preguntes afegides'+(bad?' ('+bad+' descartades per format)':'')+'.');render();}catch(x){alert('El fitxer no és una llista de preguntes vàlida.');}};r.readAsText(f);}
});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;const k=e.key;
  if(VIEW==='quiz'){if(/^[1-4]$/.test(k)){const q=curQ();const o=RUN.ord[q.id];answer(o[+k-1]);}else if(k==='Enter'){const q=curQ();const a=RUN.ans[q.id];if(a&&a.done)next();else if(a&&a.sel!=null&&S.cfg.conf)finish('segur');}else if(/^[sS]$/.test(k))finish('segur');else if(/^[dD]$/.test(k))finish('dubte');else if(/^[aA]$/.test(k))finish('atzar');else if(k==='Escape'){ACT.exit();}}
  else if(VIEW==='sim'){if(/^[1-4]$/.test(k)){const q=curQ();const o=RUN.ord[q.id];ACT.opt({k:o[+k-1]});}else if(k==='Enter')ACT.simnext();else if(/^[dD]$/.test(k))ACT.simdub();else if(k==='Escape'){if(confirm(RUN.mode==='real'?'Abandonar l\'examen? No es corregirà.':'Abandonar el simulacre? No es corregirà.'))go('home');}}
});
function applyTheme(){document.documentElement.setAttribute('data-theme',S.cfg.theme==='dark'?'dark':'light');$('#bThema').textContent=S.cfg.theme==='dark'?'☀':'☾';}
$('#bThema').addEventListener('click',()=>{S.cfg.theme=S.cfg.theme==='dark'?'light':'dark';save();applyTheme();});
load();build();applyTheme();go('home');
})();
</script>
</body>
</html>
