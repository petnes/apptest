const FITXES={"1.1":["Valors superiors de l'ordenament: llibertat, justícia, igualtat i pluralisme polític. La dignitat de la persona és el fonament de l'ordre polític, no un valor superior.","Drets amb empara i procediment preferent i sumari: la igualtat, els de la secció 1a del capítol II (llibertat, intimitat, reunió, associació, educació, sindicació) i l'objecció de consciència. Els de la secció 2a tenen reserva de llei però no empara. Els principis rectors només s'invoquen segons les lleis que els despleguen.","Detenció preventiva: el temps estrictament necessari i com a màxim 72 hores. Habeas corpus: el jutge resol en 24 hores.","Suspensió individual (bandes armades i terrorisme): només poden afectar el termini de detenció, la inviolabilitat del domicili i el secret de les comunicacions, amb intervenció judicial i control parlamentari.","Estat d'alarma: el Govern, 15 dies, pròrroga amb autorització del Congrés. Excepció: autorització prèvia del Congrés, 30 dies prorrogables per 30 més. Setge: el Congrés per majoria absoluta a proposta exclusiva del Govern. Cap dels tres permet dissoldre el Congrés.","Corts: Congrés entre 300 i 400 diputats (350 per llei), Senat amb 4 senadors per província més els designats per les comunitats (1 fix més 1 per cada milió d'habitants). Legislatura de 4 anys.","Investidura: majoria absoluta en primera votació, simple 48 hores després; si en 2 mesos des de la primera votació no hi ha president, dissolució i eleccions. Moció de censura: la proposen 1/10 dels diputats amb candidat, cal majoria absoluta i no es vota abans de 5 dies. Qüestió de confiança: majoria simple.","Tribunal Constitucional: 12 membres (4 Congrés i 4 Senat per 3/5, 2 Govern, 2 Consell General del Poder Judicial), 9 anys, renovació per terços cada 3. Recurs d'inconstitucionalitat en 3 mesos (9 si hi ha comissió bilateral). Empara: 30 dies contra resolucions judicials, 20 contra actes administratius, esgotada la via judicial.","Defensor del Poble: alt comissionat de les Corts, elegit per 3/5 de cada cambra per 5 anys.","Reforma ordinària: 3/5 de cada cambra i referèndum només si el demanen 1/10 dels membres d'una cambra en 15 dies. Reforma agreujada (títol preliminar, secció 1a del capítol II del títol I, Corona): 2/3, dissolució, ratificació per les noves Corts amb 2/3 i referèndum obligatori.","Béns de domini públic: inalienabilitat, imprescriptibilitat i inembargabilitat."],"1.2":["L'Estatut és una llei orgànica (LO 6/2006). Reforma dels títols I i II: iniciativa d'1/5 dels diputats, del Govern o de 300.000 signatures; 2/3 del Parlament, ratificació de les Corts i referèndum. Resta de títols: 2/3 del Parlament, llei orgànica de les Corts i referèndum.","Llengües: el català és la llengua pròpia; català i castellà són oficials; l'occità (aranès a l'Aran) és llengua pròpia de l'Aran i oficial a Catalunya.","Parlament: entre 100 i 150 diputats (135 mentre no hi hagi llei electoral), 4 anys, sistema proporcional que assegura la representació de totes les zones del territori.","President: elegit pel Parlament d'entre els seus membres, nomenat pel Rei. Majoria absoluta a la primera votació, simple a la segona 48 hores després; si en 2 mesos des de la primera votació ningú és elegit, dissolució automàtica.","Moció de censura: 1/5 dels diputats amb candidat, majoria absoluta, no es vota abans de 5 dies. Qüestió de confiança: majoria simple.","Govern: president, conseller primer o vicepresident si n'hi ha, i consellers, nomenats i separats lliurement pel president. Cessa amb el president i continua en funcions.","Decret llei del Govern (art. 64): no pot afectar drets estatutaris, institucions, règim electoral ni pressupostos; el Parlament el convalida o deroga en 30 dies. Decret legislatiu (art. 63): llei de bases per a textos articulats, llei ordinària per a textos refosos.","Consell de Garanties Estatutàries: 9 juristes, 6 a proposta del Parlament per 3/5 i 3 del Govern, 9 anys no renovables, renovació per terços cada 3. Dictàmens no vinculants després de la STC 31/2010.","Síndic de Greuges: elegit per 3/5 del Parlament, 9 anys no renovables. Sindicatura de Comptes: 7 síndics per 3/5, 6 anys renovables; fiscalitza tot el sector públic.","Competències: exclusives (potestat legislativa, reglamentària i executiva íntegres), compartides (legislació i execució en el marc de les bases estatals) i executives (reglaments d'organització i execució).","Serveis bàsics a la comunitat: competència pròpia dels governs locals. Vegueria: àmbit territorial de la Generalitat i govern local; el consell de vegueria substitueix la diputació.","Comissió Bilateral Generalitat-Estat: composició paritària, presidència alternada per torns d'un any, plenari almenys dues vegades l'any."],"1.3":["Òrgans superiors de l'Administració de la Generalitat: el president, el conseller primer o la consellera primera, el vicepresident o la vicepresidenta i els consellers.","Els consellers són nomenats i separats lliurement pel president, per decret del president. Els secretaris generals, directors generals i delegats territorials són alts càrrecs; els subdirectors i caps de servei no ho són.","Cada departament té una secretaria general, sota la direcció del conseller, i s'organitza en direccions generals i, per sota, subdireccions generals, serveis, seccions i negociats.","Disposicions generals: el Govern les aprova per decret; els consellers, per ordre. El president dicta decrets del president (per exemple, nomenaments de consellers i estructura de departaments).","El Consell Tècnic, format pels secretaris generals, prepara els assumptes que ha de tractar el Govern. Les comissions delegades del Govern són òrgans col·legiats sectorials creats per decret del Govern.","Delegacions territorials del Govern: vuit (Barcelona, Girona, Lleida, Tarragona, Terres de l'Ebre, Catalunya Central, Alt Pirineu i Aran i Penedès, la més recent).","Sector públic instrumental: organismes autònoms (es creen per llei), entitats de dret públic sotmeses al dret privat, societats mercantils, consorcis i fundacions.","Consorcis: entitats de dret públic amb personalitat pròpia, de caràcter associatiu i naturalesa voluntària; es creen per conveni, no per llei.","Fundacions del sector públic: es constitueixen amb autorització prèvia del Govern; les societats mercantils es creen per acord del Govern.","El personal eventual fa funcions de confiança o assessorament especial; cessa quan cessa l'autoritat que el va nomenar."],"1.4":["Tractats: Roma 1957 (CEE i Euratom), Maastricht 1992 (crea la Unió i la ciutadania europea), Amsterdam 1997, Niça 2001 i Lisboa 2007 (en vigor l'1 de desembre de 2009: TUE i TFUE). Espanya hi és membre des de l'1 de gener de 1986.","Principis: atribució (la Unió actua només dins les competències atribuïdes), subsidiarietat (fora de les competències exclusives, intervé només si els Estats no poden assolir suficientment els objectius) i proporcionalitat.","Parlament Europeu: 720 diputats des de 2024 (Espanya, 61), 5 anys, sufragi universal directe; elegeix el president de la Comissió i el Defensor del Poble Europeu.","Consell Europeu: caps d'Estat o de Govern; president elegit per 2 anys i mig, renovable una vegada; no legisla. Consell (de ministres): presidència rotatòria de 6 mesos.","Majoria qualificada al Consell: 55 % dels Estats (15 de 27) que representin el 65 % de la població; minoria de bloqueig d'almenys 4 Estats.","Comissió: 27 membres, 5 anys; el Consell Europeu proposa el president tenint en compte les eleccions europees i el Parlament l'elegeix per majoria dels seus membres; té la iniciativa legislativa.","Tribunal de Justícia: 27 jutges i 11 advocats generals; Tribunal General: 2 jutges per Estat; mandats de 6 anys renovables. Tribunal de Comptes: un membre per Estat, 6 anys.","Reglament: obligatori en tots els elements i directament aplicable. Directiva: obliga quant al resultat i cal transposar-la; si no es transposa a temps pot tenir efecte directe vertical (contra l'Estat), mai contra un particular. Decisió: obligatòria per als destinataris. Recomanacions i dictàmens: no vinculants.","Procediment legislatiu ordinari: proposta de la Comissió; Parlament i Consell colegisladors, fins a tres lectures i comitè de conciliació.","Carta dels Drets Fonamentals: mateix valor jurídic que els tractats; vincula els Estats només quan apliquen el dret de la Unió.","Iniciativa ciutadana europea: un milió de signatures d'almenys 7 Estats. Retirada (art. 50 TUE): els tractats deixen d'aplicar-se 2 anys després de la notificació si no hi ha acord, llevat de pròrroga unànime del Consell Europeu.","Zona euro: 21 Estats des de l'1 de gener de 2026, amb l'entrada de Bulgària. BCE: Comitè Executiu de 6 membres amb mandat de 8 anys no renovable."],"1.5":["Principis: unitat jurisdiccional, exclusivitat, independència, inamovibilitat, responsabilitat i submissió a la llei. Prohibició de tribunals d'excepció; jurisdicció militar només en l'àmbit castrense i en estat de setge.","Consell General del Poder Judicial: 20 vocals (12 jutges i magistrats, 8 juristes) i el president del Tribunal Suprem, que el presideix; mandat de 5 anys.","Tribunal Suprem: cim de l'organització judicial. Audiència Nacional. Tribunals superiors de justícia: culminen l'organització a cada comunitat sense perjudici del Suprem. Audiències provincials.","LO 1/2025: els jutjats unipersonals passen a ser seccions dels tribunals d'instància (civil, instrucció, contenciosa administrativa, social...), i els jutjats de pau es converteixen en oficines de justícia al municipi. En els litigis civils i mercantils cal acreditar un intent de solució (MASC) abans de la demanda.","Jurat: 9 jurats i 2 suplents, presidit per un magistrat; 7 vots per declarar provat un fet desfavorable o la culpabilitat, 5 per la inculpabilitat.","Ministeri Fiscal: promou l'acció de la justícia; principis d'unitat d'actuació i dependència jeràrquica, legalitat i imparcialitat. Fiscal General: nomenat pel Rei a proposta del Govern, oït el Consell General del Poder Judicial; 4 anys no renovables.","Tribunal Superior de Justícia de Catalunya: el president el nomena el Rei a proposta del Consell General del Poder Judicial. Fiscal superior de Catalunya: el nomena el Govern de l'Estat a proposta del Fiscal General.","Policia judicial: auxilia jutges, tribunals i Ministeri Fiscal en la investigació del delicte; els funcionaris de les unitats adscrites no poden ser apartats d'una investigació sense autorització del jutge o del fiscal.","Habeas corpus: davant el jutge d'instrucció, resolució en 24 hores. Justícia gratuïta per a qui acredita insuficiència de recursos.","L'ordre contenciós administratiu controla la potestat reglamentària i la legalitat de l'actuació administrativa, i coneix de la responsabilitat patrimonial de l'Administració encara que hi participin particulars.","La Generalitat té competències sobre els mitjans materials i personals de l'Administració de justícia i sobre la justícia de pau."],"1.6":["Principis de l'art. 9.3 CE: legalitat, jerarquia normativa, publicitat de les normes, irretroactivitat de les sancionadores no favorables o restrictives de drets, seguretat jurídica, responsabilitat i interdicció de l'arbitrarietat.","Llei orgànica: drets fonamentals i llibertats públiques, estatuts d'autonomia, règim electoral general i les altres previstes a la Constitució; majoria absoluta del Congrés en una votació final sobre el conjunt.","Decret llei estatal: extraordinària i urgent necessitat; no pot afectar institucions bàsiques, drets del títol I, règim de les comunitats ni dret electoral general; el Congrés el convalida o deroga en 30 dies i pot tramitar-lo com a projecte de llei per urgència.","Decret legislatiu: llei de bases per a text articulat, llei ordinària per a text refós; termini fixat, sense subdelegació.","Iniciativa legislativa popular estatal: 500.000 signatures, exclosa en matèria de llei orgànica, tributària, internacional i gràcia. A Catalunya: 50.000 signatures i poden signar les persones majors de 16 anys.","Lleis de l'art. 150 CE: llei marc (normes autonòmiques dins de principis estatals), llei orgànica de transferència o delegació, i llei d'harmonització (majoria absoluta de cada cambra per apreciar la necessitat).","Tractats: llei orgànica per atribuir competències a organitzacions internacionals; autorització de les Corts per als tractats polítics, militars, que afecten la integritat territorial o drets fonamentals, obligacions financeres o modifiquin lleis; la resta, informació a les Corts.","Lleis catalanes: les promulga el president en nom del Rei i es publiquen al DOGC i al BOE; per a l'entrada en vigor regeix la data del DOGC. Si no diuen res, entren en vigor als 20 dies.","Decret llei català: convalidació pel Parlament en 30 dies; el projecte del Govern s'anomena projecte de llei i el dels diputats, proposició de llei.","Potestat reglamentària de la Generalitat: memòria general, memòria d'avaluació d'impacte, informe jurídic, audiència de 15 dies (reduïble a 7 per causa motivada), informació pública, dictamen de la Comissió Jurídica Assessora per als reglaments que despleguen lleis (preceptiu, no vinculant).","Un reglament que contradiu una llei o regula matèria reservada a la llei és nul de ple dret. La llei de pressupostos no pot crear tributs."],"A.1":["LO 1/2025, d'eficiència del servei públic de justícia: tribunals d'instància amb seccions en lloc de jutjats unipersonals, oficines de justícia al municipi en lloc de jutjats de pau, i intent de MASC obligatori abans de la demanda civil o mercantil (en vigor des del 3 d'abril de 2025).","LO 5/2024, d'11 de novembre, del dret de defensa: desenvolupa el dret fonamental de defensa (art. 24 CE) en tots els ordres jurisdiccionals.","Llindars de contractació harmonitzada vigents en el bienni 2024-2025: obres i concessions 5.538.000 euros. Comprova els del bienni 2026-2027 abans de l'examen.","Bulgària entra a la zona euro l'1 de gener de 2026: 21 Estats membres amb l'euro.","Reglament (UE) 2024/1183: cartera europea d'identitat digital (modifica el Reglament eIDAS 910/2014).","Revisa abans de l'examen: titulars d'Interior i Seguretat Pública, de la Direcció General de la Policia i el comissari o comissària en cap; modificacions de la Llei 10/1994 (carrera professional horitzontal); decrets d'agilització dels processos selectius de novembre de 2025."],"E.1":["ADN: doble hèlix de cadenes antiparal·leles (5' a 3'), enllaços fosfodièster entre el fosfat i el carboni 3' de la desoxiribosa; A aparella amb T (2 ponts d'hidrogen) i G amb C (3). ARN: ribosa amb 2'-OH (més làbil, s'hidrolitza en medi alcalí), uracil en lloc de timina, majoritàriament monocatenari.","Genoma nuclear haploide: uns 3.200 milions de parells de bases; el diploide pesa uns 6,6 pg (1 ng equival a unes 150 cèl·lules diploides). Només un 1,5 % codifica proteïnes; més de la meitat és ADN repetitiu (Alu al voltant de l'11 %, LINE-1 del 17 %).","ADN mitocondrial: 16.569 pb, circular, 37 gens, herència materna, sense recombinació, centenars o milers de còpies per cèl·lula; ideal per a mostres degradades, però amb poc poder de discriminació i possible heteroplàsmia.","Polimorfisme: variant amb freqüència d'almenys l'1 % a la població. De seqüència (SNP, biallèlic, un cada 1.000 pb aproximadament) o de longitud (indel, STR o microsatèl·lit de 2 a 7 pb, VNTR o minisatèl·lit de 10 a 100 pb).","Els STR s'analitzen per longitud (PCR i electroforesi capil·lar) i són el marcador estàndard d'identificació; els VNTR es van analitzar per RFLP (Jeffreys, 1985) i necessitaven micrograms d'ADN íntegre.","Herència: STR autosòmics codominants i mendelians; Y-STR en haplotip patern sense recombinació (fora de les regions pseudoautosòmiques); ADNmt matern; X-STR amb herència pròpia (els homes transmeten l'X a les filles).","Taxes de mutació: STR de l'ordre de 10^-3 per generació (0,1 a 0,3 %), SNP d'uns 10^-8, més altes a la regió control de l'ADNmt; per això els STR serveixen per identificar i els SNP per a llinatge, ancestralitat i fenotip.","Amelogenina: AMELX i AMELY difereixen en 6 pb (106 i 112 pb en els kits clàssics); la deleció d'AMELY en alguns homes dona un fals perfil femení: confirma el sexe amb Y-STR o SRY.","ARN forense: mARN i miARN específics de fluid (HBB o ALAS2 per a sang, PRM1 i PRM2 per a semen, HTN3 i STATH per a saliva, MUC4 per a fluid vaginal, MMP7 i MMP10 per a sang menstrual) i com a marcador temporal.","Epigenètica: la metilació de CpG (per exemple ELOVL2, FHL2, KLF14) estima l'edat amb errors d'uns 3 a 5 anys i permet distingir bessons monozigòtics, que comparteixen el perfil STR; les mutacions postzigòtiques es detecten amb seqüenciació de genoma complet.","Cromatina: l'ADN s'enrotlla en nucleosomes de 147 pb; la degradació deixa fragments d'uns 150 pb, d'aquí els miniSTR i els SNP per a mostres compromeses.","LO 10/2007: la base de dades policial només inscriu identificadors obtinguts de l'ADN no codificant que revelin exclusivament identitat i sexe."],"E.2":["STR o microsatèl·lit: unitat de repetició de 2 a 7 pb; els tetranucleòtids són el patró forense perquè fan menys stutter i es resolen bé; els pentanucleòtids (Penta D, Penta E) encara menys stutter.","Tipus: simple (una sola unitat, TH01), compost (dues o més unitats adjacents, vWA, D12S391), complex (blocs de diferents unitats amb seqüències intercalades, D21S11) i complex hipervariable (SE33).","Nomenclatura ISFG: l'al·lel es designa pel nombre d'unitats completes; si hi ha una repetició incompleta, nombre de repeticions més punt més bases sobrants (TH01 9.3: 9 repeticions AATG i 3 bases per una A perduda a la setena unitat).","Criteris de selecció: heterozigositat alta, al·lels discrets i ben separats, stutter baix, amplicó curt, absència de lligament amb malalties i loci en cromosomes diferents, taxa de mutació baixa, robustesa en múltiplex i reproduïbilitat entre laboratoris.","Stutter: producte n-1 (4 pb menys en tetranucleòtids) per lliscament de la polimerasa, normalment per sota del 15 % de l'al·lel; puja amb al·lels llargs i amb unitats curtes (D22S1045 és trinucleòtid i en fa molt); el n+1 és petit (1 a 2 %).","CODIS: 13 loci originals (CSF1PO, FGA, TH01, TPOX, vWA, D3S1358, D5S818, D7S820, D8S1179, D13S317, D16S539, D18S51, D21S11) i 20 des de l'1 de gener de 2017 (més D1S1656, D2S441, D2S1338, D10S1248, D12S391, D19S433, D22S1045).","ESS europeu: 12 loci (els 7 originals D3S1358, D8S1179, D18S51, D21S11, FGA, TH01, vWA més els 5 miniSTR de 2009: D1S1656, D2S441, D10S1248, D12S391, D22S1045); ISSOL d'Interpol = ESS més amelogenina.","Loci lligats: vWA i D12S391 al cromosoma 12 (importa en parentiu, no en la identificació d'individus no relacionats); CSF1PO i D5S818 al 5; TPOX, D2S441 i D2S1338 al 2; D21S11 i Penta D al 21.","Localització gènica: TH01 a l'intró 1 de la tirosina hidroxilasa, vWA a l'intró 40 del factor de von Willebrand, FGA a l'intró 3 del fibrinogen alfa, TPOX a l'intró 10 de la peroxidasa tiroidal, CSF1PO a l'intró 6 de CSF1R.","Mutació: uns 0,1 a 0,3 % per locus i generació, majoritàriament d'una unitat i sobretot paterna (3 o 4 vegades més); FGA i SE33 són dels més mutables, TPOX dels menys. Una sola exclusió en paternitat no exclou: es calcula amb la taxa de mutació.","Al·lels nuls: una mutació al lloc d'unió de l'encebador fa que un heterozigot sembli homozigot; es detecten per discordança entre kits amb encebadors diferents. Microvariants i al·lels fora d'escala (OL): cal confirmar-los en una segona amplificació.","Patrons trial·lèlics: tipus 1 (tres pics desiguals, la suma de dos iguala el tercer: mosaïcisme somàtic) i tipus 2 (tres pics equilibrats: duplicació o trisomia germinal).","Seqüenciació massiva: descobreix isoal·lels (mateixa longitud, seqüència diferent) sobretot a D12S391, D21S11, D2S1338 i D1S1656, i augmenta l'heterozigositat; nomenclatura entre claudàtors (STRSeq, ISFG 2016)."],"E.3":["SNP: substitució d'una base, majoritàriament biallèlic; transicions (purina-purina o pirimidina-pirimidina) el doble de freqüents que transversions; un cada 1.000 pb; taxa de mutació d'uns 10^-8, per això és estable en llinatges i parentiu.","Quatre categories forenses (Budowle i van Daal): SNP d'identitat (IISNP, alta heterozigositat i baixa diferència entre poblacions), d'ancestralitat (AISNP, freqüències molt diferents entre poblacions), de fenotip (PISNP: HIrisPlex-S per a ulls, cabell i pell) i de llinatge (LISNP: Y i ADNmt).","Poder de discriminació: un SNP biallèlic informa molt menys que un STR; calen uns 40 a 60 SNP per igualar 13 a 15 STR. Panells clàssics: SNPforID 52-plex, els 45 IISNP de Kidd; MPS: ForenSeq (94 iiSNP, 56 aiSNP, 22 piSNP), Precision ID Identity (90 autosòmics i 34 Y) i Ancestry (165 aiSNP).","Avantatges: amplicons molt curts (menys de 100 pb) per a ADN degradat, sense stutter, baixa mutació, automatitzables per MPS. Inconvenients: interpretació de mescles difícil (només dos al·lels), sense escala al·lèlica, bases de dades policials basades en STR.","Detecció: minisequenciació o extensió d'una sola base (SNaPshot, detecció en electroforesi capil·lar), sondes TaqMan, microarrays d'alta densitat (centenars de milers de SNP) i seqüenciació massiva.","Indels: insercions o delecions curtes, biallèliques i analitzables per longitud (Investigator DIPplex, 30 marcadors); útils en ADN degradat i com a complement dels STR.","Microhaplotips: blocs de 2 a 4 SNP en menys de 300 pb heretats en bloc; multial·lèlics, sense stutter, bons per a mescles, parentiu i ancestralitat.","Genealogia genètica forense: perfils de 500.000 o més SNP obtinguts per array o seqüenciació, comparats en bases de dades de genealogia (segments d'ADN compartit en centimorgans) per trobar parents llunyans del donant; cas del Golden State Killer (2018). A Espanya, els límits de la LO 10/2007 (no codificant, identitat i sexe) en condicionen l'ús.","Y-SNP: defineixen haplogrups amb nomenclatura d'arbre (ISOGG) i complementen els Y-STR per a origen biogeogràfic; els SNP mitocondrials defineixen haplogrups d'ADNmt.","Aplicacions: identificació de restes degradades i víctimes múltiples, parentiu complex i llunyà, ancestralitat i fenotip per a intel·ligència investigativa, discriminació de bessons monozigòtics (mutacions rares)."],"E.4":["PCR (Mullis, 1983): amplificació exponencial d'una regió delimitada per dos encebadors; en teoria 2^n còpies, a la pràctica menys per pèrdua d'eficiència. 28 a 30 cicles en STR; cada cicle desnaturalització (94 a 95 °C), hibridació (55 a 65 °C) i extensió (72 °C).","Components: ADN motlle, encebadors, dNTP, Mg2+ (cofactor essencial: si falta o hi ha EDTA baixa el rendiment), tampó i polimerasa termoestable (Taq de Thermus aquaticus). Hot start (AmpliTaq Gold, activació a 95 °C) evita productes inespecífics.","Quantitat òptima de motlle: 0,5 a 1 ng (unes 75 a 150 cèl·lules). Per sota d'uns 100 a 125 pg apareixen efectes estocàstics: desequilibri d'heterozigots, pèrdua d'al·lels (drop-out) i stutter elevat. Per sobre: saturació, pull-up i pics dividits.","Múltiplex: encebadors amb temperatures de fusió semblants (uns 60 °C), amplicons de mides que no se solapin dins de cada color, sense dímers d'encebadors ni hibridació creuada; cada locus marcat amb un fluorocrom (FAM, VIC, NED, PET, més el patró LIZ) en química de 5 o 6 colors.","Kits: GlobalFiler (24 marcadors: 21 STR autosòmics, DYS391, indel Y i amelogenina), PowerPlex Fusion 6C (27 marcadors), Investigator 24plex QS amb sensor de qualitat (QS) que distingeix inhibició de degradació.","Artefactes propis de la PCR: stutter per lliscament, adenilació no del tot completa (pic -A dividit: cal extensió final a 60 °C), al·lels nuls per mutació en el lloc d'unió de l'encebador, pics inespecífics.","Inhibidors: hematina (sang), àcid húmic (sòl), indi (texans), col·lagen (os), melanina, sals i EDTA. Es detecten amb l'IPC de la qPCR i es combaten amb BSA, dilució, més polimerasa o purificació addicional.","Controls obligatoris a cada tanda: control positiu (ADN de referència 9947A o 2800M), control negatiu (sense ADN) i blanc de reactius de l'extracció; la ladder al·lèlica no és un control d'amplificació.","Variants: PCR directa (sense extracció, per a referències en FTA), PCR ràpida (cicles curts, sistemes RapidHIT), miniSTR (encebadors més a prop de la repetició per a amplicons de menys de 150 pb), PCR a temps real per quantificar.","Prevenció de contaminació: àrees separades pre-PCR i post-PCR, flux unidireccional, UV i lleixiu, guants i mascareta, base de dades d'eliminació del personal."],"E.5":["Fonament: l'ADN, carregat negativament, migra cap a l'ànode a través d'un polímer (POP-4 o POP-7) dins d'un capil·lar de 36 o 50 cm; els fragments curts migren més de pressa. Detecció per fluorescència induïda per làser a la finestra del capil·lar.","Injecció electrocinètica: entra una fracció de la mostra en funció del voltatge i el temps; les sals competeixen amb l'ADN (menys senyal) i el formamida Hi-Di desnaturalitza. Augmentar temps o voltatge d'injecció fa pujar el senyal en mostres pobres.","Cada mostra porta un patró de mides intern (GeneScan 500 o 600 LIZ) i cada tanda una escala al·lèlica; la mida es calcula per Local Southern i l'al·lel s'assigna per comparació amb la ladder dins de finestres de ±0,5 pb.","Calibratge espectral (matriu): separa la contribució de cada fluorocrom als altres canals; una matriu dolenta provoca pull-up. Els instruments 3130 i 3500 (Applied Biosystems); el 3500 normalitza les altures i té sostre de saturació d'uns 30.000 RFU.","Llindars: analític (uns 50 RFU, per damunt del soroll: el pic és real) i estocàstic (uns 150 a 200 RFU: per sota pot faltar l'al·lel germà). Balanç d'heterozigots (PHR) esperat per sobre del 60 %.","Artefactes: pull-up o bleed-through (pic petit al mateix lloc en un altre color per saturació), spikes (pics estrets en tots els colors, elèctrics o partícules), dye blobs (fluorocrom lliure, pics amples cap als 100 a 150 pb), pics -A, stutter, línia de base elevada, pics dividits per sobreamplificació.","Anomalies de migració: la temperatura i el polímer canvien la mobilitat; els al·lels es reassignen sempre amb la ladder de la mateixa tanda; els fluorocroms afecten la mobilitat, per això cal la mateixa química a mostra i ladder.","Resolució d'una base (necessària per distingir 9.3 de 10 a TH01); temps d'anàlisi de 30 a 45 minuts; capil·lars de 4, 8, 24 o 96 en paral·lel.","Interpretació: al·lels fora de finestra (OL) es confirmen reinjectant o reamplificant; els al·lels fora de l'escala es designen per mida; els pics de menys del 15 % en posició n-1 s'atribueixen a stutter.","Limitacions: només mida (no seqüència), rang dinàmic limitat, sensibilitat a sals i degradació, necessitat de reamplificar per sota del llindar estocàstic."]};
const PREGUNTES=[{"id":"R871-01","b":"1","t":"1.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 1","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":1,"k":"teoria","tr":"competencia","q":"L'ordenació i la prestació de serveis bàsics a la comunitat és una competència:","op":["Compartida entre la Generalitat de Catalunya i l'Estat.","Delegada a la Generalitat de Catalunya.","Exclusiva de la Generalitat de Catalunya.","Dels governs local de Catalunya."],"c":3,"ex":["L'Estatut no la reparteix entre Generalitat i Estat: la situa en el nivell local.","No és una competència delegada a la Generalitat: és pròpia dels ens locals.","No és exclusiva de la Generalitat, que només en fixa el marc.","L'Estatut atribueix als governs locals l'ordenació i la prestació dels serveis bàsics a la comunitat."],"clau":"Serveis bàsics a la comunitat: els presten i ordenen els governs locals.","ref":"art. 84.2 EAC"},{"id":"R871-02","b":"1","t":"1.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 2","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":2,"k":"teoria","tr":"composicio","q":"D'acord amb l'Estatut d'autonomia de Catalunya, el Consell de Garanties Estatutàries està format per:","op":["Juristes de reconeguda competència 2/3 dels quals són designats a proposta del Parlament (per majoria de 3/5 dels diputats) i el 1/3 restant, a proposta del Govern.","Juristes de reconeguda competència, 1/3 dels quals són juristes designats a proposta del Parlament (per majoria de 2/5 dels diputats) i els 2/3 restants, a proposta del Govern.","Juristes de reconeguda competència nomenats a proposta del President del Govern i del President del Parlament de Catalunya.","Juristes de reconeguda competència designats a proposta del Parlament de Catalunya, per majoria simple dels diputats."],"c":0,"ex":["Nou juristes: sis (dos terços) a proposta del Parlament per tres cinquenes parts, i tres (un terç) a proposta del Govern.","Inverteix les proporcions i la majoria és de 3/5, no de 2/5.","Els proposen el Parlament i el Govern, no els presidents.","Cal majoria de tres cinquenes parts, no majoria simple, i el Govern en proposa un terç."],"clau":"CGE: 9 juristes, 6 del Parlament per 3/5 i 3 del Govern.","ref":"art. 77 EAC; Llei 2/2009"},{"id":"R871-03","b":"1","t":"1.5","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 3","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":3,"k":"teoria","tr":"concepte","q":"D'acord amb la Llei orgànica 1/2025, de 2 de gener, de mesures en matèria d'eficiència del servei públic de justícia, els jutjats contenciosos administratius s'han reconvertit en:","op":["Jutjats especialitzats contenciosos administratius.","Sales contencioses administratives.","Seccions contencioses administratives dels tribunals d'instància.","Tribunals d'instància."],"c":2,"ex":["Els jutjats unipersonals desapareixen com a tals; no es mantenen com a jutjats especialitzats.","Les sales són pròpies dels tribunals superiors i de l'Audiència Nacional, no dels antics jutjats.","La reforma converteix cada jutjat en una secció del tribunal d'instància del partit judicial.","El tribunal d'instància és l'òrgan que engloba totes les seccions; l'antic jutjat és una secció."],"clau":"LO 1/2025: jutjat unipersonal = secció d'un tribunal d'instància.","ref":"LO 1/2025, d'eficiència del servei públic de justícia","rev":"Comprova abans de l'examen si hi ha novetats organitzatives posteriors"},{"id":"R871-04","b":"3","t":"3.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 4","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":4,"k":"cas","tr":"efecte","q":"Si mentre es tramita un procediment sancionador es té constància que hi ha un procés penal en curs, cal:","op":["La suspensió del procediment sancionador, atesa la prioritat de l'ordre penal.","Continuar amb la tramitació del procediment sancionador.","Tancar el procediment sancionador.","Continuar la tramitació del procediment sancionador i, un cop finalitzat, suspendre'n l'execució del resultat."],"c":0,"ex":["La prejudicialitat penal obliga a suspendre l'administratiu fins que acabi el penal, per evitar dues sancions pels mateixos fets.","Continuar exposaria a vulnerar el principi non bis in idem.","No es tanca: es suspèn i es reprèn segons el que resolgui el jutge penal.","No s'ha de continuar fins al final; la suspensió és de la tramitació."],"clau":"Penal i sancionador pels mateixos fets: el penal mana i l'administratiu espera.","ref":"art. 31 LRJSP; STC 77/1983 (non bis in idem)"},{"id":"R871-05","b":"3","t":"3.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 5","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":5,"k":"teoria","tr":"termini","q":"De conformitat amb la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques, les persones interessades poden sol·licitar l'inici d'un procediment de responsabilitat patrimonial:","op":["En qualsevol moment.","En el termini màxim de 6 mesos.","Quan no hagi prescrit el seu dret a reclamar.","En el termini de 18 mesos."],"c":2,"ex":["Hi ha un límit: el dret a reclamar prescriu.","Sis mesos és el termini per resoldre el procediment, no per iniciar-lo.","El dret a reclamar prescriu a l'any del fet o de la manifestació del dany; dins d'aquest termini es pot sol·licitar.","No existeix cap termini de 18 mesos en aquest procediment."],"clau":"Reclamar: mentre no hagi prescrit (un any); resoldre: sis mesos.","ref":"arts. 67.1 i 91.3 LPAC"},{"id":"R871-06","b":"4","t":"4.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 6","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":6,"k":"teoria","tr":"concepte","q":"El Sistema Europeu de Comptes (SEC) inclou:","op":["Els pressupostos de tots els estats membres de la Unió Europea.","Una metodologia (Annex A) i un programa (Annex B).","Les despeses de tots els estats de la Unió Europea.","Només els comptes regionals dels estats de la Unió Europea."],"c":1,"ex":["El SEC no recull pressupostos: és un sistema comptable comú.","El Reglament del SEC 2010 conté la metodologia a l'annex A i el programa de transmissió de dades a l'annex B.","No és un recull de despeses.","Cobreix comptes nacionals i regionals, no només els regionals."],"clau":"SEC 2010: annex A metodologia, annex B programa de transmissió.","ref":"Reglament (UE) 549/2013 (SEC 2010)"},{"id":"R871-07","b":"6","t":"6.8","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 7","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":7,"k":"cas","tr":"requisit","q":"Si un tractament de dades personals pot comportar un risc alt per als drets i les llibertats de les persones físiques, abans de fer-lo, el responsable del tractament:","op":["Ha d'avaluar l'impacte de les operacions de tractament.","Ha d'incloure aquest risc al registre d'activitats de tractament.","Ha de formalitzar un encàrrec del tractament.","S'ha d'adherir a un dels codis de conducta regulats per l'article 40 del Reglament general de protecció de dades."],"c":0,"ex":["Risc alt per als drets i llibertats: avaluació d'impacte prèvia, i consulta a l'autoritat si el risc persisteix.","El registre d'activitats és una obligació general, no la resposta específica al risc alt.","L'encàrrec només cal si intervé un encarregat.","L'adhesió a codis de conducta és voluntària."],"clau":"Risc alt = avaluació d'impacte abans de tractar.","ref":"arts. 35 i 36 RGPD"},{"id":"R871-08","b":"1","t":"1.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 8","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":8,"k":"teoria","tr":"negacio","q":"D'acord amb la normativa de sector públic instrumental de la Generalitat Catalunya, quina de les opcions següents referida als consorcis NO és certa?","op":["Sempre es constitueixen per llei, que n'ha de determinar les funcions, els recursos econòmics assignats, les bases de l'organització i el règim jurídic.","Són entitats de dret públic amb personalitat jurídica pròpia.","Tenen caràcter associatiu i naturalesa voluntària.","Tenen capacitat per crear i gestionar serveis i dur a terme activitats i obres."],"c":0,"ex":["Els consorcis es creen per conveni entre les entitats consorciades, amb autorització del Govern, no per llei; per això és l'afirmació falsa.","Cert: són entitats de dret públic amb personalitat jurídica pròpia.","Cert: neixen de l'associació voluntària d'administracions o entitats.","Cert: poden crear i gestionar serveis, activitats i obres d'interès comú."],"clau":"Organisme autònom per llei; consorci per conveni.","ref":"arts. 113 a 115 Llei 26/2010; art. 118 LRJSP"},{"id":"R871-09","b":"6","t":"6.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 9","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":9,"k":"teoria","tr":"concepte","q":"Com s'anomena la teoria que descriu una cadena d'hipòtesis segons la qual els recursos assignats a una intervenció permeten desenvolupar activitats que produeixen determinats productes, els quals, al seu torn, generen beneficis a curt, mitjà i llarg termini sobre la societat en conjunt o sobre la població objectiu d'una política o programa?","op":["Teoria causal adequada.","Teoria del cicle de les polítiques públiques.","Teoria de l'elecció o opció pública.","Teoria del canvi de les intervencions públiques."],"c":3,"ex":["Nom inventat, no és una teoria d'avaluació.","El cicle de les polítiques descriu fases (agenda, formulació, implementació, avaluació), no la cadena recursos-resultats.","La public choice és una teoria econòmica sobre el comportament dels actors públics.","La teoria del canvi encadena recursos, activitats, productes i resultats a curt, mitjà i llarg termini."],"clau":"Recursos, activitats, productes, resultats: teoria del canvi.","ref":"Guia d'avaluació de polítiques públiques (Ivàlua)"},{"id":"R871-10","b":"2","t":"2.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 10","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":10,"k":"teoria","tr":"concepte","q":"D'acord amb l'article 8 de la Llei 40/2015, d'1 d'octubre, de règim jurídic del sector públic, la competència:","op":["És intransferible i l'han d'exercir els òrgans administratius que la tinguin atribuïda com a pròpia, excepte en els casos de delegació o avocació si s'efectuen en els termes que preveu aquesta Llei o d'altres.","És ineludible i l'han d'exercir els òrgans administratius que la tinguin atribuïda com a pròpia, excepte en els casos de delegació o avocació si s'efectuen en els termes que preveu aquesta Llei o d'altres.","És irrenunciable i l'han d'exercir els òrgans administratius que la tinguin atribuïda com a pròpia, excepte en els casos de delegació o avocació si s'efectuen en els termes que preveu aquesta Llei o d'altres.","És irrevocable i l'han d'exercir els òrgans administratius que la tinguin atribuïda com a pròpia, excepte en els casos de delegació o avocació si s'efectuen en els termes que preveu aquesta Llei o d'altres."],"c":2,"ex":["Es pot delegar i avocar, per tant no és estrictament intransferible.","Terme que la llei no fa servir.","La llei diu literalment que la competència és irrenunciable, amb l'excepció de la delegació i l'avocació.","Les atribucions es poden modificar per norma; no és irrevocable."],"clau":"Competència: irrenunciable, però delegable i avocable.","ref":"art. 8.1 LRJSP"},{"id":"R871-11","b":"1","t":"1.6","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 11","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":11,"k":"teoria","tr":"encreuament","q":"En el procediment d'elaboració de disposicions de caràcter general de l'Administració de la Generalitat, el tràmit d'audiència als ciutadans:","op":["S'ha d'atorgar quan el projecte afecti els seus drets o interessos legítims; es pot ometre per raons greus d'interès públic degudament justificades i el termini per formular al·legacions no pot ser inferior a 10 dies, reduïble a 5 dies per causa motivada.","S'ha de concedir en tots els casos, amb un termini mínim de 15 dies improrrogables i sense possibilitat de reducció.","S'ha d'atorgar quan el projecte afecti els seus drets o interessos legítims; es pot ometre per raons greus d'interès públic degudament justificades i el termini per formular al·legacions no pot ser inferior a 15 dies, reduïble a 7 dies per causa motivada.","S'ha de concedir en qualsevol cas, amb un termini mínim de 10 dies improrrogables i sense possibilitat de reducció."],"c":2,"ex":["Els terminis no són de 10 i 5 dies.","No és obligatori en tots els casos: es pot ometre per raons greus d'interès públic.","Audiència quan afecta drets o interessos legítims, ometible per raons greus d'interès públic, mínim 15 dies reduïbles a 7 per causa motivada.","Ni és sempre obligatori ni el mínim és de 10 dies."],"clau":"Audiència en reglaments: 15 dies, reduïbles a 7.","ref":"art. 67 Llei 26/2010"},{"id":"R871-12","b":"6","t":"6.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 12","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":12,"k":"teoria","tr":"encreuament","q":"En l'àmbit de l'Administració de la Generalitat, els estàndards mínims de qualitat declarats en les cartes de serveis són exigibles a l'Administració quan el servei es presta en condicions normals, sense pertorbacions alienes que n'alterin el funcionament. Això no obstant, si concorren raons excepcionals sobrevingudes que afecten el funcionament del servei de manera extraordinària:","op":["S'han de suspendre els estàndards mínims de qualitat declarats a la carta i els drets que en deriven directament fins que el servei no torni a prestar-se en condicions normals.","No es pot suspendre cap dels estàndards mínims de qualitat declarats a la carta ni els drets que en deriven directament.","Es poden suspendre temporalment un o alguns dels estàndards mínims de qualitat declarats a la carta, però no els drets que en deriven directament. La suspensió es fa efectiva per resolució motivada del titular de la unitat del departament o departaments que van aprovar la carta.","Es poden suspendre temporalment un o alguns dels estàndards mínims de qualitat declarats a la carta i els drets que en deriven directament. La suspensió es fa efectiva per resolució motivada del titular del departament o departaments que van aprovar la carta."],"c":3,"ex":["La suspensió no és obligatòria ni total: és una possibilitat, d'un o alguns estàndards.","Sí que es poden suspendre temporalment.","Es poden suspendre també els drets que deriven dels estàndards, i la resolució és del titular del departament, no de la unitat.","Suspensió temporal, parcial, d'estàndards i drets, per resolució motivada del titular del departament que va aprovar la carta."],"clau":"Carta de serveis en crisi: suspensió temporal d'estàndards i drets per resolució del conseller.","ref":"Normativa de cartes de serveis de la Generalitat (art. 59 Llei 19/2014 i desplegament)"},{"id":"R871-13","b":"2","t":"2.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 13","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":13,"k":"teoria","tr":"termini","q":"D'acord amb la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques, quina és l'opció correcta en relació amb els terminis de notificació dels actes administratius?","op":["Les notificacions s'han de practicar en el termini màxim de 10 dies hàbils des de la data en què s'ha dictat l'acte.","El termini per practicar la notificació és de 10 dies naturals des de la data en què s'ha dictat l'acte. L'incompliment d'aquest termini no determina per si sol la nul·litat de l'acte.","El termini de 10 dies naturals per practicar la notificació es computa des de l'endemà de la data en què s'ha dictat l'acte.","Si la notificació no es practica en el termini de 10 dies hàbils, l'acte administratiu esdevé automàticament anul·lable."],"c":0,"ex":["La notificació s'ha de cursar en 10 dies des que es dicta l'acte; en dies, si no es diu res, són hàbils.","El termini es compta en dies hàbils, no naturals.","Dies hàbils, no naturals.","L'incompliment del termini de notificació és una irregularitat, no una causa d'anul·labilitat automàtica."],"clau":"Notificar: 10 dies hàbils des que es dicta l'acte.","ref":"arts. 30.2 i 40.2 LPAC"},{"id":"R871-14","b":"2","t":"2.4","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 14","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":14,"k":"teoria","tr":"concepte","q":"D'acord amb la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques, quin principi permet que les qüestions incidentals plantejades durant la tramitació no suspenguin, amb caràcter general, el procediment?","op":["El principi d'antiformalisme.","El principi d'oficialitat.","El principi d'economia procedimental.","El principi de contradicció."],"c":2,"ex":["L'antiformalisme relaxa les exigències de forma, no la continuïtat del tràmit.","L'oficialitat és l'impuls d'ofici del procediment.","Per economia procedimental, les incidències (recusació a part) no aturen el procediment.","La contradicció garanteix l'audiència de les parts."],"clau":"Les incidències no suspenen: economia procedimental.","ref":"arts. 71 i 74 LPAC"},{"id":"R871-15","b":"2","t":"2.5","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 15","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":15,"k":"teoria","tr":"requisit","q":"La revisió d'ofici d'actes administratius nuls en l'àmbit de l'Administració de la Generalitat de Catalunya:","op":["Pot iniciar-se d'ofici o a sol·licitud d'una persona interessada i requereix, amb caràcter previ a la declaració de nul·litat, el dictamen favorable de l'òrgan consultiu corresponent.","Només pot iniciar-se a instància d'una persona interessada i el dictamen de la Comissió Jurídica Assessora té caràcter merament facultatiu.","Permet declarar la nul·litat d'actes anul·lables en qualsevol moment, sense necessitat de seguir un procediment contradictori.","Té un termini màxim per resoldre de 3 mesos. Un cop transcorregut aquest termini, es produeix silenci estimatori."],"c":0,"ex":["Iniciació d'ofici o a sol·licitud, en qualsevol moment, amb dictamen previ favorable de la Comissió Jurídica Assessora.","També s'inicia d'ofici i el dictamen és preceptiu i vinculant en sentit favorable.","Els actes anul·lables no es revisen per aquesta via, sinó per declaració de lesivitat.","El termini és de sis mesos; el silenci és desestimatori (a sol·licitud) o caducitat (d'ofici)."],"clau":"Revisió de nuls: d'ofici o a sol·licitud, sempre amb dictamen favorable de la CJA.","ref":"art. 106 LPAC; Llei 5/2005 (CJA)"},{"id":"R871-16","b":"4","t":"4.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 16","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":16,"k":"teoria","tr":"concepte","q":"En quin capítol del pressupost d'ingressos de la Generalitat de Catalunya s'inclouen els recursos procedents de l'emissió de deute públic i de l'obtenció de préstecs?","op":["Capítol VIII: variació d'actius financers.","Capítol VII: transferències de capital.","Capítol V: ingressos patrimonials.","Capítol IX: variació de passius financers."],"c":3,"ex":["Els actius financers són el que l'Administració presta o inverteix, no el que demana.","Les transferències de capital són aportacions d'altres sense contraprestació.","Els ingressos patrimonials són rendes del patrimoni propi.","Emetre deute o rebre préstecs augmenta els passius financers: capítol IX."],"clau":"Endeutament = capítol IX (passius financers).","ref":"Estructura pressupostària de la Generalitat"},{"id":"R871-17","b":"6","t":"6.9","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 17","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":17,"k":"teoria","tr":"termini","q":"El mandat del director o directora de l'Oficina Antifrau és de 6 anys:","op":["Des de la data en què és elegit pel Parlament.","Des de la data de publicació del seu nomenament al Diari Oficial de la Generalitat de Catalunya.","A comptar al cap de 20 dies d'haver-se publicat el nomenament al Diari Oficial de la Generalitat de Catalunya.","A partir de l'endemà de la data de publicació del seu nomenament al Diari Oficial de la Generalitat de Catalunya."],"c":0,"ex":["La Llei de l'Oficina Antifrau fixa l'inici del mandat en la data de l'elecció pel Parlament.","La publicació al DOGC no marca l'inici del mandat.","No hi ha cap termini de 20 dies.","Tampoc és l'endemà de la publicació."],"clau":"Antifrau: el mandat comença el dia de l'elecció al Parlament.","ref":"art. 10 Llei 14/2008","rev":"Comprova la durada del mandat (l'examen diu 6 anys) en el text consolidat de la Llei 14/2008"},{"id":"R871-18","b":"A","t":"A.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 18","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":18,"k":"teoria","tr":"concepte","q":"Quin dret fonamental regula la Llei orgànica 5/2024, d'11 de novembre?","op":["El dret a la llibertat religiosa.","El dret a l'exercici del vot.","El dret de defensa.","El dret a la regulació de l'eutanàsia."],"c":2,"ex":["La llibertat religiosa la regula la LO 7/1980.","El règim electoral és la LO 5/1985.","La LO 5/2024 és la Llei del dret de defensa.","L'eutanàsia és la LO 3/2021."],"clau":"LO 5/2024 = dret de defensa.","ref":"LO 5/2024, d'11 de novembre, del dret de defensa","rev":"Bloc d'actualitat: revisar el setembre de 2026"},{"id":"R871-19","b":"A","t":"A.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 19","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":19,"k":"teoria","tr":"concepte","q":"Quin país de la Unió Europea es va incorporar a la zona euro l'1 de gener de 2026?","op":["Dinamarca.","Bulgària.","Croàcia.","Romania."],"c":1,"ex":["Dinamarca té una clàusula d'exclusió i manté la corona.","Bulgària va adoptar l'euro l'1 de gener de 2026 i és el membre 21 de la zona euro.","Croàcia hi va entrar l'1 de gener de 2023.","Romania encara no compleix els criteris de convergència."],"clau":"Euro 2023 Croàcia, euro 2026 Bulgària: 21 Estats.","ref":"Decisions del Consell de la UE de juliol de 2025","rev":"Bloc d'actualitat"},{"id":"R871-20","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 20","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":20,"k":"teoria","tr":"quantia","q":"D'acord amb l'article 20.1 de la Llei 9/2017, de 8 de novembre, de contractes del sector públic, estan subjectes a regulació harmonitzada els contractes d'obres, de concessió d'obres i de concessió de serveis amb un valor estimat igual o superior a:","op":["5.538.000 euros.","2.750.000 euros.","3.143.000 euros.","4.221.000 euros."],"c":0,"ex":["Llindar d'obres i concessions vigent en la data de l'examen (bienni 2024-2025).","Cap llindar europeu coincideix amb aquesta xifra.","Xifra inventada.","Xifra inventada."],"clau":"Obres i concessions harmonitzades: al voltant dels 5,5 milions (es revisa cada dos anys).","ref":"art. 20.1 LCSP","rev":"Els llindars es revisen cada dos anys: comprova el vigent per al bienni 2026-2027"},{"id":"R871-21","b":"3","t":"3.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 21","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":21,"k":"teoria","tr":"termini","q":"D'acord amb l'article 42.4 de la Llei 38/2003, de 17 de novembre, general de subvencions, quin és el termini màxim per resoldre i notificar la resolució del procediment de reintegrament des de la data de l'acord d'iniciació?","op":["6 mesos.","9 mesos.","12 mesos.","18 mesos."],"c":2,"ex":["Sis mesos és el termini general de la LPAC per resoldre, però la LGS en fixa un d'específic.","No és el termini legal.","La Llei general de subvencions fixa 12 mesos; passat el termini, caduca el procediment.","No és el termini legal."],"clau":"Reintegrament de subvencions: 12 mesos, si no, caducitat.","ref":"art. 42.4 LGS"},{"id":"R871-22","b":"2","t":"2.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 22","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":22,"k":"teoria","tr":"concepte","q":"D'acord amb la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques, quin dels supòsits següents comporta la nul·litat de ple dret d'un acte administratiu?","op":["Un acte dictat per un òrgan competent per raó de la matèria però incompetent per raó del grau, quan el vici no ha estat objecte de recurs en termini.","Un acte administratiu dictat amb omissió d'un tràmit essencial del procediment, sempre que s'acrediti que el contingut final hauria estat el mateix sense l'omissió del tràmit.","Un acte dictat fora de termini en un procediment sancionador, quan el termini té caràcter ordinari i no essencial.","Un acte exprés mitjançant el qual s'atorga un dret subjectiu sense que es compleixin els requisits essencials exigits per l'ordenament jurídic per a la seva adquisició."],"c":3,"ex":["La incompetència jeràrquica és anul·lable i convalidable; només la material o territorial manifesta és nul·la.","Si el resultat hauria estat el mateix, és una irregularitat sense efecte invalidant.","Actuar fora de termini només anul·la si la naturalesa del termini ho imposa.","Adquirir facultats o drets sense els requisits essencials és causa de nul·litat de ple dret."],"clau":"Drets adquirits sense requisits essencials: nul de ple dret.","ref":"art. 47.1.f LPAC"},{"id":"R871-23","b":"6","t":"6.6","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 23","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":23,"k":"teoria","tr":"concepte","q":"El model de govern de les dades de l'Administració de la Generalitat de Catalunya i del seu sector públic es basa en una adaptació de la metodologia internacional anomenada:","op":["DAMA (Data Administration Management Association).","Norma ISO 8000.","TOGAF (The Open Group Architecture Framework).","FAIR (Findable, Accessible, Interoperable & Reusable)."],"c":0,"ex":["El model de govern de les dades de la Generalitat adapta el marc DAMA (DMBOK).","ISO 8000 tracta la qualitat de dades, no és el marc del model.","TOGAF és un marc d'arquitectura empresarial.","FAIR són principis per a dades de recerca."],"clau":"Govern de les dades de la Generalitat: adaptació de DAMA.","ref":"Model de govern de les dades de la Generalitat (Acord GOV)"},{"id":"R871-24","b":"6","t":"6.7","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 24","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":24,"k":"teoria","tr":"concepte","q":"El Portal de la transparència ha d'incloure:","op":["L'organització institucional i l'estructura procedimental.","El Registre de grups d'interès.","Qualsevol matèria d'interès públic i les informacions demanades amb menys freqüència per via de l'exercici del dret d'accés a la informació pública.","Les decisions i les actuacions amb rellevància jurídica general."],"c":1,"ex":["La llei parla d'organització institucional i estructura administrativa, no procedimental.","El Registre de grups d'interès és contingut obligatori del Portal de la transparència.","Han de constar les informacions demanades amb més freqüència, no amb menys.","Formulació que no coincideix amb la llei."],"clau":"Portal de la transparència: hi ha el Registre de grups d'interès.","ref":"arts. 5 i 47 Llei 19/2014"},{"id":"R871-25","b":"2","t":"2.4","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 25","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":25,"k":"teoria","tr":"encreuament","q":"D'acord amb l'article 40 del Decret 76/2020, de 4 d'agost, d'Administració digital, són funcions de les oficines d'atenció ciutadana:","op":["Assistir, en l'ús de mitjans electrònics, les persones interessades no obligades a relacionar-se electrònicament amb l'Administració que ho sol·licitin, especialment pel que fa a la identificació i el certificat digital en nom seu i a la presentació de sol·licituds a través del Registre electrònic general.","Assistir, en l'ús de mitjans electrònics, les persones interessades obligades a relacionar-se electrònicament amb l'Administració que ho sol·licitin, especialment pel que fa a la identificació i la signatura electrònica en nom seu i a la presentació de sol·licituds a través del Registre electrònic general.","Assistir, en l'ús de mitjans electrònics, les persones interessades obligades a relacionar-se electrònicament amb l'Administració que ho sol·licitin, especialment pel que fa a la identificació i el certificat digital en nom seu i a la presentació de sol·licituds a través del Registre electrònic general.","Assistir, en l'ús de mitjans electrònics, les persones interessades no obligades a relacionar-se electrònicament amb l'Administració que ho sol·licitin, especialment pel que fa a la identificació i la signatura electrònica en nom seu i a la presentació de sol·licituds a través del Registre electrònic general."],"c":3,"ex":["L'assistència inclou la signatura electrònica, no el certificat digital.","Els obligats a relacionar-se electrònicament no reben aquesta assistència.","Ni obligats ni certificat.","Assistència als no obligats, en identificació i signatura electrònica en nom seu i presentació al Registre electrònic."],"clau":"OAC: assisteix els no obligats, identifica i signa per ells.","ref":"art. 40 Decret 76/2020"},{"id":"R871-26","b":"5","t":"5.5","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 26","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":26,"k":"teoria","tr":"encreuament","q":"El delicte de prevaricació dels funcionaris públics pot comportar:","op":["Pena d'inhabilitació especial per a ocupació o càrrec públic per un termini de 9 a 15 anys.","Pena d'inhabilitació especial per a ocupació o càrrec públic i per a l'exercici del dret de sufragi passiu per un termini de 9 a 15 anys.","Pena d'inhabilitació especial per a ocupació o càrrec públic per un termini de 3 a 6 anys.","Pena d'inhabilitació especial per a ocupació o càrrec públic i per a l'exercici del dret de sufragi passiu per un termini de 3 a 6 anys."],"c":1,"ex":["Falta la inhabilitació per al sufragi passiu.","Inhabilitació especial per a ocupació o càrrec públic i per al sufragi passiu, de 9 a 15 anys.","Ni la durada ni l'abast són correctes.","La durada és de 9 a 15 anys."],"clau":"Prevaricació: inhabilitació 9 a 15 anys, càrrec i sufragi passiu.","ref":"art. 404 CP"},{"id":"R871-27","b":"2","t":"2.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 27","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":27,"k":"teoria","tr":"composicio","q":"D'acord amb l'article 17 de la Llei 26/2010, de 3 d'agost, de règim jurídic i de procediment de les administracions públiques de Catalunya, amb quina assistència s'entén vàlidament constituït un òrgan col·legiat en segona convocatòria, si les normes pròpies de l'òrgan no preveuen res específic?","op":["Amb 1/3 dels membres, amb un mínim de 3.","Amb 2/3 dels membres.","Amb la meitat, com a mínim, dels membres.","Amb 1/3 dels membres, amb un mínim de 4."],"c":0,"ex":["En segona convocatòria n'hi ha prou amb un terç dels membres, i mai menys de tres.","Dos terços no és cap quòrum de la llei.","La meitat és el quòrum de la primera convocatòria.","El mínim és de tres membres, no de quatre."],"clau":"Òrgans col·legiats catalans: primera convocatòria la meitat, segona un terç (mínim 3).","ref":"art. 17 Llei 26/2010"},{"id":"R871-28","b":"2","t":"2.4","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 28","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":28,"k":"teoria","tr":"concepte","q":"D'acord amb l'article 3 del Decret 232/2013, de 15 d'octubre, pel qual es crea la Seu electrònica, com es defineix la interoperabilitat?","op":["Com el mitjà d'interacció entre l'Administració i la ciutadania, les empreses i les entitats per a la prestació de serveis i la difusió d'informació.","Com el conjunt de dades amb contingut i significat complet, estructurat de manera que pugui ser identificat, consultat o analitzat en suport electrònic.","Com el procediment mitjançant el qual es garanteixen la protecció i la confidencialitat de les dades en les comunicacions electròniques de les administracions.","Com la capacitat de les organitzacions per compartir la informació dels seus sistemes d'informació i dels procediments als quals donen suport, per assolir objectius comuns i possibilitar l'intercanvi d'informació entre aquests."],"c":3,"ex":["Aquesta és la definició de seu electrònica o de canal d'atenció, no d'interoperabilitat.","Això defineix el document o el conjunt de dades.","La seguretat i la confidencialitat són una altra cosa.","Interoperabilitat: capacitat de compartir informació entre sistemes i procediments per assolir objectius comuns."],"clau":"Interoperabilitat = sistemes que es parlen i comparteixen informació.","ref":"art. 3 Decret 232/2013"},{"id":"R871-29","b":"4","t":"4.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 29","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":29,"k":"teoria","tr":"concepte","q":"D'acord amb l'article 2 de la Llei 18/2010, de 7 de juny, de la Sindicatura de Comptes, quina funció correspon a la Sindicatura de Comptes?","op":["La funció interventora o fiscalització prèvia plena, que pot ser substituïda, en els supòsits que es determinin, per una fiscalització prèvia per mostreig.","La fiscalització dels comptes de la totalitat dels ingressos i de les despeses del sector públic de Catalunya.","L'enjudiciament de la responsabilitat comptable en què incorrin els que tenen a càrrec seu la gestió de cabals o efectes públics.","La fiscalització externa, permanent i consumptiva de l'activitat economicofinancera del sector públic."],"c":1,"ex":["La funció interventora és de la Intervenció General (control intern).","La Sindicatura fiscalitza externament els comptes de tots els ingressos i despeses del sector públic de Catalunya.","L'enjudiciament comptable és del Tribunal de Comptes.","Formulació incorrecta: el control de la Sindicatura és extern i consuntiu, però no és la definició de l'article 2."],"clau":"Intervenció = control intern previ; Sindicatura = fiscalització externa de tot el sector públic; Tribunal de Comptes = enjudicia.","ref":"art. 2 Llei 18/2010"},{"id":"R871-30","b":"6","t":"6.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 30","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":30,"k":"teoria","tr":"organ","q":"D'acord amb l'article 16 de la Llei 13/2005, de 27 de desembre, del règim d'incompatibilitats dels alts càrrecs al servei de la Generalitat, quin és l'òrgan administratiu competent per instruir i resoldre els expedients relatius a les declaracions d'activitats, patrimonials i d'interessos dels alts càrrecs?","op":["La Secretaria d'Administració i Funció Pública.","El Gabinet Jurídic.","La Comissió Jurídica Assessora.","El conseller o consellera corresponent."],"c":0,"ex":["L'òrgan competent en matèria de funció pública instrueix i resol els expedients de declaracions dels alts càrrecs.","El Gabinet Jurídic assessora i representa la Generalitat.","La Comissió Jurídica Assessora és l'òrgan consultiu.","No és competència de cada conseller."],"clau":"Declaracions d'alts càrrecs: les gestiona Funció Pública.","ref":"art. 16 Llei 13/2005"},{"id":"R871-31","b":"1","t":"1.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 31","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":31,"k":"teoria","tr":"concepte","q":"Quina naturalesa jurídica té l'Estatut d'autonomia de Catalunya?","op":["Reial decret legislatiu.","Llei ordinària.","Reial decret llei.","Llei orgànica."],"c":3,"ex":["Un reial decret legislatiu és una norma del Govern amb rang de llei per delegació.","Els estatuts d'autonomia tenen reserva de llei orgànica.","El reial decret llei és una norma d'urgència del Govern.","L'Estatut s'aprova com a llei orgànica (LO 6/2006), tot i ser la norma institucional bàsica de Catalunya."],"clau":"Estatut = llei orgànica de les Corts, norma institucional bàsica.","ref":"art. 81 i 147 CE; LO 6/2006"},{"id":"R871-32","b":"6","t":"6.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 32","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":32,"k":"teoria","tr":"encreuament","q":"D'acord amb l'article 13 de la Llei 13/2005, de 27 de desembre, del règim d'incompatibilitats dels alts càrrecs al servei de la Generalitat, els alts càrrecs de la Generalitat han de formular una declaració patrimonial i d'interessos:","op":["En el termini de 2 mesos a comptar des de la data de presa de possessió i des de la data de cessament, i també en el termini de 2 mesos des que es produeixen variacions en els fets declarats.","En el termini de 3 mesos a comptar des de la data de presa de possessió i des de la data de cessament, i també en el termini d'1 mes des que es produeixen variacions en els fets declarats.","En el termini d'1 mes a comptar des de la data de presa de possessió i des de la data de cessament, i també en el termini de 2 mesos des que es produeixen variacions en els fets declarats.","En el termini de 4 mesos a comptar des de la data de presa de possessió i des de la data de cessament, i també en el termini de 3 mesos des que es produeixen variacions en els fets declarats."],"c":1,"ex":["No són dos mesos.","Tres mesos des de la presa de possessió i des del cessament, i un mes per comunicar variacions.","No és un mes i dos mesos.","No són quatre i tres mesos."],"clau":"Declaració patrimonial d'alts càrrecs: 3 mesos en entrar i sortir, 1 mes per als canvis.","ref":"art. 13 Llei 13/2005"},{"id":"R871-33","b":"1","t":"1.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 33","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":33,"k":"teoria","tr":"concepte","q":"D'acord amb l'article 132.1 de la Constitució espanyola, la llei regula el règim jurídic dels béns de domini públic i dels béns comunals inspirant-se en els principis:","op":["D'imparcialitat, jerarquia i capacitat.","D'igualtat, progressivitat i solidaritat.","D'inalienabilitat, imprescriptibilitat i inembargabilitat.","D'integritat, objectivitat i transparència."],"c":2,"ex":["Són principis de l'Administració, no del domini públic.","Són principis del sistema tributari.","El domini públic és inalienable, imprescriptible i inembargable.","Principis d'ètica pública, no del domini públic."],"clau":"Domini públic: les tres i (inalienable, imprescriptible, inembargable).","ref":"art. 132.1 CE"},{"id":"R871-40","b":"A","t":"A.2","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 40","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":40,"k":"teoria","tr":"requisit","q":"D'acord amb l'article 40 bis de la Llei 26/2010, de règim jurídic i de procediment de les administracions públiques de Catalunya, afegit per la Llei 9/2025, de 13 de novembre, quin tipus de consentiment es necessita per a la prestació de serveis proactius i personalitzats?","op":["Consentiment exprés i específic, informat i inequívoc de la persona interessada.","Consentiment general o indeterminat d'accés a la prestació de serveis proactius i personalitzats.","Consentiment exprés i no específic, informat i inequívoc de la persona interessada.","No cal consentiment exprés en aquests casos; es produeix en el moment d'accés a la prestació de serveis proactius i personalitzats."],"c":0,"ex":["Els serveis proactius requereixen consentiment exprés, específic, informat i inequívoc.","Un consentiment genèric no serveix.","Ha de ser específic.","Sí que cal consentiment exprés."],"clau":"Serveis proactius: consentiment exprés i específic (Llei 9/2025).","ref":"art. 40 bis Llei 26/2010 (afegit per la Llei 9/2025)","rev":"Bloc d'actualitat: pregunta de la part específica del cos superior"},{"id":"R871-41","b":"A","t":"A.3","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 871, 27-06-2026, pregunta 41","exam":"871","exnom":"Cos superior d'administració general, opció general (procés 871, 27-06-2026), part comuna","num":41,"k":"teoria","tr":"concepte","q":"D'acord amb el punt 42 del Reglament (UE) 2024/1183 del Parlament Europeu i el Consell d'11 d'abril de 2024, pel qual es modifica el Reglament UE 910/2014 relatiu al marc europeu d'identitat digital, què és la cartera europea d'identitat digital?","op":["Un llibre major electrònic qualificat creat i gestionat per un o més prestadors qualificats de serveis de confiança que permet fer transaccions entre els estats membres de la Unió Europea.","Un mitjà d'identificació electrònica que permet a l'usuari emmagatzemar, gestionar i validar de manera segura dades d'identificació de la persona i declaracions electròniques d'atributs.","És un arxiu electrònic de serveis qualificats prestats per prestadors qualificats que permet l'emmagatzemament de dades dels països de la Unió Europea.","És un tipus de signatura electrònica avançada que permet a l'usuari signar amb altres usuaris d'estats membres de la Unió Europea."],"c":1,"ex":["Això descriu un llibre major electrònic, un altre servei de confiança.","La cartera d'identitat digital és un mitjà d'identificació electrònica per guardar, gestionar i validar dades d'identitat i declaracions d'atributs.","No és cap arxiu de serveis.","No és una signatura, tot i que permet signar."],"clau":"Cartera europea d'identitat digital: mitjà d'identificació que guarda i valida atributs.","ref":"Reglament (UE) 2024/1183 (eIDAS 2)","rev":"Bloc d'actualitat"},{"id":"R894-01","b":"6","t":"6.7","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 1","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":1,"k":"teoria","tr":"encreuament","q":"D'acord amb l'article 42 de la Llei 19/2014, del 29 de desembre, de transparència, accés a la informació pública i bon govern, quin és el termini per interposar una reclamació davant la Comissió de Garantia del Dret d'Accés a la Informació Pública en el cas d'una denegació expressa a la sol·licitud d'accés a la informació pública?","op":["1 mes a comptar de la data en què l'òrgan dicta la resolució.","10 dies a comptar de la data en què l'òrgan dicta la resolució.","1 mes a comptar de la notificació de la resolució.","10 dies a comptar de la notificació de la resolució."],"c":2,"ex":["El còmput va des de la notificació, no des que es dicta.","Ni el termini ni l'inici del còmput són correctes.","Un mes des de la notificació de la resolució expressa.","El termini és d'un mes."],"clau":"Reclamació a la GAIP: un mes des de la notificació.","ref":"art. 42 Llei 19/2014"},{"id":"R894-02","b":"6","t":"6.7","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 2","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":2,"k":"teoria","tr":"requisit","q":"D'acord amb la Llei 19/2014, del 29 de desembre, de transparència, accés a la informació pública i bon govern, com s'ha de fer pública la informació subjecta al règim de publicitat activa?","op":["De manera clara, estructurada i, només a petició de la persona sol·licitant, en format reutilitzable.","De manera clara, estructurada i en format reutilitzable.","De manera clara, estructurada i en un format que preservi la integritat del disseny, la maquetació i els continguts.","De manera clara, estructurada i, únicament, en format reutilitzable quan la Comissió de Garantia del Dret d'Accés a la Informació Pública consideri que la informació té una rellevància econòmica i social."],"c":1,"ex":["El format reutilitzable és obligatori, no a petició.","Clara, estructurada i en format reutilitzable.","Preservar el disseny no és el criteri; ho és la reutilització.","La GAIP no decideix el format."],"clau":"Publicitat activa: clara, estructurada i reutilitzable.","ref":"art. 6 Llei 19/2014"},{"id":"R894-03","b":"6","t":"6.7","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 3","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":3,"k":"teoria","tr":"requisit","q":"D'acord amb la Llei 19/2014, del 29 de desembre, de transparència, accés a la informació pública i bon govern, en quin dels supòsits següents s'ha de motivar la resolució d'una sol·licitud d'accés a la informació pública?","op":["En tots els casos, independentment de si és estimatòria o desestimatòria.","Quan és estimatòria malgrat l'oposició de terceres persones.","Quan és estimatòria però la persona sol·licitant no ha acreditat un interès personal legítim.","En cap cas s'ha de motivar la resolució."],"c":1,"ex":["No cal motivar l'estimació sense oposició de tercers.","Cal motivar les resolucions desestimatòries i les estimatòries amb oposició de tercers.","L'accés no exigeix acreditar cap interès.","Les desestimatòries sempre s'han de motivar."],"clau":"Motivar: quan es denega i quan s'estima contra l'oposició de tercers.","ref":"art. 34.4 Llei 19/2014"},{"id":"R894-04","b":"6","t":"6.8","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 4","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":4,"k":"teoria","tr":"termini","q":"La notificació, a l'autoritat de control competent, d'una violació de seguretat de les dades de caràcter personal quan comporti un risc per als drets i les llibertats de les persones físiques s'ha de fer sense dilació indeguda i, si és possible, en un termini màxim de:","op":["72 hores des que se'n té constància.","48 hores des que es produeix la violació de seguretat.","24 hores des que es produeix la violació de seguretat.","10 dies hàbils des que se'n té constància."],"c":0,"ex":["72 hores des que el responsable en té constància; si passa el termini, cal justificar-ho.","No són 48 hores ni es compta des que es produeix.","No són 24 hores.","No són dies hàbils."],"clau":"Bretxa de seguretat: 72 hores des que se'n té constància.","ref":"art. 33 RGPD"},{"id":"R894-05","b":"6","t":"6.8","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 5","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":5,"k":"teoria","tr":"termini","q":"D'acord amb la Llei orgànica 3/2018, de 5 de desembre, de protecció de dades personals i garantia dels drets digitals, quin és el termini de prescripció de les infraccions greus?","op":["3 anys.","1 any.","6 mesos.","2 anys."],"c":3,"ex":["Tres anys és per a les molt greus.","Un any és per a les lleus.","No hi ha prescripció de sis mesos.","Les greus prescriuen als dos anys."],"clau":"LOPDGDD: lleus 1 any, greus 2, molt greus 3.","ref":"art. 78 LOPDGDD"},{"id":"R894-06","b":"1","t":"1.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 6","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":6,"k":"teoria","tr":"concepte","q":"Quin principi constitucional garanteix que totes les normes inferiors s'han d'ajustar a la Constitució espanyola?","op":["El principi de seguretat jurídica.","El principi de descentralització legislativa.","El principi de jerarquia normativa.","El principi de supletorietat de l'Estat."],"c":2,"ex":["La seguretat jurídica és la certesa del dret, no l'ordenació de les normes.","No és un principi constitucional en aquests termes.","La jerarquia normativa situa la Constitució al capdamunt i obliga les normes inferiors a ajustar-s'hi.","La supletorietat regula la relació entre dret estatal i autonòmic."],"clau":"Normes ordenades de dalt a baix: jerarquia normativa (art. 9.3).","ref":"art. 9.1 i 9.3 CE"},{"id":"R894-07","b":"1","t":"1.1","o":"real","src":"Generalitat de Catalunya, conv. 870, procés 894, 27-06-2026, pregunta 7","exam":"894","exnom":"Cos de titulació superior, escala de psicologia (procés 894, 27-06-2026), part general","num":7,"k":"teoria","tr":"requisit","q":"Quina afirmació és correcta sobre el recurs d'empara constitucional per a la protecció dels drets fonamentals?","op":["Es pot interposar directament contra qualsevol disposició reglamentària sense necessitat d'esgotar la via judicial.","Només és admissible per vulneracions comeses per òrgans de l'Administració, i mai contra resolucions judicials.","Es tramita davant el Tribunal Suprem i el resol el Ple del Consell General del Poder Judicial.","Exigeix, com a regla general, l'esgotament previ de la via judicial i la invocació del dret vulnerat tan aviat com sigui possible."],"c":3,"ex":["No cap contra reglaments directament ni sense esgotar la via judicial.","També cap contra resolucions judicials.","El resol el Tribunal Constitucional.","L'empara és subsidiària: cal esgotar la via judicial i haver invocat el dret al proc
